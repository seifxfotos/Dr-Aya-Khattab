    <style>
        :root {
            --primary-blue: #0093D0; 
            --primary-green: #8CC63F; 
            --bg-color: #f4f7f6; 
            --card-bg: #ffffff;
            --text-dark: #2c3e50; 
            --danger: #e74c3c; 
            --warning: #f39c12;
            --border: #e1e8ed; 
            --input-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #000000; 
            --card-bg: #1e1e1e;
            --text-dark: #e1e8ed; 
            --border: #333333; 
            --input-bg: #2a2a2a;
        }
        
        body.dark-mode .flatpickr-calendar { background: #1e1e1e; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        body.dark-mode .flatpickr-day { color: #e1e8ed; }
        body.dark-mode .flatpickr-day:hover, body.dark-mode .flatpickr-day.selected { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        body.dark-mode .flatpickr-month, body.dark-mode .flatpickr-weekday, body.dark-mode .flatpickr-current-month .flatpickr-monthDropdown-months { color: #e1e8ed; fill: #e1e8ed; }
        body.dark-mode .flatpickr-current-month input.cur-year { color: #e1e8ed; }

        .flatpickr-month { height: 50px !important; overflow: visible !important; }
        .flatpickr-current-month { height: auto !important; line-height: 1.5 !important; padding-top: 8px !important; }
        .flatpickr-current-month .flatpickr-monthDropdown-months { height: auto !important; line-height: inherit !important; padding: 2px !important; appearance: none; }
        .flatpickr-current-month input.cur-year { height: auto !important; line-height: inherit !important; }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: var(--text-dark); transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1250px; margin: 0 auto; }

        .header-section { background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px; }
        .header-section h1 { margin: 0; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px;}
        .nav-links a { color: white; text-decoration: none; font-weight: 700; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 8px; margin-right: 10px; transition: 0.3s; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; font-family: 'Cairo'; }
        .nav-links a:hover { background: rgba(255,255,255,0.3); }

        .theme-switch { position: relative; display: inline-block; width: 64px; height: 34px; margin-right: 10px; vertical-align: middle; }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3b4c5a; transition: .4s; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 7px; box-sizing: border-box; }
        .slider-circle { position: absolute; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; z-index: 3; }
        .theme-switch input:checked + .slider .slider-circle { transform: translateX(30px); }
        .icon { width: 17px; height: 17px; z-index: 1; }

        .card-panel { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid var(--border); transition: background-color 0.3s, border-color 0.3s; }
        .card-panel h2 { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--border); padding-bottom: 10px; color: var(--primary-blue); }

        .input-group { display: flex; flex-direction: column; position: relative; margin-bottom: 15px; overflow: visible !important; }
        .input-group label { font-weight: 700; margin-bottom: 5px; font-size: 14px; color: var(--text-dark); }
        .input-group input { padding: 10px 15px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Cairo'; font-size: 15px; outline: none; transition: 0.3s; background-color: var(--input-bg); color: var(--text-dark); width: 100%; box-sizing: border-box; font-weight: 600; }
        .input-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 8px rgba(0, 147, 208, 0.2); }
        
        ul.custom-autocomplete { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: var(--card-bg); border: 2px solid var(--primary-blue); border-radius: 8px; max-height: 250px; overflow-y: auto; z-index: 99999; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; list-style: none; padding: 0; margin: 0; }
        li.autocomplete-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; color: var(--text-dark); margin: 0; }
        li.autocomplete-item:hover { background: var(--primary-blue); color: white; }
        body.dark-mode li.autocomplete-item:hover { background: #333333; }
        body.dark-mode #patientInfo, body.dark-mode #newPatientSection { background: #1a1a1a !important; border-color: #333333 !important; }

        .grid-4col { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        @media (max-width: 800px) { .grid-4col { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .grid-4col { grid-template-columns: 1fr; } }

        .btn-main { background-color: var(--primary-blue); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); filter: brightness(1.1);}
        .btn-green { background-color: var(--primary-green); }
        
        .diet-table-wrapper { width: 100%; overflow-x: auto; background: var(--card-bg); border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .diet-table { width: 100%; border-collapse: collapse; min-width: 800px; }
        .diet-table th, .diet-table td { padding: 15px; border: 1px solid var(--border); vertical-align: top; }
        .diet-table th { background-color: var(--primary-blue); color: white; font-weight: 800; font-size: 16px; text-align: center; width: 22%;}
        .diet-table th:first-child { width: 12%; }
        .diet-table td { font-size: 14px; font-weight: 600; line-height: 1.7; transition: 0.2s; cursor: pointer; color: var(--text-dark); }
        .diet-table td:first-child { font-weight: 800; color: var(--primary-blue); text-align: center; vertical-align: middle; font-size: 16px; background: #f8fbfd;}
        .diet-table td:hover:not(:first-child) { box-shadow: inset 0 0 0 2px var(--primary-blue); }
        body.dark-mode .diet-table th { background-color: #222222; }
        body.dark-mode .diet-table td:first-child { background: #1a1a1a; color: #4fa3d1; }
        body.dark-mode .diet-table td:hover:not(:first-child) { background-color: #222222; }
