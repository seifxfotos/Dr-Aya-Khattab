<html lang="ar" dir="rtl">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الدايت - د. آية خطاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Flatpickr (Custom Calendar) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ar.js"></script>

    <!-- Firebase (محتفظين به عشان حفظ ونظام الدايت) -->

    <style>
        :root {
            --primary-blue: #0093D0; 
            --primary-green: #8CC63F; 
            --bg-color: #f4f7f6; 
            --card-bg: #ffffff;
            --text-dark: #2c3e50; 
            --danger: #e74c3c; 
            --warning: #f39c12;
            --border: #e1e8ed; 
            --input-bg: #ffffff;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg-color: #000000; 
            --card-bg: #1e1e1e;
            --text-dark: #e1e8ed; 
            --border: #333333; 
            --input-bg: #2a2a2a;
        }
        
        /* Flatpickr Dark Mode Overrides */
        body.dark-mode .flatpickr-calendar { background: #1e1e1e; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        body.dark-mode .flatpickr-day { color: #e1e8ed; }
        body.dark-mode .flatpickr-day:hover, body.dark-mode .flatpickr-day.selected { background: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        body.dark-mode .flatpickr-month, body.dark-mode .flatpickr-weekday, body.dark-mode .flatpickr-current-month .flatpickr-monthDropdown-months { color: #e1e8ed; fill: #e1e8ed; }
        body.dark-mode .flatpickr-current-month input.cur-year { color: #e1e8ed; }

        .flatpickr-month { height: 50px !important; overflow: visible !important; }
        .flatpickr-current-month { height: auto !important; line-height: 1.5 !important; padding-top: 8px !important; }
        .flatpickr-current-month .flatpickr-monthDropdown-months { height: auto !important; line-height: inherit !important; padding: 2px !important; appearance: none; }
        .flatpickr-current-month input.cur-year { height: auto !important; line-height: inherit !important; }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-dark); 
            transition: background-color 0.3s, color 0.3s;
        }

        .container { max-width: 1250px; margin: 0 auto; }

        /* Header */
        .header-section { 
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            flex-wrap: wrap; 
            gap: 15px;
        }
        .header-section h1 { margin: 0; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 8px;}
        
        .nav-links a { 
            color: white; 
            text-decoration: none; 
            font-weight: 700; 
            padding: 8px 15px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 8px; 
            margin-right: 10px; 
            transition: 0.3s; 
            border: 1px solid transparent; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cairo';
        }
        .nav-links a:hover { background: rgba(255,255,255,0.3); }

        /* Custom Toggle Switch */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 64px;
            height: 34px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .theme-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3b4c5a; transition: .4s; border-radius: 34px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 7px; box-sizing: border-box;
        }
