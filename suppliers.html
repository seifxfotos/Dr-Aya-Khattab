<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المستهلكات والموردين | عيادة د. آية خطاب</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

        /* المتغيرات الأساسية - متطابقة مع ألوان موقعك */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            
            /* ألوان النيون المميزة من صور الموقع */
            --accent-blue: #00a8cc; /* الأزرق السماوي */
            --accent-green: #7dc544; /* الأخضر الزاهي */
            --accent-red: #e74c3c;
            --accent-yellow: #f1c40f;
            
            --border-dark: #333333;
            --input-bg: #121212;
            
            --shadow-neon-blue: 0 0 10px rgba(0, 168, 204, 0.2);
            --shadow-neon-green: 0 0 10px rgba(125, 197, 68, 0.2);
        }

        /* وضع اللايت مود (لو المستخدم حابب يعكس) */
        body.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --border-dark: #cccccc;
            --input-bg: #f9f9f9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif; /* خط متناسق مع التصميمات العربية الحديثة */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.3s ease;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* حاوية الصفحة الرئيسية */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* الهيدر الأخضر العلوي */
        .main-header {
            background: linear-gradient(90deg, #6bb344, #88c751);
            border-radius: 12px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            box-shadow: var(--shadow-neon-green);
        }

        .main-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 15px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(0,0,0,0.4);
            box-shadow: 0 0 8px rgba(0,0,0,0.3);
        }

        /* تصميم الكروت (البطاقات الداكنة) */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 25px;
            position: relative;
        }

        /* إضافة لمسة الإطار الأزرق زي كارت المريض */
        .card.bordered-blue {
            border: 1px solid var(--accent-blue);
            box-shadow: var(--shadow-neon-blue);
        }

        .card-header {
            color: var(--accent-blue);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* تصميم الفورم (نموذج الإدخال) */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .input-group input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-green);
            box-shadow: var(--shadow-neon-green);
        }

        /* أزرار الأكشن */
        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            color: #fff;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }

        .btn-blue {
            background-color: var(--accent-blue);
        }
        .btn-blue:hover {
            background-color: #008ba8;
            box-shadow: var(--shadow-neon-blue);
        }

        /* تصميم الجدول (متطابق مع صفحة العيادة اليومية) */
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        thead tr {
            background-color: var(--accent-blue);
            color: #fff;
        }

        th {
            padding: 15px 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-dark);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
        }

        tbody tr {
            background-color: var(--card-bg);
            transition: 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* زر الدارك مود السفلي */
        .theme-switch-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .theme-switch {
            background-color: var(--card-bg);
            border: 1px solid var(--border-dark);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .theme-switch:hover {
            border-color: var(--accent-blue);
        }

        /* حالة التحميل */
        .loading-text {
            color: var(--accent-blue);
            font-weight: 700;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر الأخضر -->
        <header class="main-header">
            <div>
                <h1>المستهلكات والموردين</h1>
                <span style="font-size: 0.85rem; opacity: 0.9;">تنظيم فواتير المستهلكات وتوريدات العيادة</span>
            </div>
            <nav class="nav-links">
                <a href="all.html">الرئيسية</a>
                <a href="suppliers.html" class="active">الموردين</a>
                <a href="pharma.html">الشركات</a>
            </nav>
        </header>

        <!-- كارت الإضافة (بإطار أزرق نيون) -->
        <div class="card bordered-blue">
            <div class="card-header">
                <span>➕ إضافة بيان توريد جديد</span>
            </div>
            
            <form id="addForm">
                <div class="form-grid">
                    <div class="input-group">
                        <label>أسم المورد</label>
                        <input type="text" id="supplierName" placeholder="أدخل اسم المورد..." required>
                    </div>
                    <div class="input-group">
                        <label>أسم الصنف</label>
                        <input type="text" id="itemName" placeholder="اسم المنتج..." required>
                    </div>
                    <div class="input-group">
                        <label>الكمية / العدد</label>
                        <input type="number" id="itemCount" placeholder="0" required>
                    </div>
                    <div class="input-group">
                        <label>سعر الصنف (الإجمالي)</label>
                        <input type="number" id="itemPrice" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label>تاريخ الوارد</label>
                        <input type="date" id="dateIn" required>
                    </div>
                    <div class="input-group">
                        <label>تاريخ الصادر</label>
                        <input type="date" id="dateOut">
                    </div>
                    <button type="submit" class="btn btn-blue" id="submitBtn">حفظ البيانات</button>
                </div>
            </form>
        </div>

        <!-- كارت عرض البيانات (الجدول) -->
        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>أسم المورد</th>
                            <th>أسم الصنف</th>
                            <th>عدد الصنف</th>
                            <th>سعر الصنف</th>
                            <th>تاريخ وارد</th>
                            <th>تاريخ صادر</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6" class="loading-text">جاري مزامنة البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- زر تبديل الوضع (موجود أسفل اليمين زي كارت المريض) -->
    <div class="theme-switch-wrapper">
        <button class="theme-switch" id="themeToggle" title="تبديل الإضاءة">🌙</button>
    </div>

    <script>
        // رابط API الخاص بك
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyh8jKpXbL42YwG_eb2FD9YtTl6diJ0JH5y2hl5yN6VpXnbpsi0dlkkhBzgPpCjIXVr/exec';

        // -----------------------------------------------------
        // 1. نظام الدارك/لايت مود 
        // -----------------------------------------------------
        const themeToggleBtn = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('clinicTheme');

        // الوضع الافتراضي هو الدارك مود بناءً على تصميمك
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('clinicTheme', isLight ? 'light' : 'dark');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
        });

        // -----------------------------------------------------
        // 2. جلب البيانات وعرضها في الجدول (GET)
        // -----------------------------------------------------
        function loadData() {
            const tableBody = document.getElementById('tableBody');
            
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = ''; 
                    
                    if (data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" style="color:var(--text-muted);">لا توجد بيانات مسجلة بعد.</td></tr>';
                        return;
                    }

                    data.forEach(row => {
                        const formatDate = (dateStr) => {
                            if(!dateStr) return '-';
                            try { return dateStr.split('T')[0]; } catch(e) { return dateStr; }
                        };

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="color: var(--accent-blue);">${row['أسم المورد'] || '-'}</td>
                            <td>${row['أسم الصنف'] || '-'}</td>
                            <td><span style="background:#2ecc71; color:#000; padding:2px 8px; border-radius:12px;">${row['عدد الصنف'] || '-'}</span></td>
                            <td style="color: var(--accent-yellow);">${row['سعر الصنف'] || '-'} ج.م</td>
                            <td>${formatDate(row['تاريخ وارد'])}</td>
                            <td>${formatDate(row['تاريخ صادر'])}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(error => {
                    tableBody.innerHTML = '<tr><td colspan="6" style="color:var(--accent-red);">حدث خطأ في جلب البيانات من الخادم.</td></tr>';
                    console.error('Error fetching data:', error);
                });
        }

        loadData();

        // -----------------------------------------------------
        // 3. إرسال البيانات من الفورم للشيت (POST)
        // -----------------------------------------------------
        const addForm = document.getElementById('addForm');
        const submitBtn = document.getElementById('submitBtn');

        addForm.addEventListener('submit', (e) => {
            e.preventDefault(); 
            
            const originalBtnText = submitBtn.textContent;
            submitBtn.textContent = 'جاري الحفظ... ⏳';
            submitBtn.style.opacity = '0.7';
            submitBtn.disabled = true;

            const formData = {
                supplierName: document.getElementById('supplierName').value,
                itemName: document.getElementById('itemName').value,
                itemCount: document.getElementById('itemCount').value,
                itemPrice: document.getElementById('itemPrice').value,
                dateIn: document.getElementById('dateIn').value,
                dateOut: document.getElementById('dateOut').value
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === 'success') {
                    addForm.reset(); 
                    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="loading-text">جاري تحديث الجدول...</td></tr>';
                    loadData(); 
                }
            })
            .catch(error => {
                console.error('Data sent (CORS expected):', error);
                addForm.reset();
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="loading-text">جاري تحديث الجدول...</td></tr>';
                setTimeout(loadData, 1500); 
            })
            .finally(() => {
                submitBtn.textContent = originalBtnText;
                submitBtn.style.opacity = '1';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
