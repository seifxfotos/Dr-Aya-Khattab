    <style>
        /* =======================================================================
           نفس أكواد الـ CSS الأساسية الخاصة بك (نسخ لصق) لضمان عدم حدوث أي أخطاء
           ======================================================================= */
        :root { --btn-blue: #0096cd; --teal-box: #77b500; --text-dark: #111111; --gray-bg: #e9ecef; }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes whatsapp-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        html { scroll-behavior: smooth; scroll-padding-top: 130px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { font-family: 'Poppins', sans-serif; color: var(--text-dark); line-height: 1.6; background-color: #fff; overflow-x: hidden; }
        html[lang="ar"] body, html[lang="ar"] .btn, html[lang="ar"] input, html[lang="ar"] select, html[lang="ar"] textarea, html[lang="ar"] .lang-btn {

        a { text-decoration: none; color: inherit; }
        .container { width: 90%; max-width: 1200px; margin: auto; }

        /* --- الهيدر (بنفس مقاساتك بالملي) --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #fff; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .header-logo { height: 85px; object-fit: contain; }
        
        .nav-links { display: flex; gap: 30px; align-items: center; font-weight: 600; font-size: 15px; color: var(--text-dark); }
        html[dir="ltr"] .nav-links { margin-left: 40px; }
        html[dir="rtl"] .nav-links { margin-right: 40px; }
        .nav-links a:hover { color: var(--btn-blue); transition: 0.3s; }

        .lang-btn {
            background: rgba(0, 150, 205, 0.1); color: var(--btn-blue); border: 2px solid var(--btn-blue);
            padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer;
            transition: 0.3s; font-family: 'Cairo', sans-serif;
        }
        .lang-btn:hover { background: var(--btn-blue); color: #fff; }

        /* --- ستايل الفورم --- */
        .appointment-sec { padding: 80px 5%; background-color: #f8f9fa; min-height: 70vh; } /* تعديل بسيط لضبط الارتفاع */
        .section-title { font-weight: 800; font-size: 36px; margin-bottom: 20px; color: var(--text-dark); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: span 2; }
        
        input, select, textarea { 
            padding: 14px 16px; border: 1.5px solid #dcdfe6; border-radius: 10px; font-size: 14.5px; width: 100%; outline: none; background-color: #f4f6f8; color: var(--text-dark); transition: all 0.3s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        input:focus, select:focus, textarea:focus { border-color: var(--btn-blue); box-shadow: 0 0 0 4px rgba(0, 150, 205, 0.12); background-color: #ffffff; }

        select { appearance: none; -webkit-appearance: none; -moz-appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230096cd' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; cursor: pointer; }
        html[dir="ltr"] select { background-position: right 16px center; background-size: 16px; padding-right: 45px; }
        html[dir="rtl"] select { background-position: left 16px center; background-size: 16px; padding-left: 45px; }

        label { font-weight: 600; margin-bottom: 8px; display: block; color: var(--text-dark); font-size: 14px; }
        html[dir="ltr"] label { text-align: left; }
        html[dir="rtl"] label { text-align: right; }
        label span:last-child { color: #ff4d4d; }

        .btn-blue { background-color: var(--btn-blue); border-radius: 8px; border: none; cursor: pointer; padding: 14px 30px; width: 100%; font-size: 18px; color: white; font-weight: 600; box-shadow: 0 4px 15px rgba(0, 150, 205, 0.3); transition: all 0.3s ease;}
        .btn-blue:hover { background-color: #006185; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 150, 205, 0.4); }

        /* --- الفوتر (بنفس مقاساتك بالملي) --- */
        .footer { background: linear-gradient(-45deg, #0096cd, #006185, #0096cd, #006185); background-size: 400% 400%; animation: gradientBG 6s ease infinite; color: white; padding: 50px 0 20px 0; }
        .footer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; align-items: center; justify-items: center; margin-bottom: 35px; width: 100%; }
        .footer-left { width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .footer-center { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .footer-right { width: 300px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        .contact-grid { display: flex; flex-direction: row; gap: 12px; margin-top: 12px; justify-content: center; }
        .contact-card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 14px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; color: white; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease, background 0.3s ease; width: 110px;  }
        .contact-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.22); }
        .contact-icon { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 15px; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.4); flex-shrink: 0; }
        .contact-info { text-align: center; width: 100%; }
        .contact-info span { display: block; font-size: 8.5px; color: rgba(255, 255, 255, 0.8); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .contact-info h4 { font-size: 10.5px; font-weight: 700; color: #ffffff; margin-top: 2px; white-space: nowrap; }

        .social-grid { display: flex; flex-direction: row; gap: 12px; margin-top: 12px; justify-content: center; }
        .social-card { background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 14px; padding: 12px 4px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; color: white; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease, background 0.3s ease; width: 70px; }
        .social-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.22); }
        .social-icon { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 15px; color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.4); flex-shrink: 0; }
        .social-card svg { width: 16px; height: 16px; fill: currentColor; }

        .copyright { text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 20px; margin-top: 10px; font-size: 14px; color: white; width: 90%; max-width: 1200px; margin-left: auto; margin-right: auto; }
        
        /* زر الواتساب */
        .whatsapp-float-btn { position: fixed; bottom: 30px; background-color: #25D366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; transition: transform 0.3s; }
        html[dir="ltr"] .whatsapp-float-btn { left: 30px; }
        html[dir="rtl"] .whatsapp-float-btn { right: 30px; left: auto; }
        .whatsapp-float-btn::before, .whatsapp-float-btn::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 50%; background-color: #25D366; z-index: -1; animation: whatsapp-pulse 2s infinite ease-out; }
        .whatsapp-float-btn::after { animation-delay: 1s; }
        .whatsapp-float-btn:hover { transform: scale(1.1); }

        /* الأنيميشن السحري */
        .page-transition-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 100000; opacity: 0; visibility: hidden; transition: all 0.5s ease; }
        .page-transition-overlay.active { opacity: 1; visibility: visible; }
        .cool-loader { display: flex; gap: 8px; position: fixed; top: calc(50% + 70px); left: 50%; transform: translateX(-50%); z-index: 100001; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .cool-loader.active { opacity: 1; visibility: visible; }
        .cool-loader span { width: 14px; height: 14px; border-radius: 50%; background-color: var(--btn-blue); animation: loaderBounce 0.5s alternate infinite cubic-bezier(0.2, 0.65, 0.6, 1); }
        .cool-loader span:nth-child(1) { animation-delay: 0s; }
        .cool-loader span:nth-child(2) { background-color: var(--teal-box); animation-delay: 0.15s; }
        .cool-loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes loaderBounce { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-15px) scale(1.2); } }

        /* --- الموبايل (بنفس مقاساتك الأصلية بالملي) --- */
        @media (max-width: 768px) {
            html { scroll-padding-top: 130px; } 
            .header { flex-direction: column; gap: 10px; }
            .logo { justify-content: center; width: 100%; display: flex; margin: 0 auto; }
            .header-logo { margin: 0 auto; display: block; }
            .nav-links { gap: 15px; font-size: 13px; }
            html[dir="ltr"] .nav-links { margin-left: 0; }
            html[dir="rtl"] .nav-links { margin-right: 0; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .footer-grid { grid-template-columns: 1fr; text-align: center; gap: 25px; justify-items: center; }
            .footer-left { order: 1; width: 100%; align-items: center; }
            .footer-right { order: 2; width: 100%; align-items: center; }
            .footer-center { order: 3; width: 100%; align-items: center; }
            .contact-grid { flex-direction: row; justify-content: center; width: 100%; }
            .contact-card { width: 120px; }
            .social-grid { justify-content: center; }
            .social-card { width: 85px; }
            .whatsapp-float-btn { bottom: 20px; }
            html[dir="ltr"] .whatsapp-float-btn { right: 20px; left: auto; }
            html[dir="rtl"] .whatsapp-float-btn { left: 20px; right: auto; }
        }
    </style>
</head>

    <!-- كود تغيير اللغة السحري (FLIP Animation) -->
    <script>
        function toggleLanguage() {
            const toggleBtn = document.getElementById('langToggle');
            if (toggleBtn.disabled) return;
            toggleBtn.disabled = true;

            const logo = document.getElementById('mainLogo');
            const overlay = document.getElementById('transitionOverlay');
            const loader = document.getElementById('transitionLoader');
            
            const firstRect = logo.getBoundingClientRect();
            const clone = logo.cloneNode(true);
            clone.style.position = 'fixed';
            clone.style.top = firstRect.top + 'px';
            clone.style.left = firstRect.left + 'px';
            clone.style.width = firstRect.width + 'px';
            clone.style.height = firstRect.height + 'px';
            clone.style.margin = '0';
            clone.style.zIndex = '100001';
            clone.style.transform = 'translate(0, 0) scale(1)';
            clone.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)'; 
            document.body.appendChild(clone);
            
            logo.style.opacity = '0';
            overlay.classList.add('active');
            
            requestAnimationFrame(() => {
                clone.style.top = '50%';
                clone.style.left = '50%';
                clone.style.transform = 'translate(-50%, -50%) scale(1.6)';
                
                setTimeout(() => {
                    loader.classList.add('active');
                }, 800);
            });
            
            setTimeout(() => {
                const html = document.documentElement;
                if(html.lang === 'ar') {
                    html.lang = 'en';
                    html.dir = 'ltr';
                    toggleBtn.innerText = 'العربية';
                } else {
                    html.lang = 'ar';
                    html.dir = 'rtl';
                    toggleBtn.innerText = 'English';
                }
                
                document.querySelectorAll('[data-en]').forEach(el => {
                    if (el.tagName.toLowerCase() === 'option' && el.parentElement.name === 'الدولة') {
                        // لا تقم بتحديث نص الدولة لأنها ثابتة للسعودية
                    } else {
                        el.innerHTML = el.getAttribute(`data-${html.lang}`);
                    }
                });

                loader.classList.remove('active');
                void document.body.offsetHeight; 
                
                const newRect = logo.getBoundingClientRect();
                clone.style.transform = 'translate(0, 0) scale(1)';
                clone.style.top = newRect.top + 'px';
                clone.style.left = newRect.left + 'px';
                clone.style.width = newRect.width + 'px';
                clone.style.height = newRect.height + 'px';
                
                overlay.classList.remove('active');
                
                setTimeout(() => {
                    logo.style.opacity = '1';
                    clone.remove();
                    toggleBtn.disabled = false;
                }, 800);
                
            }, 2300); 
        }

        // كود ربط الفورم (حفظ البيانات ثم التحويل للدفع)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxWmta8IDW9WKAdIL7EoC8SEJx3-waFrb5nA9hRzxlg4E_X_OIt7MjUEHc8pR7AH07vdg/exec'; // رابط الشيت
        const form = document.getElementById('bookingForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            const isEnglish = document.documentElement.lang === 'en';
            
            submitBtn.innerHTML = isEnglish ? 'Processing... <i class="fas fa-spinner fa-spin"></i>' : 'جاري التحويل... <i class="fas fa-spinner fa-spin"></i>';
            submitBtn.disabled = true;

            // 1. الإرسال لشيت الإكسيل الأول
            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    // 2. التحويل لصفحة الدفع بعد ما البيانات تتسجل
                    proceedToPaymentGateway();
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert(isEnglish ? 'Something went wrong. Please try again.' : 'حدث خطأ. يرجى المحاولة مرة أخرى.');
                    submitBtn.innerHTML = isEnglish ? 'Submit & Proceed to Payment' : 'تأكيد والانتقال للدفع';
                    submitBtn.disabled = false;
                });
        });

        // دالة التحويل لبوابة الدفع
        function proceedToPaymentGateway() {
            const isEnglish = document.documentElement.lang === 'en';
            
            // تنبيه للمستخدم إن البيانات اتسجلت (ممكن تشيله لو مش حابب التنبيه يظهر)
            alert(isEnglish ? 'Data saved successfully! Redirecting to secure payment gateway...' : 'تم حفظ بياناتك بنجاح! جاري تحويلك لصفحة الدفع الآمنة...');
            
            // هنا هتحط لينك صفحة الدفع الخاصة بيك (Paymob أو Tap أو Stripe الخ)
            // window.location.href = "https://your-payment-link.com";

            // ده كود مؤقت لإعادة الزرار لحالته لو مفيش لينك دلوقتي
            setTimeout(() => {
                form.reset();
                submitBtn.innerHTML = isEnglish ? 'Submit & Proceed to Payment' : 'تأكيد والانتقال للدفع';
                submitBtn.disabled = false;
            }, 1000);
        }
    </script>
