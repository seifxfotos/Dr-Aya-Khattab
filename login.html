<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - عيادة د. آية خطاب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #0093D0, #8CC63F); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #2c3e50;}
        .login-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        .login-box h2 { margin-top: 0; color: #0093D0; font-weight: 800; margin-bottom: 25px;}
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;}
        .input-group select, .input-group input { width: 100%; padding: 12px; border: 2px solid #e1e8ed; border-radius: 8px; font-family: 'Cairo'; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s;}
        .input-group select:focus, .input-group input:focus { border-color: #0093D0; }
        .btn-login { background: #0093D0; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-family: 'Cairo'; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #007bb5; }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; font-weight: bold; display: none;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <div class="input-group">
            <label>المستخدم</label>
            <select id="username">
                <option value="aya">Dr. Aya (آية)</option>
                <option value="alaa">Alaa (آلاء)</option>
                <option value="seif">Seif (سيف)</option>
            </select>
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور..." onkeyup="if(event.key === 'Enter') login()">
        </div>
        <button class="btn-login" onclick="login()" id="loginBtn">دخول <i class="fa-solid fa-arrow-left"></i></button>
        <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة!</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5pEukP78Y_bOPcTiPwvOej0zaGePwTeI",
            authDomain: "today-2d146.firebaseapp.com",
            projectId: "today-2d146",
        };
        firebase.initializeApp(firebaseConfig);

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('errorMsg');
            
            if(!pass) return;
            btn.innerHTML = "جاري التحقق...";
            btn.disabled = true;
            err.style.display = "none";

            // إضافة الدومين الوهمي اللي عملناه في فايربيز
            const email = user + "@clinic.com";

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(() => {
                    window.location.href = "today.html";
                })
                .catch((error) => {
                    err.style.display = "block";
                    btn.innerHTML = "دخول <i class='fa-solid fa-arrow-left'></i>";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
