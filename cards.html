<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة مريض - عيادة د. آية خطاب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- مكاتب مساعدة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- مكاتب فايربيز (شاملة الـ Storage) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        :root {
            --primary-blue: #0093D0; --primary-green: #8CC63F; --body-bg: #f0f4f8;
            --sheet-bg: #ffffff; --text-main: #111111; --text-muted: #666666;
            --border-light: #cccccc; --border-dash: #999999; --table-th-bg: #eaf5fa;
            --table-idx-bg: #f9f9f9; --focus-bg: #f4fbf0;
            --notes-bg: repeating-linear-gradient(transparent, transparent 39px, #ccc 40px);
        }

        body.dark-mode {
            --body-bg: #121212; --sheet-bg: #1e1e1e; --text-main: #f0f0f0;
            --text-muted: #aaaaaa; --border-light: #444444; --border-dash: #666666;
            --table-th-bg: #2a2a2a; --table-idx-bg: #252525; --focus-bg: #2c3e20;
            --notes-bg: repeating-linear-gradient(transparent, transparent 39px, #444 40px);
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--body-bg); color: var(--text-main); margin: 0; padding: 20px; transition: 0.3s ease; }
        
        .app-toast { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: var(--sheet-bg); color: var(--text-main); padding: 12px 25px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 999999; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 16px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-bottom: 4px solid var(--primary-blue); }
        .app-toast.show { top: 30px; }
        .app-toast.success { border-bottom-color: var(--primary-green); color: var(--primary-green); }
        .app-toast.error { border-bottom-color: #e74c3c; color: #e74c3c; }

        .save-status-badge { position: fixed; bottom: 20px; left: 20px; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 13px; z-index: 9999; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: var(--sheet-bg); color: var(--text-muted); transition: 0.3s; border: 1px solid var(--border-light);}
        .save-status-badge.saving { border-color: #f39c12; color: #f39c12; }
        .save-status-badge.saved { border-color: var(--primary-green); color: var(--primary-green); }
        .save-status-badge.unsaved { border-color: var(--danger); color: var(--danger); }

        .controls { background: var(--sheet-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); margin-bottom: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 4px solid var(--primary-green); }
        .controls input { background: var(--sheet-bg); color: var(--text-main); padding: 10px; border: 1px solid var(--border-light); border-radius: 6px; flex-grow: 1; font-size: 15px; font-family: 'Cairo'; outline: none; transition: 0.3s;}
        .controls input:focus { border-color: var(--primary-blue); }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 15px; font-family: 'Cairo'; color: white; transition: 0.3s; display: flex; align-items: center; gap: 6px; white-space: nowrap;}
        
        .btn-search { background-color: var(--primary-blue); }
        .btn-search:hover { filter: brightness(0.9); }
        .btn-new { background-color: var(--primary-green); }
        .btn-new:hover { filter: brightness(0.9); }
        .btn-delete { background-color: #e74c3c; } 
        .btn-pdf { background-color: #9b59b6; }
        .btn-print { background-color: #e67e22; }
        .btn-save { background-color: #27ae60; color: white;} 
        .btn-save:hover { background-color: #2ecc71;}

        .paper-sheet { background-color: var(--sheet-bg); max-width: 1100px; margin: 0 auto; padding: 25px 35px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; border: 2px solid var(--primary-blue); border-top: 10px solid var(--primary-green); margin-bottom: 20px; }
        .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .clinic-qr img { width: 70px; object-fit: contain; }
        .clinic-logo img { width: 180px; object-fit: contain; }
        body.dark-mode .clinic-logo img, body.dark-mode .clinic-qr img { background-color: #fff; padding: 5px; border-radius: 8px; }

        .sheet-body { display: flex; gap: 30px; width: 100%; }
        .info-section { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; gap: 20px; width: 100%; }
        .input-group { display: flex; flex-direction: row; align-items: baseline; gap: 10px; width: 100%; }
        .input-group label { font-weight: 700; white-space: nowrap; color: var(--primary-blue); font-size: 16px; margin: 0; }
        .input-group input { flex: 1; border: none; border-bottom: 2px dashed var(--border-dash); background: transparent; font-size: 16px; padding: 0 5px 2px 5px; font-family: 'Cairo'; color: var(--text-main); font-weight: 600; outline: none; direction: rtl;}
        .input-group input:focus { border-bottom-color: var(--primary-green); }
        .input-group input.eng-text { direction: ltr; text-align: left; }

        .input-group-textarea { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .input-group-textarea label { font-weight: 700; color: var(--primary-blue); font-size: 16px; }
        .input-group-textarea textarea { width: 100%; border: 2px dashed var(--border-light); border-radius: 8px; background: var(--sheet-bg); font-size: 16px; padding: 8px; font-family: 'Cairo'; color: var(--text-main); font-weight: 600; outline: none; min-height: 75px; resize: vertical; direction: ltr; text-align: left;}
        .input-group-textarea textarea:focus { border-color: var(--primary-green); background: var(--focus-bg); }

        .table-section { flex: 1; display: flex; flex-direction: column; }
        table { width: 100%; border-collapse: collapse; border: 2px solid var(--primary-blue); background: var(--sheet-bg); }
        th, td { border: 1px solid var(--border-light); text-align: center; height: 36px; padding: 0; position: relative;}
        th { background-color: var(--table-th-bg); color: var(--primary-blue); font-size: 16px; padding: 5px; }
        td input { width: 100%; height: 100%; border: none; text-align: center; font-size: 16px; font-weight: 700; font-family: 'Cairo'; background: transparent; color: var(--text-main); outline: none; box-sizing: border-box;}
        td input:focus { background-color: var(--focus-bg); }

        .date-cell-wrapper { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .inline-date-btn { position: absolute; background: #f39c12; color: #fff; border: none; border-radius: 4px; padding: 4px 8px; font-size: 13px; font-weight: 700; font-family: 'Cairo'; cursor: pointer; transition: 0.2s; white-space: nowrap; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .inline-date-btn:hover { background: #e67e22; transform: scale(1.05); }
        .date-input:focus + .inline-date-btn, .date-input:not(:placeholder-shown) + .inline-date-btn { display: none !important; }

        .upload-section { margin-top: 20px; border: 2px dashed var(--border-light); padding: 15px; border-radius: 8px; text-align: center; }
        .upload-section h4 { margin: 0 0 10px 0; color: var(--primary-blue); }
        .file-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; justify-content: center;}
        .file-item { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light); }
        .file-item img { width: 100%; height: 100%; object-fit: cover; cursor: pointer;}
        .file-item .del-btn { position: absolute; top: 2px; right: 2px; background: rgba(231, 76, 60, 0.8); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center;}
        
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--sheet-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; border-top: 5px solid var(--primary-green); max-height: 80vh; overflow-y: auto; }
        .patient-option { padding: 15px; border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .patient-option:hover { border-color: var(--primary-green); background-color: var(--focus-bg); }
        .patient-name { font-weight: bold; color: var(--primary-blue); font-size: 18px; margin-bottom: 5px;}

        .theme-switch-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: #2c3e50; padding: 5px; border-radius: 30px; border: 2px solid #1a252f; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .theme-switch { display: inline-block; height: 26px; position: relative; width: 56px; }
        .theme-switch input { display:none; }
        .slider { background-color: transparent; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; display: flex; align-items: center; justify-content: space-between; padding: 0 5px;}
        .slider:before { background-color: #fff; bottom: 2px; content: ""; height: 22px; left: 3px; position: absolute; transition: .4s; width: 22px; border-radius: 50%; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider:before { transform: translateX(28px); }
        .icon { font-size: 14px; z-index: 1; }

        @media print {
            .no-print, .controls, .theme-switch-wrapper, .save-status-badge, .inline-date-btn { display: none !important; } 
            
            body, .paper-sheet, .controls input, .input-group-textarea textarea, table, th, td { 
                background-color: #ffffff !important; 
                color: #000000 !important; 
                border-color: #cccccc !important;
            }
            .clinic-logo img, .clinic-qr img { background-color: transparent !important; padding: 0 !important; }
            .input-group input { border-bottom: 1px dotted #000 !important; color: #000 !important; }
            .input-group input.eng-text { direction: ltr !important; text-align: left !important; }
            .input-group-textarea textarea { direction: ltr !important; text-align: left !important; }
            th { background-color: #f5f5f5 !important; color: #000 !important; }
            
            .sheet-body { flex-direction: row !important; }
            .paper-sheet { border: none !important; box-shadow: none !important; padding: 0 !important; margin-bottom: 20px !important;}
            
            .dynamic-card:not(:first-child) { page-break-before: always !important; }
            .medical-sheet { page-break-before: always !important; margin-top: 20px !important; }
            
            /* 🚨 إخفاء الملف الطبي تماماً إذا كان فارغاً أثناء الطباعة 🚨 */
            .empty-notes { display: none !important; }
        }

        .force-light-mode {
            background-color: #ffffff !important;
            color: #000000 !important;
        }
        .force-light-mode .paper-sheet { background-color: #ffffff !important; border-color: #0093D0 !important; }
        .force-light-mode .input-group input, .force-light-mode .input-group-textarea textarea, .force-light-mode td input { background-color: #ffffff !important; color: #000000 !important; }
        .force-light-mode .input-group label { color: #0093D0 !important; }
        .force-light-mode .table-section table, .force-light-mode .table-section th, .force-light-mode .table-section td { background-color: #ffffff !important; border-color: #cccccc !important;}
        .force-light-mode th { background-color: #eaf5fa !important; color: #0093D0 !important;}
        
        .force-light-mode .dynamic-card:not(:first-child) { page-break-before: always !important; margin-top: 30px !important; }
        .force-light-mode .medical-sheet { page-break-before: always !important; margin-top: 30px !important; }
        .force-light-mode .medical-notes { background-image: repeating-linear-gradient(transparent, transparent 39px, #eee 40px) !important; color: #000000 !important;}
        
        /* 🚨 إخفاء الملف الطبي تماماً إذا كان فارغاً أثناء استخراج PDF 🚨 */
        .force-light-mode .empty-notes { display: none !important; }
    </style>
</head>
<body>

    <div id="saveStatusBadge" class="save-status-badge saved no-print">
        <i class="fa-solid fa-cloud-check"></i> <span>محفوظ</span>
    </div>

    <div id="appToast" class="app-toast no-print">
        <i id="toastIcon" class="fa-solid fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <div class="theme-switch-wrapper no-print" dir="ltr">
        <label class="theme-switch">
            <input type="checkbox" id="themeSwitch" onchange="toggleTheme(this)">
            <div class="slider">
                <span class="icon" style="color: #f1c40f;">☀️</span>
            </div>
        </label>
    </div>

    <div id="patientModal" class="modal no-print">
        <div class="modal-content">
            <h2 style="color: var(--primary-blue); margin-top: 0;">نتائج البحث</h2>
            <div id="patientList"></div>
            <button class="btn" style="background-color: #e74c3c; width: 100%; justify-content: center; margin-top: 15px;" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <div id="customConfirmModal" class="modal no-print" style="z-index: 999999;">
        <div class="modal-content" style="max-width: 400px; text-align: center; border-top-color: var(--danger);">
            <h2 id="confirmTitle" style="color: var(--danger); margin-top: 0; display: flex; align-items: center; justify-content: center; gap: 10px;"></h2>
            <p id="confirmMessage" style="color: var(--text-main); margin-bottom: 25px; font-size: 16px; font-weight: 600; line-height: 1.6;"></p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="confirmBtnYes" class="btn" style="flex: 1; justify-content: center; background: var(--danger);">نعم</button>
                <button onclick="closeConfirmModal()" class="btn" style="flex: 1; background-color: var(--border-dash); justify-content: center;">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="controls no-print">
        <input type="text" id="searchName" placeholder="ابحث باسم المريض أو رقم الموبايل...">
        <button class="btn btn-search" onclick="searchPatient()"><i class="fa-solid fa-magnifying-glass"></i> بحث</button>
        <button class="btn btn-new" onclick="createNewPatient()"><i class="fa-solid fa-file-medical"></i> كرت جديد</button>
        <button class="btn btn-pdf" onclick="exportToPDF()"><i class="fa-solid fa-file-pdf"></i> تصدير PDF</button>
        <!-- 🚨 زر الطباعة المفقود تم إرجاعه 🚨 -->
        <button class="btn btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة الكرت</button>
        <button class="btn btn-save" onclick="saveData()"><i class="fa-solid fa-floppy-disk"></i> حفظ البيانات</button>
        <button class="btn btn-delete" onclick="deletePatient()"><i class="fa-solid fa-trash"></i> حذف</button>
    </div>

    <div id="cardsRenderContainer">
        <!-- سيتم رسم الكروت هنا بواسطة الجافاسكريبت بناءً على الـ State -->
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB5pEukP78Y_bOPcTiPwvOej0zaGePwTeI",
            authDomain: "today-2d146.firebaseapp.com",
            databaseURL: "https://today-2d146-default-rtdb.firebaseio.com",
            projectId: "today-2d146",
            storageBucket: "today-2d146.firebasestorage.app",
            messagingSenderId: "742225764525",
            appId: "1:742225764525:web:c2d49bdb5357d441a86624"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const storage = firebase.storage();

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWU9e5HfvncGRrzBcbyrsDZr9mbO5C2jAww733pgdstnC-43LFQWxkv4y5WHxjUOLQ/exec";
        
        let currentPatient = {
            name: '', address: '', phone: '', job: '', age: '', referred: '', diagnosis: '', protocol: '', medical_notes: '',
            sessions: Array(12).fill({d: '', ws: '', n: ''}),
            files: []
        };

        let lastSavedStateString = "";
        let saveTimeout = null;
        let confirmActionCallback = null;
        let showMedicalSheetFlag = false; // 🚨 للتحكم في ظهور التشخيص الطبي 🚨

        localforage.config({ name: 'ClinicApp', storeName: 'patients_cache' });

        window.addEventListener('DOMContentLoaded', async () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeSwitch').checked = true;
            }
            renderPatientToDOM(); 
            silentPreFetchAll();

            const autoSearch = localStorage.getItem('clinic_auto_search_name');
            if (autoSearch) {
                document.getElementById('searchName').value = autoSearch;
                setTimeout(() => searchPatient(), 500);
                localStorage.removeItem('clinic_auto_search_name');
            }

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    forceSave();
                }
            });
        });

        function showToast(message, type = 'success') {
            const toast = document.getElementById('appToast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            toast.className = `app-toast ${type}`;
            if(type === 'success') icon.className = 'fa-solid fa-check-circle';
            else if(type === 'error') icon.className = 'fa-solid fa-exclamation-circle';
            else icon.className = 'fa-solid fa-info-circle';
            
            msg.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function showCustomConfirm(title, message, onConfirm, confirmText = "نعم، متأكد", confirmColor = "var(--danger)") {
            document.getElementById('confirmTitle').innerHTML = title;
            document.getElementById('confirmMessage').innerHTML = message;
            let btnYes = document.getElementById('confirmBtnYes');
            btnYes.innerHTML = confirmText;
            btnYes.style.backgroundColor = confirmColor;
            confirmActionCallback = onConfirm;
            document.getElementById('customConfirmModal').style.display = "flex";
        }

        function closeConfirmModal() {
            document.getElementById('customConfirmModal').style.display = "none";
            confirmActionCallback = null;
        }

        document.getElementById('confirmBtnYes').addEventListener('click', () => {
            if(confirmActionCallback) confirmActionCallback();
            closeConfirmModal();
        });

        function createNewPatient() {
            currentPatient = {
                name: '', address: '', phone: '', job: '', age: '', referred: '', diagnosis: '', protocol: '', medical_notes: '',
                sessions: Array(12).fill({d: '', ws: '', n: ''}),
                files: []
            };
            lastSavedStateString = ""; 
            showMedicalSheetFlag = false; // إعادة تعيين إظهار الملف الطبي
            renderPatientToDOM();
            showToast("تم فتح استمارة جديدة", "info");
        }

        window.syncCardNames = function() {
            let n = document.getElementById('p_name') ? document.getElementById('p_name').value : '';
            let p = document.getElementById('p_phone') ? document.getElementById('p_phone').value : '';
            document.querySelectorAll('.extra-card-name').forEach(el => el.value = n);
            document.querySelectorAll('.extra-card-phone').forEach(el => el.value = p);
        };

        function renderPatientToDOM() {
            const container = document.getElementById('cardsRenderContainer');
            container.innerHTML = '';
            
            let totalNeeded = Math.max(12, Math.ceil(currentPatient.sessions.length / 12) * 12);
            while(currentPatient.sessions.length < totalNeeded) { currentPatient.sessions.push({d: '', ws: '', n: ''}); }
            
            let numCards = currentPatient.sessions.length / 12;

            for(let c = 0; c < numCards; c++) {
                container.innerHTML += buildCardHtml(c);
            }

            // 🚨 بناء وتحديد حالة التشخيص الطبي بناءً على كونه فارغاً أو لا 🚨
            let hasNotes = currentPatient.medical_notes && currentPatient.medical_notes.trim() !== '';
            
            if (hasNotes || showMedicalSheetFlag) {
                // الكلاس empty-notes سيخفيه تماماً أثناء الـ Print / PDF
                let emptyClass = (!currentPatient.medical_notes || currentPatient.medical_notes.trim() === '') ? 'empty-notes' : '';
                container.innerHTML += `
                    <div class="paper-sheet medical-sheet ${emptyClass}" id="medicalSheetWrapper" style="margin-top:20px;">
                        <h3 style="color: var(--primary-blue); border-bottom: 2px solid var(--primary-green); padding-bottom:10px;">التشخيص والملاحظات الطبية</h3>
                        <textarea id="p_medical_notes" class="medical-notes" oninput="handleInput()">${escapeHtml(currentPatient.medical_notes)}</textarea>
                    </div>
                `;
            }

            // 🚨 حاوية الأزرار المجمعة المتمركزة في المنتصف 🚨
            container.innerHTML += `
                <div class="no-print" style="max-width: 1100px; margin: 20px auto; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                    <button class="btn btn-new" style="background: #27ae60;" onclick="addExtraCard()"><i class="fa-solid fa-plus-square"></i> إضافة كرت إضافي</button>
                    ${!(hasNotes || showMedicalSheetFlag) ? `<button class="btn btn-medical" style="background: var(--primary-blue);" onclick="addMedicalSheet()"><i class="fa-solid fa-notes-medical"></i> إضافة ملف طبي</button>` : ''}
                </div>
            `;

            // المرفقات
            container.innerHTML += `
                <div class="paper-sheet upload-section no-print" style="max-width: 1100px; margin: 20px auto;">
                    <h4><i class="fa-solid fa-cloud-arrow-up"></i> مرفقات المريض (روشتات/تحاليل/صور)</h4>
                    <input type="file" id="fileUploader" accept="image/*,.pdf" style="display:none;" onchange="handleFileUpload(event)">
                    <button class="btn btn-new" style="margin: 0 auto;" onclick="document.getElementById('fileUploader').click()">اختيار ملف للرفع</button>
                    <div class="file-list" id="filesListContainer"></div>
                </div>
            `;

            renderFilesList();
            attachDoubleClickListener();
        }

        window.addExtraCard = function() {
            updateStateFromDOM(); 
            for(let i=0; i<12; i++) {
                currentPatient.sessions.push({d: '', ws: '', n: ''});
            }
            renderPatientToDOM();
            handleInput(); 
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        };

        window.addMedicalSheet = function() {
            showMedicalSheetFlag = true; 
            renderPatientToDOM();
            setTimeout(() => {
                const notesEl = document.getElementById('p_medical_notes');
                if(notesEl) {
                    notesEl.focus();
                    window.scrollTo({ top: notesEl.offsetTop - 50, behavior: 'smooth' });
                }
            }, 100);
        };

        window.setSpecificDate = function(idx) {
            let today = new Date().toLocaleDateString('en-GB'); 
            let input = document.getElementById(`d_${idx}`);
            input.value = today;
            let btn = input.nextElementSibling;
            if(btn) btn.style.display = 'none';
            document.getElementById(`ws_${idx}`).focus();
            handleInput();
        }

        function buildCardHtml(cardIndex) {
            let isFirst = cardIndex === 0;
            let title = isFirst ? "" : `<h3 style="text-align:center; color:var(--primary-blue);">(متابعة الجلسات - كرت ${cardIndex + 1})</h3>`;
            
            let infoSection = isFirst ? `
                <div class="row">
                    <div class="input-group"><label>الاسم:</label><input type="text" id="p_name" value="${escapeHtml(currentPatient.name)}" oninput="handleInput(); syncCardNames();"></div>
                    <div class="input-group"><label>العنوان:</label><input type="text" id="p_address" value="${escapeHtml(currentPatient.address)}" oninput="handleInput()"></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>رقم الموبايل:</label><input type="tel" id="p_phone" value="${escapeHtml(currentPatient.phone)}" oninput="handleInput(); syncCardNames();" dir="ltr" style="text-align:right;"></div>
                    <div class="input-group"><label>الوظيفة:</label><input type="text" id="p_job" value="${escapeHtml(currentPatient.job)}" oninput="handleInput()"></div>
                </div>
                <div class="input-group" style="width: 50%;"><label>السن:</label><input type="number" id="p_age" value="${escapeHtml(currentPatient.age)}" oninput="handleInput()"></div>
                <div class="input-group"><label>Referred By:</label><input type="text" id="p_referred" class="eng-text" value="${escapeHtml(currentPatient.referred)}" oninput="handleInput()"></div>
                <div class="input-group"><label>Diagnosis:</label><input type="text" id="p_diagnosis" class="eng-text" value="${escapeHtml(currentPatient.diagnosis)}" oninput="handleInput()"></div>
                <div class="input-group-textarea">
                    <label>Treatment Protocol:</label>
                    <textarea id="p_protocol" rows="3" oninput="handleInput()">${escapeHtml(currentPatient.protocol)}</textarea>
                </div>
            ` : `
                <div class="row">
                    <div class="input-group"><label>الاسم:</label><input type="text" class="extra-card-name" value="${escapeHtml(currentPatient.name)}" readonly style="color:var(--text-muted)"></div>
                    <div class="input-group"><label>الموبايل:</label><input type="text" class="extra-card-phone" value="${escapeHtml(currentPatient.phone)}" readonly style="color:var(--text-muted)" dir="ltr" style="text-align:right;"></div>
                </div>
            `;

            let tbodyHtml = '';
            let startIdx = cardIndex * 12;
            for(let i = 0; i < 12; i++) {
                let sIdx = startIdx + i;
                let session = currentPatient.sessions[sIdx] || {d:'', ws:'', n:''};
                
                let dateBtnHtml = !session.d ? `<button class="inline-date-btn no-print" onclick="setSpecificDate(${sIdx})" tabindex="-1" title="تاريخ اليوم"><i class="fa-solid fa-calendar-day"></i> تاريخ اليوم</button>` : '';

                tbodyHtml += `
                    <tr>
                        <td style="font-weight:700; background:var(--table-idx-bg); color:var(--primary-blue);">${sIdx + 1}</td>
                        <td>
                            <div class="date-cell-wrapper">
                                <input type="text" id="d_${sIdx}" class="date-input" value="${escapeHtml(session.d)}" placeholder=" " oninput="handleInput()" dir="ltr">
                                ${dateBtnHtml}
                            </div>
                        </td>
                        <td><input type="text" id="ws_${sIdx}" value="${escapeHtml(session.ws)}" oninput="handleInput()"></td>
                        <td><input type="text" id="n_${sIdx}" value="${escapeHtml(session.n)}" oninput="handleInput()"></td>
                    </tr>
                `;
            }

            return `
            <div class="paper-sheet dynamic-card">
                <div class="sheet-header">
                    <div class="clinic-qr"><img src="links-qr-code.svg" alt="QR" onerror="this.style.display='none'"></div>
                    <div class="clinic-logo"><img src="Logo-Dr-Aya.webp" alt="Logo" onerror="this.style.display='none'"></div>
                </div>
                <div class="sheet-body">
                    <div class="info-section">
                        ${title}
                        ${infoSection}
                    </div>
                    <div class="table-section">
                        <table>
                            <thead><tr><th style="width:8%">#</th><th style="width:28%">D</th><th style="width:24%">W/S</th><th style="width:40%">N</th></tr></thead>
                            <tbody>${tbodyHtml}</tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        function updateStateFromDOM() {
            if(document.getElementById('p_name')) {
                currentPatient.name = document.getElementById('p_name').value.trim();
                currentPatient.phone = convertToEnglishNumbers(document.getElementById('p_phone').value.trim());
                currentPatient.address = document.getElementById('p_address').value;
                currentPatient.job = document.getElementById('p_job').value;
                currentPatient.age = document.getElementById('p_age').value;
                currentPatient.referred = document.getElementById('p_referred').value;
                currentPatient.diagnosis = document.getElementById('p_diagnosis').value;
                currentPatient.protocol = document.getElementById('p_protocol').value;
            }
            if(document.getElementById('p_medical_notes')) {
                currentPatient.medical_notes = document.getElementById('p_medical_notes').value;
            }

            for(let i=0; i<currentPatient.sessions.length; i++) {
                if(document.getElementById(`d_${i}`)) {
                    currentPatient.sessions[i].d = document.getElementById(`d_${i}`).value;
                    currentPatient.sessions[i].ws = document.getElementById(`ws_${i}`).value;
                    currentPatient.sessions[i].n = document.getElementById(`n_${i}`).value;
                }
            }
        }

        function setSaveStatus(status) {
            const badge = document.getElementById('saveStatusBadge');
            badge.className = `save-status-badge ${status} no-print`;
            if(status === 'saving') badge.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الحفظ...</span>';
            else if(status === 'saved') badge.innerHTML = '<i class="fa-solid fa-cloud-check"></i> <span>محفوظ</span>';
            else badge.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> <span>غير محفوظ</span>';
        }

        function handleInput() {
            setSaveStatus('unsaved');
            
            // 🚨 تحديث كلاس الإخفاء ديناميكياً لملف التشخيص 🚨
            const notesEl = document.getElementById('p_medical_notes');
            const wrapper = document.getElementById('medicalSheetWrapper');
            if(notesEl && wrapper) {
                if(notesEl.value.trim() === '') {
                    wrapper.classList.add('empty-notes');
                } else {
                    wrapper.classList.remove('empty-notes');
                }
            }

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                forceSave(true); 
            }, 5000);
        }

        function saveData() {
            forceSave(false);
        }

        async function forceSave(isSilent = false) {
            updateStateFromDOM();
            if(!currentPatient.name || !currentPatient.phone) {
                if(!isSilent) showToast("الاسم ورقم الموبايل مطلوبان للحفظ", "error");
                setSaveStatus('unsaved');
                return;
            }
            
            let currentStateStr = JSON.stringify(currentPatient);
            
            if (currentStateStr === lastSavedStateString) {
                if(!isSilent) showToast("الكرت ده محفوظ بالفعل ومفيش تعديلات جديدة!", "info");
                return;
            }

            if (!isSilent && lastSavedStateString === "") {
                let cache = await localforage.getItem('patients_cache') || [];
                let found = cache.find(p => (p.phone && p.phone === currentPatient.phone) || (p.name && normalizeArabicText(p.name) === normalizeArabicText(currentPatient.name)));
                
                if (found && found.name !== currentPatient.name) {
                    showCustomConfirm(
                        '<i class="fa-solid fa-copy"></i> كرت مكرر!',
                        'المريض ده مسجل عندنا قبل كده بنفس الاسم أو الرقم! تحب نفتح الكرت بتاعه بدل ما نسجل واحد جديد يكرر الداتا؟',
                        () => { loadPatientData(found); },
                        'افتح كرت المريض',
                        'var(--primary-blue)'
                    );
                    return; 
                }
            }

            setSaveStatus('saving');
            
            let cleanedSessions = [...currentPatient.sessions];
            while(cleanedSessions.length > 0 && !cleanedSessions[cleanedSessions.length-1].d && !cleanedSessions[cleanedSessions.length-1].ws && !cleanedSessions[cleanedSessions.length-1].n) {
                cleanedSessions.pop();
            }

            let payload = { ...currentPatient, sessions: cleanedSessions };

            let cache = await localforage.getItem('patients_cache') || [];
            let idx = cache.findIndex(p => p.phone === payload.phone);
            if(idx > -1) cache[idx] = payload;
            else cache.push(payload);
            await localforage.setItem('patients_cache', cache);

            try {
                await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
                setSaveStatus('saved');
                lastSavedStateString = currentStateStr; 
                if(!isSilent) showToast("تم الحفظ بنجاح", "success");
            } catch (e) {
                setSaveStatus('unsaved');
                if(!isSilent) showToast("خطأ في الاتصال، تم الحفظ محلياً", "info");
            }
        }

        function exportToPDF() {
            updateStateFromDOM();
            if(!currentPatient.name) return showToast("يجب إدخال اسم المريض أولاً", "error");
            showToast("جاري تجهيز الـ PDF...", "info");
            
            const chatContainers = document.querySelectorAll('iframe, .chat-toggle-btn');
            chatContainers.forEach(el => el.style.display = 'none');
            
            document.body.classList.add('force-light-mode');
            document.querySelectorAll('.no-print').forEach(el => el.style.display = 'none');

            const element = document.getElementById('cardsRenderContainer');
            const opt = {
                margin:       [5, 5, 5, 5],
                filename:     `استمارة_${currentPatient.name}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };
            
            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('force-light-mode');
                document.querySelectorAll('.no-print').forEach(el => el.style.display = '');
                chatContainers.forEach(el => el.style.display = '');
                showToast("تم تحميل الملف بنجاح", "success");
            });
        }

        function attachDoubleClickListener() {
            document.querySelectorAll('.date-dblclick').forEach(input => {
                input.addEventListener('dblclick', function() {
                    if(!this.value) {
                        this.value = new Date().toLocaleDateString('en-GB');
                        handleInput();
                    }
                });
            });
        }

        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if(!file || !currentPatient.phone) return showToast("يجب حفظ رقم الموبايل قبل الرفع", "error");
            
            showToast("جاري الرفع...", "info");
            const storageRef = storage.ref(`patients_files/${currentPatient.phone}/${Date.now()}_${file.name}`);
            
            try {
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                currentPatient.files.push({ url: downloadURL, name: file.name });
                renderFilesList();
                forceSave(true);
                showToast("تم رفع الملف", "success");
            } catch(err) {
                showToast("فشل الرفع!", "error");
            }
        }

        function renderFilesList() {
            const container = document.getElementById('filesListContainer');
            if(!container) return;
            container.innerHTML = '';
            if(currentPatient.files) {
                currentPatient.files.forEach((file, idx) => {
                    let isImg = file.name.match(/\.(jpeg|jpg|gif|png)$/i);
                    let iconHtml = isImg ? `<img src="${file.url}" onclick="window.open('${file.url}', '_blank')">` 
                                         : `<div style="height:100%; display:flex; align-items:center; justify-content:center; background:#eee; cursor:pointer;" onclick="window.open('${file.url}', '_blank')"><i class="fa-solid fa-file-pdf fa-2x" style="color:#e74c3c;"></i></div>`;
                    container.innerHTML += `
                        <div class="file-item no-print">
                            ${iconHtml}
                            <button class="del-btn" onclick="deleteFile(${idx})"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `;
                });
            }
        }

        function deleteFile(idx) {
            showCustomConfirm(
                '<i class="fa-solid fa-file-circle-xmark"></i> حذف المرفق',
                'هل أنت متأكد من مسح هذا الملف؟',
                () => {
                    currentPatient.files.splice(idx, 1);
                    renderFilesList();
                    handleInput();
                }
            );
        }

        function deletePatient() {
            let phone = currentPatient.phone;
            let name = currentPatient.name;
            if(!name) { showToast("برجاء البحث عن المريض وعرض بياناته أولاً قبل الحذف!", "error"); return; }

            showCustomConfirm(
                '<i class="fa-solid fa-trash"></i> تأكيد الحذف',
                `هل أنت متأكد من مسح بيانات المريض (${name}) من قاعدة البيانات نهائياً؟`,
                async () => {
                    let cache = await localforage.getItem('patients_cache') || [];
                    cache = cache.filter(p => !(p.phone === phone && p.name === name));
                    await localforage.setItem('patients_cache', cache);
                    
                    showToast("تم الحذف بنجاح!", "success");
                    createNewPatient();

                    fetch(SCRIPT_URL + "?action=delete&phone=" + encodeURIComponent(phone) + "&name=" + encodeURIComponent(name), { method: 'GET', redirect: 'follow' })
                    .catch(e => console.log("Cloud sync delayed"));
                }
            );
        }

        async function silentPreFetchAll() {
            try {
                let res = await fetch(SCRIPT_URL + "?query=ALL_DATA_FETCH");
                let data = await res.json();
                if(data.status === 'found') {
                    await localforage.setItem('patients_cache', data.data);
                }
            } catch(e) {}
        }

        async function searchPatient() {
            let rawSearch = document.getElementById('searchName').value.trim();
            if(!rawSearch) return showToast("برجاء إدخال اسم أو رقم موبايل!", "error");
            
            let searchInput = convertToEnglishNumbers(rawSearch);
            let cleanSearchName = normalizeArabicText(searchInput);
            
            let cache = await localforage.getItem('patients_cache') || [];
            let localResults = cache.filter(p => {
                let pName = normalizeArabicText(p.name);
                let pPhone = p.phone ? p.phone : "";
                return pName.includes(cleanSearchName) || pPhone.includes(searchInput);
            });

            if (localResults.length > 0) {
                showToast(`تم العثور على ${localResults.length} نتيجة بحث ⚡`, "success");
                if (localResults.length === 1) {
                    loadPatientData(localResults[0]);
                } else {
                    globalSearchResults = localResults;
                    renderMultiplePatientsList(localResults);
                }
                return; 
            }

            let btn = document.querySelector('.btn-search');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري...';

            try {
                let response = await fetch(SCRIPT_URL + "?query=" + encodeURIComponent(searchInput));
                let text = await response.text();
                let res = JSON.parse(text);
                
                if(res.status === "found") {
                    showToast(`تم العثور على ${res.data.length} نتيجة بحث!`, "success");
                    
                    res.data.forEach(newP => {
                        let idx = cache.findIndex(p => p.phone === newP.phone);
                        if(idx > -1) cache[idx] = newP; else cache.push(newP);
                    });
                    await localforage.setItem('patients_cache', cache);
                    
                    if (res.data.length === 1) {
                        loadPatientData(res.data[0]);
                    } else {
                        globalSearchResults = res.data;
                        renderMultiplePatientsList(res.data);
                    }
                } else {
                    showToast("المريض غير موجود، يمكنك إدخال بياناته كملف جديد.", "error");
                }
            } catch(e) {
                showToast("تعذر الوصول لقاعدة البيانات.", "error");
            }
            btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> بحث';
        }

        function renderMultiplePatientsList(results) {
            let listHtml = "";
            results.forEach((patient, index) => {
                listHtml += `
                    <div class="patient-option" onclick="selectPatient(${index})">
                        <div>
                            <div class="patient-name">${escapeHtml(patient.name)}</div>
                            <div class="patient-details">${escapeHtml(patient.phone) || "بدون رقم"}</div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('patientList').innerHTML = listHtml;
            document.getElementById('patientModal').style.display = "flex";
        }

        function selectPatient(index) {
            loadPatientData(globalSearchResults[index]);
            closeModal();
        }

        function loadPatientData(data) {
            currentPatient = { ...currentPatient, ...data };
            if(!currentPatient.sessions) currentPatient.sessions = [];
            if(!currentPatient.files) currentPatient.files = [];
            lastSavedStateString = JSON.stringify(currentPatient); 
            showMedicalSheetFlag = false; 
            renderPatientToDOM();
            setSaveStatus('saved');
        }

        function closeModal() { document.getElementById('patientModal').style.display = "none"; }
        function toggleTheme(e) { document.body.classList.toggle('dark-mode', e.checked); localStorage.setItem('theme', e.checked ? 'dark' : 'light'); }
        function convertToEnglishNumbers(str) { const ar = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return str.split('').map(c => ar.indexOf(c) !== -1 ? ar.indexOf(c) : c).join(''); }
        function normalizeArabicText(text) { return text ? text.toString().replace(/[أإآء]/g, 'ا').replace(/ة/g, 'ه').replace(/[يىئ]/g, 'ي').replace(/[\u064B-\u065F]/g, '').trim().toLowerCase() : ""; }
        function escapeHtml(text) { return text ? String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ""; }

    </script> 
    <!-- استدعاء الشات في صفحة الكروت -->
    <script src="chat-widget.js"></script>
</body>
</html>
