<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة مريض - عيادة د. آية خطاب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0093D0;
            --primary-green: #8CC63F;
            --light-bg: #ffffff;
            --border-color: #333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid var(--primary-green);
        }

        .controls input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            color: white;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-search { background-color: var(--primary-blue); }
        .btn-search:hover { background-color: #007bb5; }
        .btn-new { background-color: var(--primary-green); }
        .btn-new:hover { background-color: #7ab334; }
        .btn-save { background-color: #2c3e50; }
        .btn-print { background-color: #e67e22; }

        .paper-sheet {
            background-color: var(--light-bg);
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            border: 2px solid var(--primary-blue);
            border-top: 10px solid var(--primary-green);
        }

        .info-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        /* التعديل الجذري هنا لإجبار الكلمة والخط يبقوا على نفس السطر */
        .input-group {
            display: flex;
            flex-direction: row !important;
            align-items: flex-end; /* بيخلي الكلمة ماشية مع الخط من تحت */
            gap: 10px;
            width: 100%;
        }

        .input-group label {
            font-weight: 700;
            white-space: nowrap; /* بيمنع الكلمة تنزل سطر جديد */
            color: var(--primary-blue);
            font-size: 18px;
            line-height: 1;
            padding-bottom: 5px;
        }

        .input-group input, .input-group textarea {
            flex: 1; /* بياخد باقي المساحة المتاحة بس */
            min-width: 50px;
            border: none;
            border-bottom: 2px dashed #999;
            background: transparent;
            font-size: 18px;
            padding: 0 5px 5px 5px;
            font-family: 'Cairo', sans-serif;
            color: #111;
            font-weight: 600;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-bottom-color: var(--primary-green);
        }

        .table-section {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--primary-blue);
            background: white;
        }

        th, td {
            border: 1px solid var(--primary-blue);
            text-align: center;
            height: 40px;
        }

        th {
            background-color: #eaf5fa;
            color: var(--primary-blue);
            font-size: 18px;
            padding: 10px;
        }

        td input {
            width: 90%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            background: transparent;
        }

        td input:focus {
            outline: none;
            background-color: #f4fbf0; 
        }

        /* تظبيط مقاسات الموبايل والتابلت */
        @media (max-width: 800px) {
            .paper-sheet {
                flex-direction: column;
                padding: 20px;
            }
            .row {
                flex-direction: column;
                gap: 20px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: white; padding: 0; }
            .controls { display: none !important; } 
            .paper-sheet { 
                box-shadow: none; 
                border: none; 
                padding: 0; 
                width: 100%; 
                max-width: 100%;
            }
            .input-group label { color: #000; }
            .input-group input, .input-group textarea { border-bottom: 2px dotted #000; }
            table, th, td { border: 2px solid #000; }
            th { background-color: #eee !important; color: #000; }
        }
    </style>
</head>
<body>

    <div class="controls no-print">
        <input type="text" id="searchName" placeholder="🔍 ابحث باسم المريض هنا (الهمزات والتاء المربوطة لا تهم)...">
        <button class="btn btn-search" onclick="searchPatient()">بحث ذكي</button>
        <button class="btn btn-new" onclick="clearForm()">+ ملف جديد</button>
        <button class="btn btn-save" onclick="saveData()">💾 حفظ البيانات</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ طباعة الورقة</button>
    </div>

    <div class="paper-sheet" id="patientForm">
        
        <div class="info-section">
            <div class="row">
                <div class="input-group">
                    <label>الاسم:</label>
                    <input type="text" id="p_name">
                </div>
                <div class="input-group">
                    <label>العنوان:</label>
                    <input type="text" id="p_address">
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>رقم الموبايل:</label>
                    <input type="text" id="p_phone">
                </div>
                <div class="input-group">
                    <label>الوظيفة:</label>
                    <input type="text" id="p_job">
                </div>
            </div>

            <div class="input-group" style="width: 50%;">
                <label>السن:</label>
                <input type="text" id="p_age">
            </div>

            <br>
            
            <div class="input-group">
                <label>Referred Doctor:</label>
                <input type="text" id="p_referred">
            </div>

            <div class="input-group">
                <label>Diagnosis:</label>
                <input type="text" id="p_diagnosis">
            </div>

            <div class="input-group" style="align-items: flex-start; margin-top: 10px;">
                <label style="padding-bottom: 0;">Treatment Protocol:</label>
                <textarea id="p_protocol" rows="4"></textarea>
            </div>
        </div>

        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">#</th>
                        <th style="width: 20%;">D</th>
                        <th style="width: 25%;">W/S</th>
                        <th style="width: 45%;">N</th>
                    </tr>
                </thead>
                <tbody id="sessionsTable">
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const tableBody = document.getElementById('sessionsTable');
        for (let i = 1; i <= 12; i++) {
            tableBody.innerHTML += `
                <tr>
                    <td style="font-weight: 700; background-color: #f9f9f9; color: var(--primary-blue); border-left: none;">${i}</td>
                    <td><input type="text" id="d_${i}"></td>
                    <td><input type="text" id="ws_${i}"></td>
                    <td><input type="text" id="n_${i}"></td>
                </tr>
            `;
        }

        function normalizeArabicText(text) {
            if (!text) return "";
            return text.replace(/[أإآ]/g, 'ا')   
                       .replace(/ة/g, 'ه')       
                       .replace(/[يى]/g, 'ي')    
                       .replace(/[\u064B-\u065F]/g, '') 
                       .trim().toLowerCase();
        }

        function searchPatient() {
            let searchInput = document.getElementById('searchName').value;
            if(!searchInput) {
                alert("برجاء إدخال اسم المريض للبحث!");
                return;
            }
            let cleanSearchName = normalizeArabicText(searchInput);
            alert("جاري البحث عن: " + searchInput + "\n\n(في الخلفية السيستم هيبحث بالصيغة الذكية: " + cleanSearchName + ")");
        }

        function clearForm() {
            document.querySelectorAll('input, textarea').forEach(el => el.value = '');
            alert("تم تجهيز ورقة جديدة، يمكنك البدء في إدخال بيانات المريض.");
        }

        function saveData() {
            alert("تم حفظ بيانات المريض بنجاح!");
        }
    </script>
</body>
</html>
