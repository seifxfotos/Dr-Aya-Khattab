<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة مريض - عيادة د. آية خطاب</title>
    
    <!-- استدعاء فونت كايرو من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0093D0;
            --primary-green: #8CC63F;
            --light-bg: #ffffff;
            --border-color: #333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        /* شريط التحكم (مخفي في الطباعة) */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid var(--primary-green);
        }

        .controls input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            color: white;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-search { background-color: var(--primary-blue); }
        .btn-search:hover { background-color: #007bb5; }
        .btn-new { background-color: var(--primary-green); }
        .btn-new:hover { background-color: #7ab334; }
        .btn-save { background-color: #2c3e50; }
        .btn-print { background-color: #e67e22; }

        /* حاوية الورقة (شكل الاستمارة) */
        .paper-sheet {
            background-color: var(--light-bg);
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            gap: 30px;
            border: 2px solid var(--primary-blue);
            border-top: 10px solid var(--primary-green);
        }

        /* القسم الأيمن (البيانات) */
        .info-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        /* ضبط الخطوط لتكون بجانب الكلمات تماما على كل الشاشات */
        .input-group {
            display: flex;
            flex-direction: row !important;
            align-items: flex-end; 
            gap: 10px;
            width: 100%;
        }

        .input-group label {
            font-weight: 700;
            white-space: nowrap; 
            color: var(--primary-blue);
            font-size: 18px;
            line-height: 1;
            padding-bottom: 5px;
        }

        .input-group input, .input-group textarea {
            flex: 1; 
            min-width: 50px;
            border: none;
            border-bottom: 2px dashed #999;
            background: transparent;
            font-size: 18px;
            padding: 0 5px 5px 5px;
            font-family: 'Cairo', sans-serif;
            color: #111;
            font-weight: 600;
            outline: none;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-bottom-color: var(--primary-green);
        }

        /* القسم الأيسر (الجدول) */
        .table-section {
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--primary-blue);
            background: white;
        }

        th, td {
            border: 1px solid var(--primary-blue);
            text-align: center;
            height: 40px;
        }

        th {
            background-color: #eaf5fa;
            color: var(--primary-blue);
            font-size: 18px;
            padding: 10px;
        }

        td input {
            width: 90%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            background: transparent;
        }

        td input:focus {
            outline: none;
            background-color: #f4fbf0; 
        }

        /* تظبيط مقاسات الموبايل والتابلت */
        @media (max-width: 800px) {
            .paper-sheet {
                flex-direction: column;
                padding: 20px;
            }
            .row {
                flex-direction: column;
                gap: 20px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        /* إعدادات الطباعة */
        @media print {
            @page { size: A4 landscape; margin: 10mm; }
            body { background: white; padding: 0; }
            .controls { display: none !important; } 
            .paper-sheet { 
                box-shadow: none; 
                border: none; 
                padding: 0; 
                width: 100%; 
                max-width: 100%;
            }
            .input-group label { color: #000; }
            .input-group input, .input-group textarea { border-bottom: 2px dotted #000; }
            table, th, td { border: 2px solid #000; }
            th { background-color: #eee !important; color: #000; }
        }
    </style>
</head>
<body>

    <!-- شريط التحكم -->
    <div class="controls no-print">
        <input type="text" id="searchName" placeholder="🔍 ابحث باسم المريض هنا...">
        <button class="btn btn-search" onclick="searchPatient()">بحث عن مريض</button>
        <button class="btn btn-new" onclick="clearForm()">+ ملف جديد</button>
        <button class="btn btn-save" onclick="saveData()">💾 حفظ البيانات</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ طباعة الورقة</button>
    </div>

    <!-- الاستمارة (الورقة) -->
    <div class="paper-sheet" id="patientForm">
        
        <!-- الجانب الأيمن (بيانات المريض) -->
        <div class="info-section">
            <div class="row">
                <div class="input-group">
                    <label>الاسم:</label>
                    <input type="text" id="p_name">
                </div>
                <div class="input-group">
                    <label>العنوان:</label>
                    <input type="text" id="p_address">
                </div>
            </div>

            <div class="row">
                <div class="input-group">
                    <label>رقم الموبايل:</label>
                    <input type="text" id="p_phone">
                </div>
                <div class="input-group">
                    <label>الوظيفة:</label>
                    <input type="text" id="p_job">
                </div>
            </div>

            <div class="input-group" style="width: 50%;">
                <label>السن:</label>
                <input type="text" id="p_age">
            </div>

            <br>
            
            <div class="input-group">
                <label>Referred Doctor:</label>
                <input type="text" id="p_referred">
            </div>

            <div class="input-group">
                <label>Diagnosis:</label>
                <input type="text" id="p_diagnosis">
            </div>

            <div class="input-group" style="align-items: flex-start; margin-top: 10px;">
                <label style="padding-bottom: 0;">Treatment Protocol:</label>
                <textarea id="p_protocol" rows="4"></textarea>
            </div>
        </div>

        <!-- الجانب الأيسر (الجدول) -->
        <div class="table-section">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">#</th>
                        <th style="width: 20%;">D</th>
                        <th style="width: 25%;">W/S</th>
                        <th style="width: 45%;">N</th>
                    </tr>
                </thead>
                <tbody id="sessionsTable">
                    <!-- سيتم إنشاء الصفوف بواسطة الجافاسكريبت -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // رابط API الخاص بجوجل شيت الذي تم إنشاؤه
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxiitBrTQOcEVBgbbNm6dEF-WmNyQcdzWDA8kY6K0viqzRoHpw5sryxQpd4pgDzED1C/exec";

        // 1. إنشاء 12 صف في الجدول
        const tableBody = document.getElementById('sessionsTable');
        for (let i = 1; i <= 12; i++) {
            tableBody.innerHTML += `
                <tr>
                    <td style="font-weight: 700; background-color: #f9f9f9; color: var(--primary-blue); border-left: none;">${i}</td>
                    <td><input type="text" id="d_${i}"></td>
                    <td><input type="text" id="ws_${i}"></td>
                    <td><input type="text" id="n_${i}"></td>
                </tr>
            `;
        }

        // 2. دالة البحث الذكي
        async function searchPatient() {
            let searchInput = document.getElementById('searchName').value;
            if(!searchInput) {
                alert("برجاء إدخال اسم المريض للبحث!");
                return;
            }

            let btn = document.querySelector('.btn-search');
            btn.innerText = "جاري البحث...";

            try {
                // استدعاء البيانات من جوجل شيت
                let response = await fetch(SCRIPT_URL + "?name=" + encodeURIComponent(searchInput));
                let data = await response.json();

                if(data.status === "not_found") {
                    alert("المريض غير موجود في القاعدة، يمكنك كتابة بياناته والضغط على حفظ لإضافته كملف جديد.");
                } else {
                    // تعبئة البيانات الأساسية
                    document.getElementById('p_name').value = data.name || "";
                    document.getElementById('p_address').value = data.address || "";
                    document.getElementById('p_phone').value = data.phone || "";
                    document.getElementById('p_job').value = data.job || "";
                    document.getElementById('p_age').value = data.age || "";
                    document.getElementById('p_referred').value = data.referred || "";
                    document.getElementById('p_diagnosis').value = data.diagnosis || "";
                    document.getElementById('p_protocol').value = data.protocol || "";

                    // تعبئة بيانات الجلسات في الجدول
                    if(data.sessions && data.sessions.length > 0) {
                        for(let i = 1; i <= 12; i++) {
                            let session = data.sessions[i-1] || {d: "", ws: "", n: ""};
                            document.getElementById('d_'+i).value = session.d;
                            document.getElementById('ws_'+i).value = session.ws;
                            document.getElementById('n_'+i).value = session.n;
                        }
                    } else {
                        // تفريغ الجدول لو المريض ملوش جلسات قديمة
                        for(let i = 1; i <= 12; i++) {
                            document.getElementById('d_'+i).value = "";
                            document.getElementById('ws_'+i).value = "";
                            document.getElementById('n_'+i).value = "";
                        }
                    }
                    alert("تم تحميل بيانات المريض بنجاح!");
                }
            } catch(e) {
                alert("حدث خطأ في الاتصال بقاعدة البيانات. تأكد من الإنترنت وحاول مرة أخرى.");
            }
            btn.innerText = "بحث ذكي";
        }

        // 3. دالة الحفظ 
        function saveData() {
            let name = document.getElementById('p_name').value;
            if(!name) {
                alert("اسم المريض إجباري للحفظ!");
                return;
            }

            let btn = document.querySelector('.btn-save');
            btn.innerText = "جاري الحفظ...";

            // تجميع الجلسات من الجدول
            let sessions = [];
            for(let i = 1; i <= 12; i++) {
                sessions.push({
                    d: document.getElementById('d_'+i).value,
                    ws: document.getElementById('ws_'+i).value,
                    n: document.getElementById('n_'+i).value
                });
            }

            // تجميع كل البيانات
            let payload = {
                name: name,
                address: document.getElementById('p_address').value,
                phone: document.getElementById('p_phone').value,
                job: document.getElementById('p_job').value,
                age: document.getElementById('p_age').value,
                referred: document.getElementById('p_referred').value,
                diagnosis: document.getElementById('p_diagnosis').value,
                protocol: document.getElementById('p_protocol').value,
                sessions: sessions
            };

            // إرسال البيانات لجوجل شيت
            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload),
                mode: "no-cors"
            }).then(() => {
                alert("تم حفظ بيانات المريض وتحديث الجلسات بنجاح في الشيت!");
                btn.innerText = "💾 حفظ البيانات";
            }).catch(() => {
                alert("حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.");
                btn.innerText = "💾 حفظ البيانات";
            });
        }

        // 4. دالة تفريغ الحقول لملف جديد
        function clearForm() {
            document.querySelectorAll('input:not(#searchName), textarea').forEach(el => el.value = '');
            alert("تم تجهيز ورقة جديدة. يمكنك الآن إدخال بيانات المريض الجديد.");
        }
    </script>
</body>
</html>
