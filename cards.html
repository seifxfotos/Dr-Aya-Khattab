<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة مريض - عيادة د. آية خطاب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* المتغيرات الأساسية للألوان (الوضع الفاتح) */
        :root {
            --primary-blue: #0093D0;
            --primary-green: #8CC63F;
            --body-bg: #f0f4f8;
            --sheet-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #666666;
            --border-light: #cccccc;
            --border-dash: #999999;
            --table-th-bg: #eaf5fa;
            --table-idx-bg: #f9f9f9;
            --focus-bg: #f4fbf0;
            --notes-bg: repeating-linear-gradient(transparent, transparent 39px, #ccc 40px);
        }

        /* متغيرات الألوان (الوضع الليلي) */
        body.dark-mode {
            --body-bg: #121212;
            --sheet-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --border-light: #444444;
            --border-dash: #666666;
            --table-th-bg: #2a2a2a;
            --table-idx-bg: #252525;
            --focus-bg: #2c3e20;
            --notes-bg: repeating-linear-gradient(transparent, transparent 39px, #444 40px);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .controls {
            background: var(--sheet-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid var(--primary-green);
            transition: background-color 0.3s ease;
        }

        .controls input {
            background: var(--sheet-bg);
            color: var(--text-main);
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 6px;
            flex-grow: 1;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }

        ::placeholder { color: var(--text-muted); opacity: 1; }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            color: white;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-search { background-color: var(--primary-blue); }
        .btn-search:hover { filter: brightness(0.9); }
        .btn-new { background-color: var(--primary-green); }
        .btn-new:hover { filter: brightness(0.9); }
        .btn-delete { background-color: #e74c3c; } 
        .btn-delete:hover { filter: brightness(0.9); }
        .btn-save { background-color: #2c3e50; }
        .btn-print { background-color: #e67e22; }

        .btn-medical, .btn-new-card { 
            background-color: var(--primary-blue); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: all 0.3s ease; 
        }
        .btn-new-card { background-color: #27ae60; }
        .btn-medical:hover, .btn-new-card:hover { filter: brightness(0.9); }

        .paper-sheet {
            background-color: var(--sheet-bg);
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column; 
            border: 2px solid var(--primary-blue);
            border-top: 10px solid var(--primary-green);
            transition: background-color 0.3s ease;
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .clinic-qr img { width: 70px; height: auto; object-fit: contain; transition: 0.3s; }
        .clinic-logo img { width: 180px; height: auto; object-fit: contain; transition: 0.3s; }

        body.dark-mode .clinic-logo img, 
        body.dark-mode .clinic-qr img {
            background-color: #fff;
            padding: 5px;
            border-radius: 8px;
        }

        .sheet-body { display: flex; gap: 30px; width: 100%; }
        .info-section { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }

        .row { display: flex; gap: 20px; width: 100%; }
        .input-group { display: flex; flex-direction: row; align-items: baseline; gap: 10px; width: 100%; }
        .input-group label { font-weight: 700; white-space: nowrap; color: var(--primary-blue); font-size: 16px; margin: 0; }
        
        .input-group input {
            flex: 1; border: none; border-bottom: 2px dashed var(--border-dash);
            background: transparent; font-size: 16px; padding: 0 5px 2px 5px; 
            font-family: 'Cairo', sans-serif; color: var(--text-main); font-weight: 600;
            outline: none; margin: 0; transition: border-color 0.3s;
        }
        .input-group input:focus { border-bottom-color: var(--primary-green); }

        .input-group-textarea { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .input-group-textarea label { font-weight: 700; color: var(--primary-blue); font-size: 16px; }
        .input-group-textarea textarea {
            width: 100%; border: 2px dashed var(--border-light); border-radius: 8px;
            background: var(--sheet-bg); font-size: 16px; padding: 8px;
            font-family: 'Cairo', sans-serif; color: var(--text-main); font-weight: 600;
            outline: none; min-height: 75px; resize: vertical; box-sizing: border-box;
            transition: all 0.3s;
        }
        .input-group-textarea textarea:focus { border-color: var(--primary-green); background: var(--focus-bg); }

        .table-section { flex: 1; display: flex; flex-direction: column; }
        table { width: 100%; border-collapse: collapse; border: 2px solid var(--primary-blue); background: var(--sheet-bg); transition: 0.3s; }
        th, td { border: 1px solid var(--border-light); text-align: center; height: 32px; }
        th { background-color: var(--table-th-bg); color: var(--primary-blue); font-size: 16px; padding: 5px; transition: 0.3s; }
        td input { width: 90%; height: 100%; border: none; text-align: center; font-size: 16px; font-weight: 700; font-family: 'Cairo', sans-serif; background: transparent; color: var(--text-main); }
        td input:focus { outline: none; background-color: var(--focus-bg); }

        .add-row-btn { background-color: var(--primary-blue); margin-top: 8px; padding: 6px; font-size: 14px; width: 100%; }
        .add-row-btn:hover { filter: brightness(0.9); }

        .row-container { display: flex; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; }
        .delete-row-btn { color: white; background-color: #e74c3c; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; position: absolute; right: -25px; top: 50%; transform: translateY(-50%); line-height: 1; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .medical-notes {
            width: 100%; min-height: 400px; border: none; outline: none;
            font-size: 18px; font-family: 'Cairo', sans-serif; font-weight: 600; color: var(--text-main);
            line-height: 2.5; background: transparent; resize: none;
            background-image: var(--notes-bg); transition: 0.3s;
        }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background-color: var(--sheet-bg); padding: 25px; border-radius: 12px; width: 90%; max-width: 600px; border-top: 5px solid var(--primary-green); max-height: 80vh; overflow-y: auto; box-shadow: 0 5px 30px rgba(0,0,0,0.3); }
        .patient-option { padding: 15px; border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; background-color: var(--sheet-bg); }
        .patient-option:hover { border-color: var(--primary-green); background-color: var(--focus-bg); }
        .patient-name { font-weight: bold; color: var(--primary-blue); font-size: 18px; margin-bottom: 5px;}
        .patient-details { color: var(--text-muted); font-size: 14px; font-weight: 600;}
        .select-badge { background: var(--primary-blue); color: white; padding: 8px 15px; border-radius: 6px; font-weight: bold; font-size: 14px; }

        /* سويتش الدارك مود */
        .theme-switch-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .theme-switch { display: inline-block; height: 34px; position: relative; width: 70px; }
        .theme-switch input { display:none; }
        .slider { background-color: #f1c40f; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .slider.round { border-radius: 34px; }
        .slider:before { background-color: #fff; bottom: 4px; content: ""; height: 26px; left: 4px; position: absolute; transition: .4s; width: 26px; border-radius: 50%; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: #2c3e50; }
        input:checked + .slider:before { transform: translateX(36px); }
        .icon { font-size: 16px; z-index: 1; }

        @media (max-width: 800px) {
            .paper-sheet { padding: 20px; }
            .sheet-header { flex-direction: column; gap: 15px; text-align: center; }
            .sheet-body { flex-direction: column; gap: 30px; }
            .row { flex-direction: column; gap: 20px; }
            .controls { flex-direction: column; align-items: stretch; }
            #cardControls { flex-direction: column; }
        }

        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            :root {
                --body-bg: #ffffff !important;
                --sheet-bg: #ffffff !important;
                --text-main: #000000 !important;
                --text-muted: #333333 !important;
                --border-light: #cccccc !important;
                --border-dash: #000000 !important;
                --table-th-bg: #eeeeee !important;
                --table-idx-bg: #f9f9f9 !important;
                --notes-bg: repeating-linear-gradient(transparent, transparent 39px, #ccc 40px) !important;
            }
            body.dark-mode .clinic-logo img, body.dark-mode .clinic-qr img { background-color: transparent; padding: 0; }

            body { background: white; padding: 0; }
            .controls, .modal, .no-print, .delete-row-btn, .theme-switch-wrapper, .action-buttons-container { display: none !important; } 
            .sheet-body { flex-direction: row !important; gap: 20px !important; }
            .sheet-header { flex-direction: row !important; text-align: right !important; margin-bottom: 10px !important; }
            .info-section { flex: 1.2 !important; gap: 10px !important; display: flex !important; flex-direction: column !important; }
            .row { flex-direction: row !important; }
            .table-section { flex: 1 !important; display: block !important; }
            .paper-sheet { box-shadow: none; border: none; padding: 0 !important; width: 100%; max-width: 100%; transform: scale(0.98); transform-origin: top right; margin-bottom: 0 !important; }
            
            .dynamic-card { page-break-before: always; margin-top: 10mm !important; }
            #medicalSheetForm { page-break-before: always; margin-top: 10mm !important; }
            
            .input-group label { color: #000; font-size: 15px; }
            .input-group input { border-bottom: 2px dotted #000; font-size: 15px; }
            .input-group-textarea textarea { border: 2px dotted #000; background: transparent; min-height: 55px !important; font-size: 15px; }
            table, th, td { border: 2px solid #000; }
            th { background-color: #eee !important; color: #000; padding: 3px !important; font-size: 15px; }
            td { height: 26px !important; } 
            td input { font-size: 15px; }
            tr { page-break-inside: avoid; }
            
            textarea::placeholder { color: transparent !important; }
            textarea::-webkit-input-placeholder { color: transparent !important; }
        }
    </style>
</head>
<body>

    <!-- زر الدارك مود -->
    <div class="theme-switch-wrapper no-print" dir="ltr">
        <label class="theme-switch" for="themeSwitch">
            <input type="checkbox" id="themeSwitch" onchange="toggleTheme(this)">
            <div class="slider round">
                <span class="icon moon" style="margin-left: 8px;">🌙</span>
                <span class="icon sun" style="margin-right: 8px;">☀️</span>
            </div>
        </label>
    </div>

    <!-- نافذة البحث -->
    <div id="patientModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-blue); margin-top: 0;">يوجد أكثر من كرت مسجل</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">الرجاء اختيار الكرت المطلوب من القائمة التالية:</p>
            <div id="patientList"></div>
            <button class="btn" style="background-color: #e74c3c; width: 100%; margin-top: 10px;" onclick="closeModal()">إلغاء وإغلاق</button>
        </div>
    </div>

    <!-- أزرار التحكم العلوية -->
    <div class="controls no-print">
        <input type="text" id="searchName" placeholder="ابحث باسم المريض أو برقم الموبايل هنا ثم اضغط Enter...">
        <button class="btn btn-search" onclick="searchPatient()">بحث</button>
        <button class="btn btn-new" onclick="clearForm()">كرت جديد</button>
        <button class="btn btn-delete" onclick="deletePatient()">حذف الكرت</button>
        <button class="btn btn-save" onclick="saveData()">حفظ البيانات</button>
        <button class="btn btn-print" onclick="window.print()">طباعة الكرت</button>
    </div>

    <!-- الكرت الأساسي (الرقم 1) -->
    <div class="paper-sheet" id="card_1">
        <div class="sheet-header">
            <div class="clinic-qr"><img src="links-qr-code.svg" alt="QR Code" onerror="this.style.display='none'"></div>
            <div class="clinic-logo"><img src="Logo-Dr-Aya.webp" alt="Logo Dr Aya Khattab" onerror="this.style.display='none'"></div>
        </div>

        <div class="sheet-body">
            <div class="info-section">
                <div class="row">
                    <div class="input-group"><label>الاسم:</label><input type="text" id="p_name"></div>
                    <div class="input-group"><label>العنوان:</label><input type="text" id="p_address"></div>
                </div>
                <div class="row">
                    <div class="input-group"><label>رقم الموبايل:</label><input type="text" id="p_phone"></div>
                    <div class="input-group"><label>الوظيفة:</label><input type="text" id="p_job"></div>
                </div>
                <div class="input-group" style="width: 50%;"><label>السن:</label><input type="text" id="p_age"></div>
                <div class="input-group"><label>Referred Doctor:</label><input type="text" id="p_referred"></div>
                <div class="input-group"><label>Diagnosis:</label><input type="text" id="p_diagnosis"></div>
                <div class="input-group-textarea">
                    <label>Treatment Protocol:</label>
                    <textarea id="p_protocol" rows="3"></textarea>
                </div>
            </div>

            <div class="table-section">
                <table>
                    <thead>
                        <tr><th style="width: 10%;">#</th><th style="width: 20%;">D</th><th style="width: 25%;">W/S</th><th style="width: 45%;">N</th></tr>
                    </thead>
                    <tbody id="sessionsTable1">
                        <!-- يتم التوليد بالبرمجة -->
                    </tbody>
                </table>
                <button type="button" class="btn add-row-btn no-print" onclick="addNewRowToCard(1)">+ إضافة جلسة</button>
            </div>
        </div>
    </div>

    <!-- حاوية الكروت الإضافية اللانهائية -->
    <div id="dynamicCardsContainer"></div>

    <!-- أزرار الإدارة السفلية (إضافة كروت / ملف طبي) -->
    <div class="action-buttons-container no-print" style="display: flex; flex-direction: column; gap: 15px; align-items: center; margin: 20px auto; max-width: 1100px;">
        <div id="cardControls" style="display: flex; gap: 15px; width: 100%; max-width: 600px;">
            <button id="addCardBtn" class="btn btn-new-card" style="flex: 1;" onclick="addCard()">➕ إضافة كرت إضافي</button>
            <button id="removeCardBtn" class="btn btn-delete" style="flex: 1; display: none;" onclick="removeLastCard()">🗑️ إزالة الكرت الأخير</button>
        </div>
        <button id="medicalToggleBtn" class="btn btn-medical" onclick="toggleMedicalSheet()">فتح الملف الطبي</button>
    </div>

    <!-- الملف الطبي -->
    <div class="paper-sheet" id="medicalSheetForm" style="display: none; margin-bottom: 50px;">
        <div class="sheet-header">
            <div class="clinic-qr"><img src="links-qr-code.svg" alt="QR Code" onerror="this.style.display='none'"></div>
            <div class="clinic-logo"><img src="Logo-Dr-Aya.webp" alt="Logo Dr Aya Khattab" onerror="this.style.display='none'"></div>
        </div>
        <div style="border-bottom: 3px solid var(--primary-green); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: flex-start; align-items: baseline;">
            <h3 style="color: var(--primary-blue); margin: 0;">التشخيص والملاحظات الطبية</h3>
        </div>
        <textarea id="p_medical_notes" class="medical-notes" placeholder="اكتب التشخيص والتفاصيل هنا وسيتم حفظها مع الكرت..."></textarea>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7ndL5dYTFTSTsFY5eeAa94XrOZ64JnDDcYpQDZRKxKq7DZO-GcLq1veW3TCspWjPN/exec";
        
        let globalSearchResults = []; 
        let totalCards = 1;
        let cardRowCounts = { 1: { start: 1, current: 12 } };
        let searchCache = {}; // ذاكرة مؤقتة محلية لنتائج البحث لضمان السرعة الفورية

        // ================== إعدادات الدارك مود المستمرة ==================
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                let themeSwitch = document.getElementById('themeSwitch');
                if (themeSwitch) themeSwitch.checked = true;
            }
        });

        function toggleTheme(e) {
            if(e.checked) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
        }

        // ================== نظام التنقل بالأسهم (الكيبورد نافيجيشن) ==================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                let active = document.activeElement;
                
                if (!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')) return;
                
                if (active.tagName === 'TEXTAREA') {
                    if (e.key === 'ArrowDown' && active.selectionEnd === active.value.length) {
                        // يكمل نزول
                    } else if (e.key === 'ArrowUp' && active.selectionStart === 0) {
                        // يكمل طلوع
                    } else {
                        return; 
                    }
                }

                let id = active.id;
                let nextId = null;

                if (e.key === 'ArrowDown') {
                    if (id === 'p_name') nextId = 'p_phone';
                    else if (id === 'p_address') nextId = 'p_job';
                    else if (id === 'p_phone' || id === 'p_job') nextId = 'p_age';
                    else if (id === 'p_age') nextId = 'p_referred';
                    else if (id === 'p_referred') nextId = 'p_diagnosis';
                    else if (id === 'p_diagnosis') nextId = 'p_protocol';
                    else if (id === 'p_protocol') nextId = 'd_1';
                    else if (id.match(/^(d|ws|n)_(\d+)$/)) {
                        let parts = id.split('_');
                        let nextIdx = parseInt(parts[1]) + 1;
                        nextId = parts[0] + '_' + nextIdx;
                    }
                } else if (e.key === 'ArrowUp') {
                    if (id === 'p_phone') nextId = 'p_name';
                    else if (id === 'p_job') nextId = 'p_address';
                    else if (id === 'p_age') nextId = 'p_phone'; 
                    else if (id === 'p_referred') nextId = 'p_age';
                    else if (id === 'p_diagnosis') nextId = 'p_referred';
                    else if (id === 'p_protocol') nextId = 'p_diagnosis';
                    else if (id.match(/^(d|ws|n)_(\d+)$/)) {
                        let parts = id.split('_');
                        let prevIdx = parseInt(parts[1]) - 1;
                        if (prevIdx >= 1) {
                            nextId = parts[0] + '_' + prevIdx;
                        } else {
                            nextId = 'p_protocol';
                        }
                    }
                }

                if (nextId) {
                    let nextEl = document.getElementById(nextId);
                    if (nextEl) {
                        e.preventDefault(); 
                        nextEl.focus(); 
                    }
                }
            }
        });

        // ================== دوال البحث والتعامل مع البيانات ==================
        document.getElementById('searchName').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchPatient();
        });

        function convertToEnglishNumbers(str) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return str.split('').map(c => {
                let idx = arabicNumbers.indexOf(c);
                return idx !== -1 ? idx : c;
            }).join('');
        }

        function syncAllCardsInfo() {
            let baseName = document.getElementById('p_name').value;
            let basePhone = document.getElementById('p_phone').value;
            for(let i = 2; i <= totalCards; i++) {
                if(document.getElementById(`p_name${i}`)) document.getElementById(`p_name${i}`).value = baseName;
                if(document.getElementById(`p_phone${i}`)) document.getElementById(`p_phone${i}`).value = basePhone;
            }
        }
        document.getElementById('p_name').addEventListener('input', syncAllCardsInfo);
        document.getElementById('p_phone').addEventListener('input', syncAllCardsInfo);

        function addCard() {
            let prevCard = totalCards;
            totalCards++;
            
            let startIdx = cardRowCounts[prevCard].current + 1;
            let endIdx = startIdx + 11; 
            
            let cardHtml = `
            <div class="paper-sheet dynamic-card" id="card_${totalCards}" style="margin-top: 20px;">
                <div class="sheet-header">
                    <div class="clinic-qr"><img src="links-qr-code.svg" alt="QR Code" onerror="this.style.display='none'"></div>
                    <div class="clinic-logo"><img src="Logo-Dr-Aya.webp" alt="Logo Dr Aya Khattab" onerror="this.style.display='none'"></div>
                </div>
                <div class="sheet-body">
                    <div class="info-section">
                        <h3 style="color: var(--primary-blue); text-align: center; margin-top: 0; border-bottom: 2px dashed var(--border-dash); padding-bottom: 10px;">(متابعة الجلسات - كرت ${totalCards})</h3>
                        <div class="row">
                            <div class="input-group"><label>الاسم:</label><input type="text" id="p_name${totalCards}" readonly style="color: var(--text-muted);"></div>
                            <div class="input-group"><label>الموبايل:</label><input type="text" id="p_phone${totalCards}" readonly style="color: var(--text-muted);"></div>
                        </div>
                    </div>
                    <div class="table-section">
                        <table>
                            <thead>
                                <tr><th style="width: 10%;">#</th><th style="width: 20%;">D</th><th style="width: 25%;">W/S</th><th style="width: 45%;">N</th></tr>
                            </thead>
                            <tbody id="sessionsTable${totalCards}">
                            </tbody>
                        </table>
                        <button type="button" class="btn add-row-btn no-print" onclick="addNewRowToCard(${totalCards})">+ إضافة جلسة</button>
                    </div>
                </div>
            </div>
            `;
            
            document.getElementById('dynamicCardsContainer').insertAdjacentHTML('beforeend', cardHtml);
            initTableForCard(totalCards, startIdx, endIdx);
            syncAllCardsInfo();
            updateCardButtons();
            
            setTimeout(() => { 
                let newCard = document.getElementById(`card_${totalCards}`);
                window.scrollTo({ top: newCard.offsetTop - 20, behavior: 'smooth' }); 
            }, 100);
        }

        function removeLastCard() {
            if(totalCards <= 1) return;
            if(confirm(`هل أنت متأكد من إزالة الكرت رقم ${totalCards} بكل محتوياته؟`)) {
                document.getElementById(`card_${totalCards}`).remove();
                delete cardRowCounts[totalCards];
                totalCards--;
                updateCardButtons();
            }
        }

        function updateCardButtons() {
            let addBtn = document.getElementById('addCardBtn');
            let removeBtn = document.getElementById('removeCardBtn');
            if(totalCards > 1) {
                addBtn.innerHTML = `إضافة كرت (${totalCards + 1})`;
                removeBtn.style.display = 'block';
                removeBtn.innerHTML = `إزالة كرت (${totalCards})`;
            } else {
                addBtn.innerHTML = `إضافة كرت إضافي`;
                removeBtn.style.display = 'none';
            }
        }

        function buildRowHtml(index, cardNum) {
            let isExtraRow = index >= cardRowCounts[cardNum].start + 12;
            let deleteBtn = isExtraRow ? `<span class="delete-row-btn no-print" onclick="deleteRow(this, ${cardNum})">×</span>` : '';
            
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight: 700; background-color: var(--table-idx-bg); color: var(--primary-blue); border-left: none; position: relative;">
                    <div class="row-container">
                        <span class="row-index-text">${index}</span>
                        ${deleteBtn}
                    </div>
                </td>
                <td><input type="text" id="d_${index}"></td>
                <td><input type="text" id="ws_${index}"></td>
                <td><input type="text" id="n_${index}"></td>
            `;
            return tr;
        }

        function initTableForCard(cardNum, startIdx, currentCount) {
            const tbody = document.getElementById(`sessionsTable${cardNum}`);
            tbody.innerHTML = '';
            cardRowCounts[cardNum] = { start: startIdx, current: currentCount };
            for (let i = startIdx; i <= currentCount; i++) {
                tbody.appendChild(buildRowHtml(i, cardNum));
            }
        }

        function addNewRowToCard(cardNum) {
            cardRowCounts[cardNum].current++;
            let index = cardRowCounts[cardNum].current;
            document.getElementById(`sessionsTable${cardNum}`).appendChild(buildRowHtml(index, cardNum));
        }

        function deleteRow(btnElement, cardNum) {
            const tr = btnElement.closest('tr');
            tr.remove();
            cardRowCounts[cardNum].current--;
            
            const rows = document.getElementById(`sessionsTable${cardNum}`).querySelectorAll('tr');
            const startIdx = cardRowCounts[cardNum].start;
            
            rows.forEach((row, idx) => {
                const newIndex = startIdx + idx;
                const indexTextSpan = row.querySelector('.row-index-text');
                if (indexTextSpan) { indexTextSpan.innerText = newIndex; }

                const tdElement = row.querySelector('td');
                let deleteBtn = tdElement.querySelector('.delete-row-btn');
                
                if (newIndex >= startIdx + 12) {
                    if (!deleteBtn) {
                        let newBtn = document.createElement('span');
                        newBtn.className = 'delete-row-btn no-print';
                        newBtn.innerHTML = '×';
                        newBtn.onclick = function() { deleteRow(this, cardNum); };
                        tdElement.querySelector('.row-container').appendChild(newBtn);
                    }
                } else {
                    if (deleteBtn) { deleteBtn.remove(); }
                }
                
                const inputs = row.querySelectorAll('input');
                if(inputs.length === 3) {
                    inputs[0].id = `d_${newIndex}`;
                    inputs[1].id = `ws_${newIndex}`;
                    inputs[2].id = `n_${newIndex}`;
                }
            });
        }

        initTableForCard(1, 1, 12);

        function toggleMedicalSheet() {
            let sheet = document.getElementById('medicalSheetForm');
            let btn = document.getElementById('medicalToggleBtn');
            if(sheet.style.display === 'none' || sheet.style.display === '') {
                sheet.style.display = 'flex';
                btn.innerHTML = 'مسح الملف الطبي';
                btn.style.backgroundColor = '#e74c3c'; 
                setTimeout(() => { window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }, 100);
            } else {
                sheet.style.display = 'none';
                document.getElementById('p_medical_notes').value = ''; 
                btn.innerHTML = 'فتح الملف الطبي';
                btn.style.backgroundColor = 'var(--primary-blue)'; 
            }
        }

        async function searchPatient() {
            let rawSearch = document.getElementById('searchName').value.trim();
            if(!rawSearch) return alert("برجاء إدخال اسم أو رقم موبايل المريض للبحث!");
            let searchInput = convertToEnglishNumbers(rawSearch);
            
            // التحقق من الكاش المحلي للبحث الفوري دون انتظار الخادم
            if (searchCache[searchInput]) {
                handleSearchResult(searchCache[searchInput]);
                return;
            }

            let btn = document.querySelector('.btn-search');
            btn.innerText = "جاري البحث...";

            try {
                let response = await fetch(SCRIPT_URL + "?query=" + encodeURIComponent(searchInput), { method: 'GET', redirect: 'follow' });
                let text = await response.text();
                
                if(text.includes("<html")) {
                    alert("خطأ في اللينك! تأكد من النشر الصحيح لجوجل شيت.");
                    btn.innerText = "بحث";
                    return;
                }
                let res = JSON.parse(text);
                
                // حفظ النتيجة في الذاكرة المؤقتة للسرعة مستقبلاً
                searchCache[searchInput] = res;
                handleSearchResult(res);

            } catch(e) {
                alert("تعذر الوصول لقاعدة البيانات.");
            }
            btn.innerText = "بحث";
        }

        function handleSearchResult(res) {
            if(res.status === "not_found") {
                alert("المريض غير موجود، يمكنك كتابة بياناته والضغط على حفظ لإنشاء ملف جديد.");
            } else if(res.status === "found") {
                if(res.data.length === 1) {
                    loadPatientData(res.data[0]);
                } else {
                    globalSearchResults = res.data;
                    let listHtml = "";
                    res.data.forEach((patient, index) => {
                        listHtml += `
                            <div class="patient-option" onclick="selectPatient(${index})">
                                <div>
                                    <div class="patient-name">${patient.name}</div>
                                    <div class="patient-details">${patient.phone || "بدون رقم"}</div>
                                </div>
                                <div class="select-badge">فتح الملف</div>
                            </div>
                        `;
                    });
                    document.getElementById('patientList').innerHTML = listHtml;
                    document.getElementById('patientModal').style.display = "flex";
                }
            } else if(res.status === "error") {
                alert("حدث خطأ داخل جوجل شيت.");
            }
        }

        async function deletePatient() {
            let phone = document.getElementById('p_phone').value;
            let name = document.getElementById('p_name').value;
            if(!phone) { alert("برجاء البحث عن المريض وعرض بياناته أولاً قبل الحذف!"); return; }

            if(confirm(`هل أنت متأكد من مسح بيانات المريض من الشيت نهائياً؟`)) {
                let btn = document.querySelector('.btn-delete');
                btn.innerText = "جاري الحذف...";
                try {
                    let response = await fetch(SCRIPT_URL + "?action=delete&phone=" + encodeURIComponent(phone) + "&name=" + encodeURIComponent(name), { method: 'GET', redirect: 'follow' });
                    let res = await response.json();
                    if(res.status === "success") {
                        alert("تم الحذف بنجاح!");
                        clearForm();
                    } else {
                        alert("لم يتم العثور على المريض.");
                    }
                } catch(e) { alert("خطأ في الاتصال."); }
                btn.innerText = "حذف الكرت";
            }
        }

        function selectPatient(index) {
            loadPatientData(globalSearchResults[index]);
            closeModal();
        }

        function closeModal() { document.getElementById('patientModal').style.display = "none"; }

        function loadPatientData(data) {
            document.getElementById('p_name').value = data.name || "";
            document.getElementById('p_address').value = data.address || "";
            document.getElementById('p_phone').value = data.phone || "";
            document.getElementById('p_job').value = data.job || "";
            document.getElementById('p_age').value = data.age || "";
            document.getElementById('p_referred').value = data.referred || "";
            document.getElementById('p_diagnosis').value = data.diagnosis || "";
            document.getElementById('p_protocol').value = data.protocol || "";
            
            let medicalNotes = data.medical_notes || "";
            document.getElementById('p_medical_notes').value = medicalNotes;
            let sheetM = document.getElementById('medicalSheetForm');
            let btnM = document.getElementById('medicalToggleBtn');
            if (medicalNotes.trim() !== "") {
                sheetM.style.display = 'flex';
                btnM.innerHTML = 'مسح الملف الطبي';
                btnM.style.backgroundColor = '#e74c3c';
            } else {
                sheetM.style.display = 'none';
                btnM.innerHTML = 'فتح الملف الطبي';
                btnM.style.backgroundColor = 'var(--primary-blue)';
            }

            let sessions = data.sessions || [];
            
            document.getElementById('dynamicCardsContainer').innerHTML = '';
            totalCards = 1;
            cardRowCounts = {};
            
            let maxSessions = Math.max(12, sessions.length);
            let neededCards = Math.ceil(maxSessions / 12);
            
            initTableForCard(1, 1, neededCards === 1 ? maxSessions : 12);

            for (let c = 2; c <= neededCards; c++) {
                totalCards++;
                let startIdx = (c - 1) * 12 + 1;
                let endIdx = (c === neededCards) ? Math.max(startIdx + 11, sessions.length) : c * 12;
                
                let cardHtml = `
                <div class="paper-sheet dynamic-card" id="card_${totalCards}" style="margin-top: 20px;">
                    <div class="sheet-header">
                        <div class="clinic-qr"><img src="links-qr-code.svg" alt="QR Code" onerror="this.style.display='none'"></div>
                        <div class="clinic-logo"><img src="Logo-Dr-Aya.webp" alt="Logo Dr Aya Khattab" onerror="this.style.display='none'"></div>
                    </div>
                    <div class="sheet-body">
                        <div class="info-section">
                            <h3 style="color: var(--primary-blue); text-align: center; margin-top: 0; border-bottom: 2px dashed var(--border-dash); padding-bottom: 10px;">(متابعة الجلسات - كرت ${totalCards})</h3>
                            <div class="row">
                                <div class="input-group"><label>الاسم:</label><input type="text" id="p_name${totalCards}" readonly style="color: var(--text-muted);"></div>
                                <div class="input-group"><label>الموبايل:</label><input type="text" id="p_phone${totalCards}" readonly style="color: var(--text-muted);"></div>
                            </div>
                        </div>
                        <div class="table-section">
                            <table>
                                <thead>
                                    <tr><th style="width: 10%;">#</th><th style="width: 20%;">D</th><th style="width: 25%;">W/S</th><th style="width: 45%;">N</th></tr>
                                </thead>
                                <tbody id="sessionsTable${totalCards}"></tbody>
                            </table>
                            <button type="button" class="btn add-row-btn no-print" onclick="addNewRowToCard(${totalCards})">+ إضافة جلسة</button>
                        </div>
                    </div>
                </div>
                `;
                document.getElementById('dynamicCardsContainer').insertAdjacentHTML('beforeend', cardHtml);
                initTableForCard(totalCards, startIdx, endIdx);
            }
            
            syncAllCardsInfo();
            updateCardButtons();

            for(let i = 1; i <= sessions.length; i++) {
                let session = sessions[i-1];
                let dInput = document.getElementById('d_'+i);
                if(dInput) {
                    dInput.value = session.d || "";
                    document.getElementById('ws_'+i).value = session.ws || "";
                    document.getElementById('n_'+i).value = session.n || "";
                }
            }
        }

        function saveData() {
            let rawPhone = document.getElementById('p_phone').value;
            let phone = convertToEnglishNumbers(rawPhone);
            document.getElementById('p_phone').value = phone;
            let name = document.getElementById('p_name').value;
            
            if(!name || !phone) {
                alert("الاسم ورقم الموبايل إجباريين للحفظ!");
                return;
            }

            let btn = document.querySelector('.btn-save');
            btn.innerText = "جاري الحفظ...";

            let sessions = [];
            for(let c = 1; c <= totalCards; c++) {
                let start = cardRowCounts[c].start;
                let end = cardRowCounts[c].current;
                for(let i = start; i <= end; i++) {
                    let dInput = document.getElementById('d_'+i);
                    if(dInput) {
                        sessions.push({
                            d: dInput.value,
                            ws: document.getElementById('ws_'+i).value,
                            n: document.getElementById('n_'+i).value
                        });
                    }
                }
            }

            let payload = {
                name: name, address: document.getElementById('p_address').value,
                phone: phone, job: document.getElementById('p_job').value,
                age: document.getElementById('p_age').value,
                referred: document.getElementById('p_referred').value,
                diagnosis: document.getElementById('p_diagnosis').value,
                protocol: document.getElementById('p_protocol').value,
                medical_notes: document.getElementById('p_medical_notes').value, 
                sessions: sessions
            };

            // مسح الكاش لهذا المريض عند التعديل لضمان جلب البيانات المحدثة لاحقاً
            if(searchCache[phone]) delete searchCache[phone];
            if(searchCache[name]) delete searchCache[name];

            fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload), mode: "no-cors" })
            .then(() => {
                alert("تم حفظ البيانات بنجاح!");
                btn.innerText = "حفظ البيانات";
            }).catch(() => {
                alert("حدث خطأ، تأكد من اتصال الإنترنت.");
                btn.innerText = "حفظ البيانات";
            });
        }

        function clearForm() {
            document.querySelectorAll('input:not(#searchName), textarea').forEach(el => el.value = '');
            
            document.getElementById('dynamicCardsContainer').innerHTML = '';
            totalCards = 1;
            cardRowCounts = {};
            initTableForCard(1, 1, 12);
            updateCardButtons();
            
            document.getElementById('medicalSheetForm').style.display = 'none'; 
            let btnM = document.getElementById('medicalToggleBtn');
            btnM.innerHTML = 'فتح الملف الطبي';
            btnM.style.backgroundColor = 'var(--primary-blue)';
        }
    </script>
</body>
</html>
