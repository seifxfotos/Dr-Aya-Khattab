<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة مريض - عيادة د. آية خطاب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0093D0;
            --primary-green: #8CC63F;
            --light-bg: #ffffff;
            --border-color: #333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 4px solid var(--primary-green);
        }

        .controls input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex-grow: 1;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            color: white;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-search { background-color: var(--primary-blue); }
        .btn-search:hover { background-color: #007bb5; }
        .btn-new { background-color: var(--primary-green); }
        .btn-new:hover { background-color: #7ab334; }
        .btn-save { background-color: #2c3e50; }
        .btn-print { background-color: #e67e22; }

        .paper-sheet {
            background-color: var(--light-bg);
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column; 
            border: 2px solid var(--primary-blue);
            border-top: 10px solid var(--primary-green);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px double var(--primary-blue); 
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .clinic-info h1 {
            color: var(--primary-blue);
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            line-height: 1;
        }

        .clinic-info p {
            color: var(--primary-green);
            font-size: 18px;
            font-weight: 700;
            margin: 0; 
        }

        .clinic-logo img {
            width: 220px; 
            height: auto;
            object-fit: contain;
        }

        .sheet-body {
            display: flex;
            gap: 40px;
            width: 100%;
        }

        .info-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 25px; 
        }

        .row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .input-group {
            display: flex;
            flex-direction: row;
            align-items: baseline; 
            gap: 10px;
            width: 100%;
        }

        .input-group label {
            font-weight: 700;
            white-space: nowrap; 
            color: var(--primary-blue);
            font-size: 18px;
            margin: 0;
        }

        .input-group input {
            flex: 1; 
            border: none;
            border-bottom: 2px dashed #999;
            background: transparent;
            font-size: 18px;
            padding: 0 5px 4px 5px; 
            font-family: 'Cairo', sans-serif;
            color: #111;
            font-weight: 600;
            outline: none;
            margin: 0;
        }

        .input-group input:focus {
            border-bottom-color: var(--primary-green);
        }

        .input-group-textarea {
            display: flex;
            flex-direction: column; 
            gap: 10px;
            width: 100%;
        }
        
        .input-group-textarea label {
            font-weight: 700;
            color: var(--primary-blue);
            font-size: 18px;
        }

        .input-group-textarea textarea {
            width: 100%;
            border: 2px dashed #ccc;
            border-radius: 8px;
            background: #fdfdfd;
            font-size: 18px;
            padding: 10px;
            font-family: 'Cairo', sans-serif;
            color: #111;
            font-weight: 600;
            outline: none;
            min-height: 100px;
            resize: vertical;
            box-sizing: border-box;
        }

        .input-group-textarea textarea:focus {
            border-color: var(--primary-green);
            background: #f4fbf0;
        }

        .table-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--primary-blue);
            background: white;
        }

        th, td {
            border: 1px solid var(--primary-blue);
            text-align: center;
            height: 40px;
        }

        th {
            background-color: #eaf5fa;
            color: var(--primary-blue);
            font-size: 18px;
            padding: 10px;
        }

        td input {
            width: 90%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            background: transparent;
        }

        td input:focus {
            outline: none;
            background-color: #f4fbf0; 
        }

        .add-row-btn {
            background-color: var(--primary-blue);
            margin-top: 10px;
            padding: 8px;
            font-size: 14px;
            width: 100%;
        }
        .add-row-btn:hover { background-color: #007bb5; }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            border-top: 5px solid var(--primary-green);
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
        }
        .patient-option {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
        }
        .patient-option:hover {
            border-color: var(--primary-green);
            background-color: #f4fbf0;
        }
        .patient-name { font-weight: bold; color: var(--primary-blue); font-size: 18px; margin-bottom: 5px;}
        .patient-details { color: #555; font-size: 14px; font-weight: 600;}
        .select-badge {
            background: var(--primary-blue);
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .paper-sheet { padding: 20px; }
            .sheet-header { flex-direction: column; text-align: center; gap: 15px; }
            .sheet-body { flex-direction: column; gap: 30px; }
            .row { flex-direction: column; gap: 20px; }
            .controls { flex-direction: column; align-items: stretch; }
        }

        /* ----- إعدادات الطباعة الدقيقة لصفحة واحدة ----- */
        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body { background: white; padding: 0; }
            .controls, .modal, .no-print { display: none !important; } 
            .paper-sheet { box-shadow: none; border: none; padding: 0 !important; width: 100%; max-width: 100%; }
            .sheet-header { border-bottom: 4px double #000; margin-bottom: 15px !important; padding-bottom: 5px !important; }
            .info-section { gap: 15px !important; }
            .clinic-info h1, .clinic-info p { color: #000 !important; }
            .input-group label { color: #000; }
            .input-group input { border-bottom: 2px dotted #000; }
            .input-group-textarea textarea { border: 2px dotted #000; background: transparent; min-height: 70px !important; }
            table, th, td { border: 2px solid #000; }
            th { background-color: #eee !important; color: #000; padding: 5px !important; }
            td { height: 32px !important; } /* تصغير ارتفاع الخانات لضمان الاحتواء في صفحة واحدة */
            tr { page-break-inside: avoid; }
            
            /* الصف رقم 13 وأي صف بعده يطبع في صفحة جديدة */
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body>

    <div id="patientModal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-blue); margin-top: 0;">يوجد أكثر من مريض بهذا الاسم</h2>
            <p style="color: #666; margin-bottom: 20px;">الرجاء اختيار المريض المطلوب من القائمة التالية:</p>
            <div id="patientList"></div>
            <button class="btn" style="background-color: #e74c3c; width: 100%; margin-top: 10px;" onclick="closeModal()">إلغاء وإغلاق</button>
        </div>
    </div>

    <div class="controls no-print">
        <input type="text" id="searchName" placeholder="🔍 ابحث باسم المريض أو رقم الموبايل هنا...">
        <button class="btn btn-search" onclick="searchPatient()">بحث ذكي</button>
        <button class="btn btn-new" onclick="clearForm()">+ ملف جديد</button>
        <button class="btn btn-save" onclick="saveData()">💾 حفظ البيانات</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ طباعة الورقة</button>
    </div>

    <div class="paper-sheet" id="patientForm">
        
        <div class="sheet-header">
            <div class="clinic-info">
                <h1>د. آيـــة خطـــاب</h1>
                <p>عيادة العلاج الطبيعي والتغذية العلاجية</p>
            </div>
            <div class="clinic-logo">
                <img src="Logo-Dr-Aya.webp" alt="Logo Dr Aya Khattab">
            </div>
        </div>

        <div class="sheet-body">
            <div class="info-section">
                <div class="row">
                    <div class="input-group">
                        <label>الاسم:</label>
                        <input type="text" id="p_name">
                    </div>
                    <div class="input-group">
                        <label>العنوان:</label>
                        <input type="text" id="p_address">
                    </div>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>رقم الموبايل:</label>
                        <input type="text" id="p_phone">
                    </div>
                    <div class="input-group">
                        <label>الوظيفة:</label>
                        <input type="text" id="p_job">
                    </div>
                </div>
                <div class="input-group" style="width: 50%;">
                    <label>السن:</label>
                    <input type="text" id="p_age">
                </div>
                
                <div class="input-group">
                    <label>Referred Doctor:</label>
                    <input type="text" id="p_referred">
                </div>
                <div class="input-group">
                    <label>Diagnosis:</label>
                    <input type="text" id="p_diagnosis">
                </div>
                
                <div class="input-group-textarea">
                    <label>Treatment Protocol:</label>
                    <textarea id="p_protocol" rows="4"></textarea>
                </div>
            </div>

            <div class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 10%;">#</th>
                            <th style="width: 20%;">D</th>
                            <th style="width: 25%;">W/S</th>
                            <th style="width: 45%;">N</th>
                        </tr>
                    </thead>
                    <tbody id="sessionsTable">
                    </tbody>
                </table>
                <button type="button" class="btn add-row-btn no-print" onclick="addNewRow()">+ إضافة جلسة</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3t9CZL9PuRcdRsBRaiF48C3ZsJQ3Os0XQ_kaQCdcF31ec9QnKQ-9XgTRDFMZBHhAq/exec";

        let globalSearchResults = []; 
        let currentRowCount = 12;

        function buildRowHtml(index) {
            let tr = document.createElement('tr');
            if(index === 13) {
                tr.classList.add('page-break'); // إجبار الطباعة في صفحة جديدة بداية من رقم 13
            }
            tr.innerHTML = `
                <td style="font-weight: 700; background-color: #f9f9f9; color: var(--primary-blue); border-left: none;">${index}</td>
                <td><input type="text" id="d_${index}"></td>
                <td><input type="text" id="ws_${index}"></td>
                <td><input type="text" id="n_${index}"></td>
            `;
            return tr;
        }

        function initTable(count) {
            const tableBody = document.getElementById('sessionsTable');
            tableBody.innerHTML = '';
            currentRowCount = Math.max(12, count);
            for (let i = 1; i <= currentRowCount; i++) {
                tableBody.appendChild(buildRowHtml(i));
            }
        }

        function addNewRow() {
            currentRowCount++;
            const tableBody = document.getElementById('sessionsTable');
            tableBody.appendChild(buildRowHtml(currentRowCount));
        }

        // تهيئة الجدول الافتراضي عند فتح الصفحة
        initTable(12);

        async function searchPatient() {
            let searchInput = document.getElementById('searchName').value;
            if(!searchInput) return alert("برجاء إدخال اسم أو رقم موبايل المريض للبحث!");

            let btn = document.querySelector('.btn-search');
            btn.innerText = "جاري البحث...";

            try {
                let response = await fetch(SCRIPT_URL + "?query=" + encodeURIComponent(searchInput), {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                let text = await response.text();
                
                if(text.includes("<html")) {
                    alert("خطأ في صلاحيات اللينك! تأكد من إعدادات جوجل شيت.");
                    btn.innerText = "بحث ذكي";
                    return;
                }

                let res = JSON.parse(text);

                if(res.status === "not_found") {
                    alert("المريض غير موجود، يمكنك كتابة بياناته والضغط على حفظ لإنشاء ملف جديد.");
                } else if(res.status === "found") {
                    if(res.data.length === 1) {
                        loadPatientData(res.data[0]);
                    } else {
                        globalSearchResults = res.data;
                        let listHtml = "";
                        res.data.forEach((patient, index) => {
                            listHtml += `
                                <div class="patient-option" onclick="selectPatient(${index})">
                                    <div>
                                        <div class="patient-name">${patient.name}</div>
                                        <div class="patient-details">📱 ${patient.phone || "بدون رقم"} &nbsp; | &nbsp; 📍 ${patient.address || "بدون عنوان"}</div>
                                    </div>
                                    <div class="select-badge">اختيار</div>
                                </div>
                            `;
                        });
                        document.getElementById('patientList').innerHTML = listHtml;
                        document.getElementById('patientModal').style.display = "flex";
                    }
                } else if(res.status === "error") {
                    alert("حدث خطأ داخل جوجل شيت.");
                }
            } catch(e) {
                alert("تعذر الوصول لقاعدة البيانات. تأكد من صحة اللينك.");
            }
            btn.innerText = "بحث ذكي";
        }

        function selectPatient(index) {
            loadPatientData(globalSearchResults[index]);
            closeModal();
        }

        function closeModal() {
            document.getElementById('patientModal').style.display = "none";
        }

        function loadPatientData(data) {
            document.getElementById('p_name').value = data.name || "";
            document.getElementById('p_address').value = data.address || "";
            document.getElementById('p_phone').value = data.phone || "";
            document.getElementById('p_job').value = data.job || "";
            document.getElementById('p_age').value = data.age || "";
            document.getElementById('p_referred').value = data.referred || "";
            document.getElementById('p_diagnosis').value = data.diagnosis || "";
            document.getElementById('p_protocol').value = data.protocol || "";

            let sessions = data.sessions || [];
            initTable(Math.max(12, sessions.length)); // إعادة بناء الجدول ليتناسب مع عدد الجلسات

            for(let i = 1; i <= currentRowCount; i++) {
                let session = sessions[i-1] || {d: "", ws: "", n: ""};
                document.getElementById('d_'+i).value = session.d;
                document.getElementById('ws_'+i).value = session.ws;
                document.getElementById('n_'+i).value = session.n;
            }
        }

        function saveData() {
            let name = document.getElementById('p_name').value;
            let phone = document.getElementById('p_phone').value;
            
            if(!name || !phone) {
                alert("الاسم ورقم الموبايل إجباريين لتجنب تداخل البيانات!");
                return;
            }

            let btn = document.querySelector('.btn-save');
            btn.innerText = "جاري الحفظ...";

            let sessions = [];
            for(let i = 1; i <= currentRowCount; i++) {
                sessions.push({
                    d: document.getElementById('d_'+i).value,
                    ws: document.getElementById('ws_'+i).value,
                    n: document.getElementById('n_'+i).value
                });
            }

            let payload = {
                name: name, address: document.getElementById('p_address').value,
                phone: phone, job: document.getElementById('p_job').value,
                age: document.getElementById('p_age').value,
                referred: document.getElementById('p_referred').value,
                diagnosis: document.getElementById('p_diagnosis').value,
                protocol: document.getElementById('p_protocol').value,
                sessions: sessions
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(payload),
                mode: "no-cors"
            }).then(() => {
                alert("تم حفظ البيانات بنجاح!");
                btn.innerText = "💾 حفظ البيانات";
            }).catch(() => {
                alert("حدث خطأ، تأكد من اتصال الإنترنت وصحة اللينك.");
                btn.innerText = "💾 حفظ البيانات";
            });
        }

        function clearForm() {
            document.querySelectorAll('input:not(#searchName), textarea').forEach(el => el.value = '');
            initTable(12); // إعادة الجدول لـ 12 خانة
            alert("تم تجهيز ورقة جديدة.");
        }
    </script>
</body>
</html>
