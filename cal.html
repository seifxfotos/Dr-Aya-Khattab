<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        /* إعدادات عامة لتنظيف المسافات */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6; /* لون خلفية مريح للعين */
        }

        /* تصميم هيكل الآلة الحاسبة */
        .calculator {
            background-color: #ffffff;
            width: 320px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* ظل خفيف لشكل مودرن */
        }

        /* شاشة العرض */
        .display {
            background-color: #f9fbfd;
            color: #2c3e50;
            font-size: 2.5rem;
            text-align: right;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            min-height: 85px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            overflow-x: auto;
            border: 1px solid #e1e8ed;
        }

        /* شبكة الأزرار */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* تصميم الأزرار الأساسي */
        .btn {
            border: none;
            background-color: #f0f3f5;
            font-size: 1.2rem;
            padding: 18px 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s; /* حركة خفيفة عند الضغط */
            color: #333;
            font-weight: 600;
        }

        .btn:hover {
            background-color: #e2e6ea;
        }

        .btn:active {
            transform: scale(0.95); /* تأثير الضغط الحقيقي */
        }

        /* ألوان الأزرار الخاصة */
        .operator {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        .clear {
            background-color: #ffebee;
            color: #d32f2f;
        }

        .equal {
            background-color: #1976d2;
            color: white;
            grid-column: span 2; /* زر يساوي يأخذ مساحة زرين */
        }

        .equal:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="keypad">
            <!-- الصف الأول -->
            <button class="btn clear" data-action="clear">AC</button>
            <button class="btn operator" data-action="delete">DEL</button>
            <button class="btn operator" data-value="%">%</button>
            <button class="btn operator" data-value="/">÷</button>

            <!-- الصف الثاني -->
            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn operator" data-value="*">×</button>

            <!-- الصف الثالث -->
            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn operator" data-value="-">−</button>

            <!-- الصف الرابع -->
            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn operator" data-value="+">+</button>

            <!-- الصف الخامس -->
            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn equal" data-action="calculate">=</button>
        </div>
    </div>

    <script>
        // ربط عناصر الـ HTML بالـ JavaScript
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('.btn');
        
        let currentInput = '';

        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                const value = e.target.getAttribute('data-value');
                const action = e.target.getAttribute('data-action');

                // تنظيف الشاشة
                if (action === 'clear') {
                    currentInput = '';
                    display.innerText = '0';
                    return;
                }

                // مسح آخر رقم
                if (action === 'delete') {
                    currentInput = currentInput.toString().slice(0, -1);
                    display.innerText = currentInput || '0';
                    return;
                }

                // حساب النتيجة
                if (action === 'calculate') {
                    try {
                        // استخدام eval بحذر لحساب المعادلة
                        let result = eval(currentInput);
                        
                        // معالجة الأرقام العشرية الطويلة
                        if(result % 1 !== 0) {
                            result = result.toFixed(4).replace(/\.?0+$/, '');
                        }
                        
                        display.innerText = result;
                        currentInput = result.toString();
                    } catch (error) {
                        display.innerText = 'Error';
                        currentInput = '';
                    }
                    return;
                }

                // إضافة الأرقام والعمليات
                if (value) {
                    const lastChar = currentInput.slice(-1);
                    const operators = ['+', '-', '*', '/', '%'];
                    
                    // منع تكرار العلامات الحسابية وراء بعض
                    if (operators.includes(value) && operators.includes(lastChar)) {
                        currentInput = currentInput.slice(0, -1) + value;
                    } else {
                        currentInput += value;
                    }
                    
                    // استبدال علامات البرمجة بعلامات رياضية للعرض فقط
                    let displayText = currentInput.replace(/\*/g, '×').replace(/\//g, '÷');
                    display.innerText = displayText;
                }
            });
        });
    </script>
</body>
</html>
