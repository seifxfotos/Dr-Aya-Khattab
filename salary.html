<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الرواتب والحسابات - د. آية خطاب</title>
    
    <!-- خطوط وأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكاتب Firebase للـ Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-blue: #0093D0; --primary-green: #8CC63F; --bg-color: #f4f7f6; 
            --card-bg: #ffffff; --text-dark: #2c3e50; --border: #e1e8ed; 
            --danger: #e74c3c; --input-bg: #ffffff;
        }

        :root[data-theme="dark"] {
            --bg-color: #121212; --card-bg: #1e1e1e; --text-dark: #e0e0e0;
            --border: #333333; --input-bg: #2c2c2c; --primary-blue: #0082b8; --primary-green: #7bb530;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 20px; transition: 0.3s; }
        .container { max-width: 1000px; margin: 0 auto; }

        .header-section { background: linear-gradient(135deg, #2c3e50, var(--primary-blue)); color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; position: relative; display: flex; flex-direction: column; align-items: center;}
        .header-section h1 { margin: 0; font-size: 26px; }
        .header-section p { margin: 5px 0 15px 0; opacity: 0.8; font-size: 14px;}

        /* فلتر الشهور وتحديث البيانات */
        .controls-wrapper { display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; }
        .month-selector-container { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3); display: inline-flex; align-items: center; gap: 10px; }
        .month-selector-container label { font-weight: bold; font-size: 15px;}
        .month-input { background: var(--input-bg); color: var(--text-dark); border: none; padding: 6px 15px; border-radius: 20px; font-family: 'Cairo'; font-weight: bold; font-size: 16px; outline: none; cursor: pointer; }
        .btn-sync-refresh { background: var(--primary-green); color: white; border: none; padding: 10px 20px; border-radius: 30px; font-family: 'Cairo'; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);}
        .btn-sync-refresh:hover { background: #7bb530; transform: translateY(-2px); }

        .theme-switch-wrapper { position: absolute; top: 20px; left: 20px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 30px; display: flex; align-items: center; }
        .theme-switch { display: inline-block; position: relative; width: 50px; height: 26px; }
        .theme-switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.3); transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(24px); }

        .sections-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .sections-grid { grid-template-columns: 1fr; } }

        .salary-panel { background: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .panel-header h2 { margin: 0; font-size: 20px; color: var(--primary-blue); display: flex; align-items: center; gap: 8px;}
        .btn-edit-staff { background: none; border: 1px solid var(--border); color: var(--text-dark); cursor: pointer; border-radius: 6px; padding: 6px 12px; font-family: 'Cairo'; font-size: 13px; font-weight: bold; transition: 0.2s;}
        .btn-edit-staff:hover { background: var(--border); }

        .staff-list { display: flex; flex-direction: column; gap: 10px; }
        .staff-card { border: 1px solid var(--border); border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; background: var(--input-bg);}
        .staff-card:hover { border-color: var(--primary-blue); box-shadow: 0 4px 10px rgba(0,147,208,0.1); transform: translateY(-2px);}
        .staff-info h3 { margin: 0 0 5px 0; font-size: 18px; }
        .staff-info p { margin: 0; font-size: 12px; opacity: 0.7; }
        .staff-total { font-size: 20px; font-weight: 800; color: var(--primary-green); background: rgba(140, 198, 63, 0.1); padding: 5px 12px; border-radius: 8px;}

        /* Modal Styles */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(3px); }
        .modal-box { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 95%; max-width: 650px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; font-size: 20px; color: var(--primary-blue); }
        .btn-close { background: none; border: none; font-size: 20px; color: var(--danger); cursor: pointer; }
        
        .report-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px;}
        .report-table th, .report-table td { padding: 10px; border-bottom: 1px solid var(--border); }
        .report-table th { background: var(--primary-blue); color: white; position: sticky; top: 0;}
        .report-total-row { font-weight: 800; background: rgba(0,147,208,0.1) !important; font-size: 16px; color: var(--primary-blue);}

        /* Edit Staff Form */
        .staff-form-row { display: grid; grid-template-columns: 1fr 0.8fr 1fr 1fr 0.5fr; gap: 8px; align-items: center; margin-bottom: 10px; padding: 10px; border: 1px dashed var(--border); border-radius: 8px;}
        .rec-form-row { grid-template-columns: 1fr 0.8fr 0.8fr 1fr 0.5fr; }
        .staff-form-row input { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Cairo'; background: var(--input-bg); color: var(--text-dark); width: 100%; box-sizing: border-box; font-size: 12px;}
        .btn-save { background: var(--primary-green); color: white; border: none; padding: 10px; border-radius: 8px; width: 100%; font-family: 'Cairo'; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 16px;}
        .btn-remove-staff { background: var(--danger); color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
        .btn-add-row { background: var(--primary-blue); color: white; border: none; padding: 10px; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; margin-top: 10px; display: block; width: 100%;}
    </style>
</head>
<body>

    <div class="container">
        <div class="header-section">
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
            <h1><i class="fa-solid fa-sack-dollar"></i> إدارة الرواتب والحسابات</h1>
            <p>اختر الشهر لعرض الرواتب المستحقة (لا يتم حساب الحالات قبل تاريخ تعيين الموظف)</p>
            
            <div class="controls-wrapper">
                <div class="month-selector-container">
                    <label for="monthSelector"><i class="fa-regular fa-calendar-days"></i> رواتب شهر:</label>
                    <input type="month" id="monthSelector" class="month-input" onchange="calculateAllSalaries()">
                </div>
                <!-- زر مسح الكاش والمزامنة الإجبارية -->
                <button class="btn-sync-refresh" onclick="forceSyncRefresh()"><i class="fa-solid fa-rotate"></i> مزامنة وتنظيف الكاش</button>
            </div>
        </div>

        <div class="sections-grid">
            <!-- قسم الأطباء -->
            <div class="salary-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-user-doctor"></i> حسابات الأطباء</h2>
                    <button class="btn-edit-staff" onclick="openEditModal('doctors')"><i class="fa-solid fa-pen"></i> إدارة الأطباء</button>
                </div>
                <div class="staff-list" id="doctorsList">
                    <div style="text-align: center; opacity: 0.5;"><i class="fa-solid fa-spinner fa-spin"></i> جاري الحساب...</div>
                </div>
            </div>

            <!-- قسم السكرتارية (الرسيبشن) -->
            <div class="salary-panel">
                <div class="panel-header">
                    <h2><i class="fa-solid fa-headset"></i> حسابات الرسيبشن</h2>
                    <button class="btn-edit-staff" onclick="openEditModal('reception')"><i class="fa-solid fa-pen"></i> إدارة الرسيبشن</button>
                </div>
                <div class="staff-list" id="receptionList">
                    <div style="text-align: center; opacity: 0.5;"><i class="fa-solid fa-spinner fa-spin"></i> جاري الحساب...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة تقرير الحساب التفصيلي -->
    <div id="reportModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="reportTitle">كشف حساب</h3>
                <button class="btn-close" onclick="closeModal('reportModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="overflow-x: auto; max-height: 400px;">
                <table class="report-table">
                    <thead id="reportThead">
                        <!-- ديناميكي -->
                    </thead>
                    <tbody id="reportTbody">
                        <!-- ديناميكي -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة وتعديل الأشخاص -->
    <div id="editStaffModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="editModalTitle">إدارة الإعدادات</h3>
                <button class="btn-close" onclick="closeModal('editStaffModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="editStaffFormContainer">
                <!-- ديناميكي -->
            </div>
            <button class="btn-add-row" onclick="addNewStaffRow()"><i class="fa-solid fa-plus"></i> إضافة شخص جديد</button>
            <button class="btn-save" onclick="saveStaffConfig()"><i class="fa-solid fa-floppy-disk"></i> حفظ التعديلات</button>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB5pEukP78Y_bOPcTiPwvOej0zaGePwTeI",
            authDomain: "today-2d146.firebaseapp.com",
            databaseURL: "https://today-2d146-default-rtdb.firebaseio.com",
            projectId: "today-2d146",
            storageBucket: "today-2d146.firebasestorage.app",
            messagingSenderId: "742225764525",
            appId: "1:742225764525:web:c2d49bdb5357d441a86624"
        };

        let db = null;
        try {
            if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
            db = firebase.database(); 
        } catch(e) { console.error("Firebase init error", e); }

        // --- الإعدادات الافتراضية ---
        const DEFAULT_CONFIG = {
            doctors: [
                { id: 'doc1', name: 'ياسمين', code: 'ي', sessionPrice: 30, startDate: '' },
                { id: 'doc2', name: 'منال', code: 'م', sessionPrice: 30, startDate: '' }
            ],
            reception: [
                { id: 'rec1', name: 'آلاء', kashfPrice: 20, motabaaPrice: 10, startDate: '2026-10-06' }
            ]
        };

        let staffConfig = JSON.parse(localStorage.getItem('clinic_salary_config')) || DEFAULT_CONFIG;
        let allClinicDaysData = {}; 
        let currentEditMode = ''; 

        // دالة تنظيف الكلمات وحذف أي فراغات أو ألقاب أو تشكيل للتطابق الصارم
        function cleanExactMatchString(text) {
            if (!text) return "";
            return String(text)
                .replace(/[\u064B-\u065F]/g, "") // إزالة التشكيل تماماً
                .replace(/[أإآ]/g, "ا")
                .replace(/ة/g, "ه")
                .replace(/ى/g, "ي")
                .replace(/^(دكتور|دكتوره|د|د\.|د\/|د \/|د\s+)\s*/g, "") // إزالة الألقاب من الأول
                .trim()
                .replace(/\s+/g, " "); // إزالة المسافات الزائدة
        }

        function initMonthSelector() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthSelector').value = `${yyyy}-${mm}`;
        }

        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            toggleSwitch.checked = true;
        }
        toggleSwitch.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.checked ? 'dark' : 'light');
            localStorage.setItem('theme', e.target.checked ? 'dark' : 'light');
        });

        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // زر تحديث إجباري يمسح الكاش المحلي ويسحب الداتا النظيفة من الفايربيز
        function forceSyncRefresh() {
            const btn = document.querySelector('.btn-sync-refresh');
            const originalIcon = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري التحديث...`;
            btn.disabled = true;

            localStorage.removeItem('clinic_salary_config');
            
            if (db) {
                db.ref('clinic_days').once('value').then((snapshot) => {
                    allClinicDaysData = snapshot.val() || {};
                    calculateAllSalaries();
                    setTimeout(() => {
                        btn.innerHTML = originalIcon;
                        btn.disabled = false;
                    }, 500);
                }).catch(err => {
                    alert('فشل التحديث، يرجى التحقق من الإنترنت.');
                    btn.innerHTML = originalIcon;
                    btn.disabled = false;
                });
            }
        }

        function startDataListener() {
            if (!db) { alert('خطأ في الاتصال بقاعدة البيانات'); return; }
            db.ref('clinic_days').on('value', (snapshot) => {
                allClinicDaysData = snapshot.val() || {};
                calculateAllSalaries();
            });
        }

        // --- دالة الحساب الذكية والمباشرة ---
        function calculateAllSalaries() {
            let doctorsCalc = {};
            let receptionCalc = {};
            
            const selectedMonth = document.getElementById('monthSelector').value; 

            staffConfig.doctors.forEach(doc => {
                doctorsCalc[doc.id] = { config: doc, total: 0, days: {} };
            });
            staffConfig.reception.forEach(rec => {
                receptionCalc[rec.id] = { config: rec, total: 0, days: {} };
            });

            Object.keys(allClinicDaysData).forEach(dateStr => { 
                if (!dateStr.startsWith(selectedMonth)) return;

                let dayData = allClinicDaysData[dateStr];
                if (!dayData || !dayData.schedule) return;

                let sched = Array.isArray(dayData.schedule) ? dayData.schedule : Object.values(dayData.schedule);
                
                let dayKashfCount = 0;
                let dayMotabaaCount = 0;
                let dayDoctorSessions = {};

                // نقرأ الجدول حرفياً بدون أي حماية زائدة تمنع العد (بدون Set)
                sched.forEach(patient => {
                    if (!patient) return; 

                    let typeNorm = cleanExactMatchString(patient.type);
                    let rawDoc = String(patient.doctor || '');
                    let docNorm = cleanExactMatchString(rawDoc);
                    let paymentStatus = String(patient.payment || '').trim();

                    // السكرتارية بتتحاسب فقط لو الدفع "تم الدفع"
                    if (paymentStatus === 'تم الدفع') {
                        if (typeNorm === 'كشف') dayKashfCount++;
                        if (typeNorm === 'متابعه') dayMotabaaCount++; 
                    }

                    // الدكاترة بيتحاسبوا بمجرد كتابة اسمهم أو حرفهم (بغض النظر عن حالة الدفع أو نوع الزيارة)
                    if (docNorm) { 
                        staffConfig.doctors.forEach(doc => {
                            let dName = cleanExactMatchString(doc.name);
                            let dCode = cleanExactMatchString(doc.code);
                            
                            let isMatch = false;
                            
                            // تطابق فعلي للاسم أو الرمز
                            if (dCode && docNorm === dCode) isMatch = true;
                            if (dName && (docNorm === dName || docNorm.includes(dName))) isMatch = true;
                            
                            if (isMatch) {
                                if (!dayDoctorSessions[doc.id]) dayDoctorSessions[doc.id] = 0;
                                dayDoctorSessions[doc.id]++;
                            }
                        });
                    }
                });

                // تجميع حسابات الرسيبشن
                staffConfig.reception.forEach(rec => {
                    if (rec.startDate && dateStr < rec.startDate) return;

                    if (dayKashfCount > 0 || dayMotabaaCount > 0) {
                        let dailyTotal = (dayKashfCount * rec.kashfPrice) + (dayMotabaaCount * rec.motabaaPrice);
                        receptionCalc[rec.id].days[dateStr] = { kashf: dayKashfCount, motabaa: dayMotabaaCount, dailyTotal: dailyTotal };
                        receptionCalc[rec.id].total += dailyTotal;
                    }
                });

                // تجميع حسابات الأطباء لكل الجلسات المجمعة لهذا اليوم
                staffConfig.doctors.forEach(doc => {
                    if (doc.startDate && dateStr < doc.startDate) return;

                    if (dayDoctorSessions[doc.id] && dayDoctorSessions[doc.id] > 0) {
                        let sessionsCount = dayDoctorSessions[doc.id];
                        let dailyTotal = sessionsCount * doc.sessionPrice;
                        doctorsCalc[doc.id].days[dateStr] = { sessions: sessionsCount, dailyTotal: dailyTotal };
                        doctorsCalc[doc.id].total += dailyTotal;
                    }
                });
            });

            renderDashboard(doctorsCalc, receptionCalc);
        }

        function renderDashboard(doctorsCalc, receptionCalc) {
            const docList = document.getElementById('doctorsList');
            const recList = document.getElementById('receptionList');
            docList.innerHTML = ''; recList.innerHTML = '';

            staffConfig.doctors.forEach(doc => {
                let data = doctorsCalc[doc.id];
                docList.innerHTML += `
                    <div class="staff-card" onclick='openReportModal("doctor", ${JSON.stringify(data)})'>
                        <div class="staff-info">
                            <h3>د. ${doc.name} <span style="font-size:12px; color:var(--primary-blue)">(${doc.code})</span></h3>
                            <p>سعر الجلسة: ${doc.sessionPrice} ج.م ${doc.startDate ? `| بدأ: ${doc.startDate}` : ''}</p>
                        </div>
                        <div class="staff-total">${data.total} ج.م</div>
                    </div>`;
            });

            staffConfig.reception.forEach(rec => {
                let data = receptionCalc[rec.id];
                recList.innerHTML += `
                    <div class="staff-card" onclick='openReportModal("reception", ${JSON.stringify(data)})'>
                        <div class="staff-info">
                            <h3>${rec.name}</h3>
                            <p>كشف: ${rec.kashfPrice} | متابعة: ${rec.motabaaPrice} ${rec.startDate ? `| بدأت: ${rec.startDate}` : ''}</p>
                        </div>
                        <div class="staff-total">${data.total} ج.م</div>
                    </div>`;
            });
        }

        function openReportModal(type, data) {
            document.getElementById('reportModal').style.display = 'flex';
            document.getElementById('reportTitle').innerText = `كشف حساب: ${data.config.name} (${document.getElementById('monthSelector').value})`;
            
            const thead = document.getElementById('reportThead');
            const tbody = document.getElementById('reportTbody');
            tbody.innerHTML = '';

            const sortedDates = Object.keys(data.days).sort((a, b) => new Date(b) - new Date(a));

            if (type === 'doctor') {
                thead.innerHTML = `<tr><th>التاريخ</th><th>عدد الحالات</th><th>راتب اليوم</th></tr>`;
                if(sortedDates.length === 0) tbody.innerHTML = `<tr><td colspan="3" style="padding:20px; opacity:0.6;">لا توجد حالات مسجلة في هذا الشهر.</td></tr>`;
                sortedDates.forEach(date => {
                    let d = data.days[date];
                    tbody.innerHTML += `<tr><td>${date}</td><td>${d.sessions}</td><td style="color:var(--primary-green); font-weight:bold;">${d.dailyTotal} ج.م</td></tr>`;
                });
            } else {
                thead.innerHTML = `<tr><th>التاريخ</th><th>كشوفات</th><th>متابعات</th><th>راتب اليوم</th></tr>`;
                if(sortedDates.length === 0) tbody.innerHTML = `<tr><td colspan="4" style="padding:20px; opacity:0.6;">لا توجد حالات مسجلة في هذا الشهر.</td></tr>`;
                sortedDates.forEach(date => {
                    let d = data.days[date];
                    tbody.innerHTML += `<tr><td>${date}</td><td>${d.kashf}</td><td>${d.motabaa}</td><td style="color:var(--primary-green); font-weight:bold;">${d.dailyTotal} ج.م</td></tr>`;
                });
            }

            let colSpan = type === 'doctor' ? 2 : 3;
            if(sortedDates.length > 0) {
                tbody.innerHTML += `
                    <tr class="report-total-row">
                        <td colspan="${colSpan}" style="text-align: left; padding-left: 20px;">إجمالي راتب الشهر:</td>
                        <td>${data.total} ج.م</td>
                    </tr>`;
            }
        }

        function openEditModal(type) {
            currentEditMode = type;
            document.getElementById('editStaffModal').style.display = 'flex';
            document.getElementById('editModalTitle').innerText = type === 'doctors' ? 'إعدادات الأطباء' : 'إعدادات الرسيبشن';
            renderEditForm();
        }

        function renderEditForm() {
            const container = document.getElementById('editStaffFormContainer');
            container.innerHTML = '';
            const list = staffConfig[currentEditMode];

            if (currentEditMode === 'doctors') {
                list.forEach((doc, idx) => {
                    container.innerHTML += `
                        <div class="staff-form-row">
                            <div><label style="font-size:11px">الاسم:</label><input type="text" value="${doc.name}" id="${currentEditMode}-name-${idx}"></div>
                            <div><label style="font-size:11px">الرمز:</label><input type="text" value="${doc.code}" id="${currentEditMode}-code-${idx}" placeholder="ي"></div>
                            <div><label style="font-size:11px">الجلسة:</label><input type="number" value="${doc.sessionPrice}" id="${currentEditMode}-price-${idx}"></div>
                            <div><label style="font-size:11px">تاريخ البدء:</label><input type="date" value="${doc.startDate || ''}" id="${currentEditMode}-date-${idx}"></div>
                            <div style="text-align:center"><br><button class="btn-remove-staff" onclick="removeStaffRow(${idx})"><i class="fa-solid fa-trash"></i></button></div>
                        </div>`;
                });
            } else {
                list.forEach((rec, idx) => {
                    container.innerHTML += `
                        <div class="staff-form-row rec-form-row">
                            <div><label style="font-size:11px">الاسم:</label><input type="text" value="${rec.name}" id="${currentEditMode}-name-${idx}"></div>
                            <div><label style="font-size:11px">سعر الكشف:</label><input type="number" value="${rec.kashfPrice}" id="${currentEditMode}-kprice-${idx}"></div>
                            <div><label style="font-size:11px">سعر المتابعة:</label><input type="number" value="${rec.motabaaPrice}" id="${currentEditMode}-mprice-${idx}"></div>
                            <div><label style="font-size:11px">تاريخ البدء:</label><input type="date" value="${rec.startDate || ''}" id="${currentEditMode}-date-${idx}"></div>
                            <div style="text-align:center"><br><button class="btn-remove-staff" onclick="removeStaffRow(${idx})"><i class="fa-solid fa-trash"></i></button></div>
                        </div>`;
                });
            }
        }

        function addNewStaffRow() {
            if (currentEditMode === 'doctors') {
                staffConfig.doctors.push({ id: 'doc' + Date.now(), name: '', code: '', sessionPrice: 0, startDate: '' });
            } else {
                staffConfig.reception.push({ id: 'rec' + Date.now(), name: '', kashfPrice: 0, motabaaPrice: 0, startDate: '' });
            }
            renderEditForm();
        }

        function removeStaffRow(idx) {
            staffConfig[currentEditMode].splice(idx, 1);
            renderEditForm();
        }

        function saveStaffConfig() {
            const list = staffConfig[currentEditMode];
            if (currentEditMode === 'doctors') {
                list.forEach((doc, idx) => {
                    doc.name = document.getElementById(`${currentEditMode}-name-${idx}`).value.trim();
                    doc.code = document.getElementById(`${currentEditMode}-code-${idx}`).value.trim();
                    doc.sessionPrice = parseFloat(document.getElementById(`${currentEditMode}-price-${idx}`).value) || 0;
                    doc.startDate = document.getElementById(`${currentEditMode}-date-${idx}`).value;
                });
            } else {
                list.forEach((rec, idx) => {
                    rec.name = document.getElementById(`${currentEditMode}-name-${idx}`).value.trim();
                    rec.kashfPrice = parseFloat(document.getElementById(`${currentEditMode}-kprice-${idx}`).value) || 0;
                    rec.motabaaPrice = parseFloat(document.getElementById(`${currentEditMode}-mprice-${idx}`).value) || 0;
                    rec.startDate = document.getElementById(`${currentEditMode}-date-${idx}`).value;
                });
            }
            
            localStorage.setItem('clinic_salary_config', JSON.stringify(staffConfig));
            closeModal('editStaffModal');
            calculateAllSalaries(); 
        }

        window.onload = () => {
            initMonthSelector();
            startDataListener();
        };
    </script>
</body>
</html>
