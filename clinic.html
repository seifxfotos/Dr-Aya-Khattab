<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة انتظار العيادة - د. آية خطاب</title>
    
    <!-- خط كايرو -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات الاحترافية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* المتغيرات الأساسية للوضع النهاري (Light Mode) */
        :root {
            --primary-blue: #0093D0; 
            --primary-green: #8CC63F; 
            --bg-color: #f4f7f6; 
            --card-bg: #ffffff;
            --text-dark: #2c3e50; 
            --danger: #e74c3c; 
            --border: #e1e8ed; 
            --input-bg: #ffffff; 
            --card-shadow: 0 8px 20px rgba(0,0,0,0.04);
            --header-gradient: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
        }

        /* المتغيرات الأساسية للوضع الليلي (Dark Mode) */
        :root[data-theme="dark"] {
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-dark: #e0e0e0;
            --border: #333333; 
            --input-bg: #2c2c2c; 
            --primary-blue: #0082b8; 
            --primary-green: #7bb530;
            --card-shadow: 0 8px 20px rgba(0,0,0,0.4);
            --header-gradient: linear-gradient(135deg, #005a80, #5c8526);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0; padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-switch-wrapper { 
            position: fixed; bottom: 20px; right: 20px; z-index: 1000; 
            background: var(--card-bg); padding: 8px 12px; border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid var(--border); 
            display: flex; align-items: center; transition: 0.3s; 
        }
        
        body.is-display-view .theme-switch-wrapper { display: none !important; }

        .theme-switch { display: inline-block; position: relative; width: 60px; height: 32px; }
        .theme-switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
        .slider .fa-sun { color: #ffeb3b; font-size: 14px; z-index: 1;}
        .slider .fa-moon { color: #f1c40f; font-size: 14px; z-index: 1;}
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 4px; bottom: 4px; background-color: white; transition: .4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-radius: 50%; z-index: 2; }
        input:checked + .slider { background-color: #34495e; }
        input:checked + .slider:before { transform: translateX(28px); }

        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        
        .header-section { 
            background: var(--header-gradient); color: white; padding: 25px 30px; 
            border-radius: 12px; display: flex; justify-content: space-between; 
            align-items: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            flex-wrap: wrap; gap: 15px; transition: background 0.3s;
        }
        .header-section h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .header-subtitle { font-size: 14px; font-weight: 600; opacity: 0.9; margin-top: 5px; }
        
        .stats-counter { 
            background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; 
            font-size: 15px; font-weight: 700; display: flex; gap: 15px; 
            border: 1px solid rgba(255,255,255,0.4); flex-wrap: wrap; 
        }
        .stats-counter span { display: flex; align-items: center; gap: 5px; color: white;}
        
        .date-picker-placeholder {
            font-size: 18px; font-weight: 700; background: rgba(255,255,255,0.2); 
            padding: 8px 15px; border-radius: 8px; border: 1px solid white; color: white; text-align: center;
        }

        .card-panel { 
            background: var(--card-bg); padding: 25px; border-radius: 12px; 
            box-shadow: var(--card-shadow); margin-bottom: 25px; transition: 0.3s;
        }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .input-group input { 
            flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 8px; 
            font-family: 'Cairo'; font-size: 16px; font-weight: 600; outline: none; 
            background-color: var(--input-bg); color: var(--text-dark); transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(0,147,208,0.1); }
        
        .btn-add { 
            background-color: var(--primary-blue); color: white; border: none; 
            padding: 14px 25px; border-radius: 8px; font-weight: 700; font-size: 16px; 
            cursor: pointer; transition: 0.3s; font-family: 'Cairo'; display: flex; align-items: center; gap: 8px; 
        }
        .btn-add:hover { background-color: #007bb5; }

        .patient-item-admin { 
            background: var(--card-bg); padding: 15px 20px; margin-bottom: 12px; 
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--border); border-right: 4px solid var(--primary-green); transition: 0.2s;
        }
        .patient-item-admin:hover { border-right-color: var(--primary-blue); transform: translateX(-2px); }
        .patient-name { font-size: 18px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 10px; transition: 0.3s;}
        
        .patient-name span.num-circle { 
            background: var(--bg-color); color: var(--primary-blue); width: 30px; height: 30px; 
            display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 14px; transition: 0.3s;
            line-height: 0; padding-top: 2px; box-sizing: border-box;
        }
        
        .patient-item-admin.entered { opacity: 0.6; background: var(--bg-color); border-right-color: #95a5a6; }
        .patient-item-admin.entered .patient-name { text-decoration: line-through; color: #7f8c8d; }
        .patient-item-admin.entered span.num-circle { background: var(--border); color: #7f8c8d; }

        .action-btns { display: flex; gap: 6px; align-items: center; }
        .action-btns button { 
            background: var(--input-bg); border: 1px solid var(--border); padding: 8px 12px; 
            border-radius: 6px; cursor: pointer; color: var(--text-dark); transition: 0.2s; 
            font-size: 14px; font-family: 'Cairo'; font-weight: 600; display: flex; align-items: center; gap: 5px;
        }
        .action-btns button:hover { background: var(--bg-color); border-color: #ccc; }
        .btn-delete { color: var(--danger) !important; }
        .btn-delete:hover { background: rgba(231, 76, 60, 0.1) !important; border-color: var(--danger) !important; }
        .btn-enter { color: var(--primary-blue) !important; }
        .btn-enter:hover { background: rgba(0, 147, 208, 0.1) !important; border-color: var(--primary-blue) !important; }
        .btn-undo { color: #f39c12 !important; }
        .btn-undo:hover { background: rgba(243, 156, 18, 0.1) !important; border-color: #f39c12 !important; }
        
        .buttons-grid { display: flex; gap: 15px; margin-top: 20px; }
        .btn-open-display { 
            background-color: var(--primary-green); color: white; border: none; padding: 16px; 
            border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; 
            font-family: 'Cairo'; flex: 1; display: flex; justify-content: center; align-items: center; gap: 10px; 
        }
        .btn-open-display:hover { background-color: #7ab033; }
        .btn-open-doctor { background-color: var(--primary-blue); }
        .btn-open-doctor:hover { background-color: #007bb5; }

        .zoom-controls {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-top: 15px; padding: 15px; background: var(--card-bg); border-radius: 8px; 
            box-shadow: var(--card-shadow); border: 1px solid var(--border); transition: 0.3s;
        }
        .zoom-controls span { font-weight: 700; font-size: 16px; color: var(--text-dark); }
        .zoom-btn { background: var(--input-bg); border: 2px solid var(--primary-blue); color: var(--primary-blue); border-radius: 5px; cursor: pointer; padding: 5px 12px; font-size: 16px; transition: 0.2s; font-weight: bold;}
        .zoom-btn:hover { background: var(--primary-blue); color: white; }

        /* ------------------ شاشة العرض (المرضى) ------------------ */
        #display-view { display: none; height: 100vh; width: 100vw; background-color: var(--bg-color); box-sizing: border-box; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #zoom-wrapper { transform-origin: top center; transition: transform 0.3s ease; width: 100%; height: 100%; padding: 40px; box-sizing: border-box; }
        .display-header { text-align: center; margin-bottom: 40px; padding-bottom: 30px; position: relative;}
        .display-header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: linear-gradient(to left, var(--primary-green), var(--primary-blue)); border-radius: 10px; }
        
        .display-logo { height: 110px; width: auto; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); transition: 0.3s;}
        
        .patient-list-display { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; position: relative;}
        .patient-card { background: var(--card-bg); padding: 20px 30px; font-size: 34px; font-weight: 800; border-radius: 12px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 30px; border-right: 12px solid var(--primary-green); color: var(--text-dark); position: relative; overflow: hidden; transition: all 0.5s ease-in-out, background-color 0.3s, color 0.3s; opacity: 1; transform: translateY(0); }
        .patient-card.entering { animation: slideIn 0.5s ease-out; }
        .patient-card.exiting { opacity: 0; transform: translateX(-50px) scale(0.9); }
        .patient-card.active-patient { border-right-color: var(--primary-blue); transform: scale(1.02); box-shadow: 0 15px 35px rgba(0, 147, 208, 0.2); background: linear-gradient(to left, var(--card-bg), rgba(0, 147, 208, 0.05)); padding: 25px 30px; }
        :root[data-theme="light"] .patient-card.active-patient { background: linear-gradient(to left, #ffffff, #f4faff); }
        .patient-card.active-patient.exiting { transform: scale(0.9) translateX(-50px); }
        .patient-card.active-patient .patient-number { background: var(--primary-blue); transform: scale(1.1); box-shadow: 0 4px 15px rgba(0, 147, 208, 0.3); }
        .patient-card.active-patient::after { content: "القادم"; position: absolute; left: 35px; font-size: 20px; background: var(--primary-blue); color: white; padding: 6px 18px; border-radius: 30px; font-weight: 700; animation: pulse 2s infinite; }
        
        .patient-number { background: var(--primary-green); color: white; min-width: 65px; height: 65px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 32px; font-weight: 800; transition: 0.3s; line-height: 0; padding-top: 4px; box-sizing: border-box; }
        .display-num-fix { display: block; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 147, 208, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(0, 147, 208, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 147, 208, 0); } }

        /* ------------------ شاشة الطبيب الخاصة ------------------ */
        #doctor-view { display: none; }
        .doc-status-indicator { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"><i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i></div>
        </label>
    </div>

    <!-- شاشة السكرتارية (الإدارة) -->
    <div id="admin-view" class="container">
        <div class="header-section">
            <div>
                <h1>إدارة العيادة اليومية</h1>
                <div class="header-subtitle">تنظيم الحجوزات، السكرتارية</div>
            </div>
            <div class="stats-counter">
                <span title="إجمالي الحجوزات الكلية">العدد الكلي: <span id="statKashf">0</span></span>
            </div>
            <div class="date-picker-placeholder" id="todayDate">2026-09-30</div>
        </div>
        
        <div class="card-panel">
            <div class="input-group">
                <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا..." onkeypress="handleEnter(event)">
                <button class="btn-add" onclick="addPatient()"><i class="fa-solid fa-plus"></i> إضافة للجدول</button>
            </div>
            <div id="admin-patient-list"></div>
        </div>

        <div class="buttons-grid">
            <button class="btn-open-display" onclick="openDisplayWindow()">
                <i class="fa-solid fa-desktop"></i> فتح شاشة المرضى
            </button>
            <button class="btn-open-display btn-open-doctor" onclick="openDoctorWindow()">
                <i class="fa-solid fa-user-doctor"></i> فتح شاشة الطبيب
            </button>
        </div>

        <div class="zoom-controls">
            <span>حجم عرض الشاشة للمرضى:</span>
            <button class="zoom-btn" onclick="changeZoom(0.1)" title="تكبير العرض"><i class="fa-solid fa-plus"></i></button>
            <span class="zoom-level-text" id="zoomLevelText">100%</span>
            <button class="zoom-btn" onclick="changeZoom(-0.1)" title="تصغير العرض"><i class="fa-solid fa-minus"></i></button>
        </div>
    </div>

    <!-- شاشة العرض للمرضى -->
    <div id="display-view">
        <div id="zoom-wrapper">
            <div class="display-header">
                <!-- اللوجو الذكي (يتغير حسب الثيم) -->
                <img id="displayModeLogo" src="Logo-Dr-Aya.webp" alt="لوجو د. آية خطاب" class="display-logo" onerror="this.style.display='none'">
            </div>
            <div class="patient-list-display" id="display-patient-list"></div>
        </div>
    </div>

    <!-- شاشة الطبيب (سحابية) -->
    <div id="doctor-view" class="container">
        <div class="header-section">
            <div>
                <h1><i class="fa-solid fa-user-doctor"></i> شاشة الطبيب</h1>
                <div class="header-subtitle">متابعة حية لقائمة الانتظار بالخارج (تحديث تلقائي)</div>
            </div>
            <div class="doc-status-indicator" id="docSyncIndicator">
                <i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال...
            </div>
        </div>
        <div class="card-panel">
            <h3 style="margin-top:0; border-bottom: 2px solid var(--border); padding-bottom:10px; color: var(--primary-blue);">قائمة مرضى اليوم:</h3>
            <div id="doctor-patient-list">
                <div style="text-align:center; padding: 20px; opacity:0.5;"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات من السيرفر...</div>
            </div>
        </div>
    </div>

    <script>
        // ------------------ إدارة تغيير اللوجو الذكي ------------------
        function applyThemeToLogo(theme) {
            const logo = document.getElementById('displayModeLogo');
            if(logo) {
                // إذا كان الوضع ليلي يعرض اللوجو الأبيض، وإلا الملون
                logo.src = theme === 'dark' ? 'Logo-Dr-Aya-W.webp' : 'Logo-Dr-Aya.webp';
            }
        }

        // ------------------ إدارة الثيم ------------------
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        const currentSavedTheme = localStorage.getItem('clinic_queue_theme') || 'light';
        
        if (currentSavedTheme === 'dark') { 
            document.documentElement.setAttribute('data-theme', 'dark'); 
            if(toggleSwitch) toggleSwitch.checked = true; 
        }
        
        if(toggleSwitch) {
            toggleSwitch.addEventListener('change', (e) => { 
                const newTheme = e.target.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme); 
                localStorage.setItem('clinic_queue_theme', newTheme); 
                applyThemeToLogo(newTheme); // تغيير اللوجو فوراً
            });
        }

        // ------------------ المتغيرات الأساسية ------------------
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxOGST_ECovZViYJcjyEa914dDLOmx4kQdxrF-h_nB0R45J-zxeXrS7SQhon8lwsD5H/exec";
        let currentZoom = parseFloat(localStorage.getItem('clinic_zoom')) || 1.0;
        let currentlyDisplayedPatients = [];

        function changeZoom(amount) {
            currentZoom += amount;
            if(currentZoom < 0.5) currentZoom = 0.5; 
            if(currentZoom > 1.5) currentZoom = 1.5; 
            localStorage.setItem('clinic_zoom', currentZoom);
            updateZoomUI();
        }

        function updateZoomUI() {
            const zText = document.getElementById('zoomLevelText');
            if(zText) zText.innerText = Math.round(currentZoom * 100) + '%';
            const zoomWrapper = document.getElementById('zoom-wrapper');
            if(zoomWrapper) zoomWrapper.style.transform = `scale(${currentZoom})`;
        }

        function updateCurrentDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const dateEl = document.getElementById('todayDate');
            if(dateEl) dateEl.innerText = `${year}-${month}-${day}`;
        }

        function checkAndResetDaily() {
            const today = new Date().toLocaleDateString('ar-EG');
            const savedDate = localStorage.getItem('clinic_date');
            if (savedDate !== today) {
                localStorage.setItem('clinic_patients', JSON.stringify([]));
                localStorage.setItem('clinic_date', today);
            }
        }

        function getPatients() {
            const data = localStorage.getItem('clinic_patients');
            return data ? JSON.parse(data) : [];
        }

        function updateStats() {
            const patients = getPatients();
            const stat = document.getElementById('statKashf');
            if(stat) stat.innerText = patients.length; 
        }

        function syncToGoogleSheet(patients) {
            if (!GOOGLE_APP_URL) return;
            const today = new Date().toLocaleDateString('ar-EG').replace(/\//g, '-');
            const patientsData = patients.map(p => ({name: p.name, entered: p.entered}));
            
            fetch(GOOGLE_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ date: today, patients: patientsData })
            }).catch(err => console.log("خطأ في المزامنة: ", err));
        }

        function savePatients(patients) {
            localStorage.setItem('clinic_patients', JSON.stringify(patients));
            renderAdminView();
            updateStats();
            syncToGoogleSheet(patients);
        }

        function addPatient() {
            const input = document.getElementById('patientName');
            const name = input.value.trim();
            if (name) {
                const patients = getPatients();
                patients.push({ id: Date.now(), name: name, entered: false });
                savePatients(patients);
                input.value = '';
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') addPatient(); }

        function deletePatient(index) {
            if(confirm("هل أنت متأكد من حذف هذا الاسم؟")) {
                const patients = getPatients();
                patients.splice(index, 1);
                savePatients(patients);
            }
        }

        function editPatient(index) {
            const patients = getPatients();
            const newName = prompt("تعديل اسم المريض:", patients[index].name);
            if (newName && newName.trim() !== "") {
                patients[index].name = newName.trim();
                savePatients(patients);
            }
        }

        function movePatient(index, direction) {
            const patients = getPatients();
            if (direction === 'up' && index > 0) {
                [patients[index], patients[index - 1]] = [patients[index - 1], patients[index]];
            } else if (direction === 'down' && index < patients.length - 1) {
                [patients[index], patients[index + 1]] = [patients[index + 1], patients[index]];
            }
            savePatients(patients);
        }

        function togglePatientEntered(index) {
            const patients = getPatients();
            patients[index].entered = !patients[index].entered;
            savePatients(patients);
        }

        function openDisplayWindow() { window.open(window.location.pathname + '?view=display', '_blank'); }
        function openDoctorWindow() { window.open(window.location.pathname + '?view=doctor', '_blank'); }

        function renderAdminView() {
            const listContainer = document.getElementById('admin-patient-list');
            if(!listContainer) return;
            const patients = getPatients();
            listContainer.innerHTML = '';
            let displayIndex = 1;

            patients.forEach((p, index) => {
                const isEntered = p.entered;
                const rowClass = isEntered ? 'patient-item-admin entered' : 'patient-item-admin';
                const actionBtn = isEntered ? 
                    `<button class="btn-undo" onclick="togglePatientEntered(${index})" title="تراجع"><i class="fa-solid fa-rotate-left"></i> تراجع</button>` :
                    `<button class="btn-enter" onclick="togglePatientEntered(${index})" title="تم الدخول"><i class="fa-solid fa-check-circle"></i> دخل</button>`;

                listContainer.innerHTML += `
                    <div class="${rowClass}">
                        <div class="patient-name">
                            <span class="num-circle"><span class="admin-num-fix">${displayIndex}</span></span> 
                            ${p.name}
                        </div>
                        <div class="action-btns">
                            ${actionBtn}
                            <button onclick="movePatient(${index}, 'up')" title="لأعلى" ${isEntered ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="movePatient(${index}, 'down')" title="لأسفل" ${isEntered ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="editPatient(${index})"><i class="fa-solid fa-pen"></i> تعديل</button>
                            <button class="btn-delete" onclick="deletePatient(${index})"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
                displayIndex++;
            });
        }

        function renderDisplayView() {
            const listContainer = document.getElementById('display-patient-list');
            if(!listContainer) return;
            const allPatients = getPatients();
            
            const waitingPatients = allPatients.filter(p => !p.entered);
            const patientsToShow = waitingPatients.slice(0, 10);
            
            const disappearedPatients = currentlyDisplayedPatients.filter(
                oldP => !patientsToShow.find(newP => newP.id === oldP.id)
            );
            
            disappearedPatients.forEach(dp => {
                const el = document.getElementById(`patient-${dp.id}`);
                if (el) {
                    el.classList.add('exiting');
                    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 500); 
                }
            });

            setTimeout(() => {
                listContainer.innerHTML = '';
                patientsToShow.forEach((p, index) => {
                    const isNew = !currentlyDisplayedPatients.find(cp => cp.id === p.id);
                    const activeClass = index === 0 ? 'active-patient' : '';
                    const enteringClass = isNew ? 'entering' : '';
                    
                    listContainer.innerHTML += `
                        <div class="patient-card ${activeClass} ${enteringClass}" id="patient-${p.id}">
                            <div class="patient-number"><span class="display-num-fix">${index + 1}</span></div>
                            <div>${p.name}</div>
                        </div>
                    `;
                });
                currentlyDisplayedPatients = patientsToShow.map(p => ({id: p.id}));
            }, disappearedPatients.length > 0 ? 300 : 0);
        }

        // ------------------ وظائف شاشة الطبيب السحابية ------------------
        async function fetchDoctorData() {
            if (!GOOGLE_APP_URL) return;
            const today = new Date().toLocaleDateString('ar-EG').replace(/\//g, '-');
            const indicator = document.getElementById('docSyncIndicator');
            
            try {
                const res = await fetch(GOOGLE_APP_URL + "?date=" + today);
                const data = await res.json();
                
                if(data && data.status === "success") {
                    renderDoctorList(data.patients || []);
                    indicator.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#ffffff;"></i> متصل ومحدث';
                    indicator.style.color = "white";
                }
            } catch(e) {
                indicator.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> جاري إعادة الاتصال...';
                indicator.style.color = "#ffeb3b";
            }
        }

        function renderDoctorList(patients) {
            const listContainer = document.getElementById('doctor-patient-list');
            listContainer.innerHTML = '';
            
            if(patients.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; padding: 30px; font-weight:bold; opacity:0.5;">لا يوجد مرضى في القائمة اليوم</div>';
                return;
            }

            let displayIndex = 1;
            patients.forEach((p) => {
                const isEntered = p.entered;
                const rowClass = isEntered ? 'patient-item-admin entered' : 'patient-item-admin';
                const iconHTML = isEntered ? 
                    `<span style="color:var(--primary-green); font-weight:bold;"><i class="fa-solid fa-door-closed"></i> بالداخل/انتهى</span>` : 
                    `<span style="color:var(--text-dark); opacity:0.8;"><i class="fa-regular fa-clock"></i> في الانتظار</span>`;

                listContainer.innerHTML += `
                    <div class="${rowClass}" style="padding: 20px;">
                        <div class="patient-name">
                            <span class="num-circle"><span class="admin-num-fix">${displayIndex}</span></span> 
                            ${p.name}
                        </div>
                        <div>
                            ${iconHTML}
                        </div>
                    </div>
                `;
                displayIndex++;
            });
        }

        // ------------------ مستمعات التحديث المحلي ------------------
        window.addEventListener('storage', (e) => {
            if (e.key === 'clinic_patients') {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('view') === 'display') {
                    renderDisplayView();
                } else if (!urlParams.get('view')) {
                    renderAdminView();
                    updateStats();
                }
            }
            if (e.key === 'clinic_zoom') {
                currentZoom = parseFloat(e.newValue) || 1.0;
                updateZoomUI();
            }
            if (e.key === 'clinic_queue_theme') {
                const newTheme = e.newValue;
                document.documentElement.setAttribute('data-theme', newTheme);
                if (toggleSwitch) toggleSwitch.checked = newTheme === 'dark';
                applyThemeToLogo(newTheme); // تبديل اللوجو عبر كل الصفحات المفتوحة
            }
        });

        // ------------------ التهيئة (Init) ------------------
        function init() {
            applyThemeToLogo(currentSavedTheme); // ضبط اللوجو في البداية حسب الثيم المحفوظ
            updateCurrentDate();
            checkAndResetDaily();
            const urlParams = new URLSearchParams(window.location.search);
            const view = urlParams.get('view');
            
            if (view === 'display') {
                document.getElementById('admin-view').style.display = 'none';
                document.getElementById('doctor-view').style.display = 'none';
                document.getElementById('display-view').style.display = 'block';
                document.body.classList.add('is-display-view');
                const patients = getPatients();
                currentlyDisplayedPatients = patients.filter(p => !p.entered).slice(0, 10).map(p => ({id: p.id}));
                renderDisplayView();
                updateZoomUI(); 
            } 
            else if (view === 'doctor') {
                document.getElementById('admin-view').style.display = 'none';
                document.getElementById('display-view').style.display = 'none';
                document.getElementById('doctor-view').style.display = 'block';
                
                // تحديث سريع جداً للطبيب (كل ثانيتين)
                fetchDoctorData();
                setInterval(fetchDoctorData, 2000); 
            }
            else {
                document.getElementById('display-view').style.display = 'none';
                document.getElementById('doctor-view').style.display = 'none';
                document.getElementById('admin-view').style.display = 'block';
                renderAdminView();
                updateStats();
                updateZoomUI(); 
            }
        }

        init();
    </script>
</body>
</html>
