<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة انتظار العيادة - د. آية خطاب</title>
    
    <!-- خط كايرو ومكتبة الأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* المتغيرات الأساسية للوضع النهاري (Light Mode) */
        :root {
            --primary-blue: #0093D0; 
            --primary-green: #8CC63F; 
            --bg-color: #f4f7f6; 
            --card-bg: #ffffff;
            --text-dark: #2c3e50; 
            --danger: #e74c3c; 
            --border: #e1e8ed; 
            --input-bg: #ffffff; 
            --card-shadow: 0 8px 20px rgba(0,0,0,0.04);
            --header-gradient: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
            --modal-overlay: rgba(0,0,0,0.5);
        }

        /* المتغيرات الأساسية للوضع الليلي (Dark Mode) */
        :root[data-theme="dark"] {
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --text-dark: #e0e0e0;
            --border: #333333; 
            --input-bg: #2c2c2c; 
            --primary-blue: #0082b8; 
            --primary-green: #7bb530;
            --card-shadow: 0 8px 20px rgba(0,0,0,0.4);
            --header-gradient: linear-gradient(135deg, #005a80, #5c8526);
            --modal-overlay: rgba(0,0,0,0.8);
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }

        .theme-switch-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: var(--card-bg); padding: 8px 12px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid var(--border); display: flex; align-items: center; transition: 0.3s; }
        body.is-display-view .theme-switch-wrapper { display: none !important; }
        .theme-switch { display: inline-block; position: relative; width: 60px; height: 32px; }
        .theme-switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
        .slider .fa-sun { color: #ffeb3b; font-size: 14px; z-index: 1;}
        .slider .fa-moon { color: #f1c40f; font-size: 14px; z-index: 1;}
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 4px; bottom: 4px; background-color: white; transition: .4s cubic-bezier(0.68, -0.55, 0.265, 1.55); border-radius: 50%; z-index: 2; }
        input:checked + .slider { background-color: #34495e; }
        input:checked + .slider:before { transform: translateX(28px); }

        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        
        .header-section { background: var(--header-gradient); color: white; padding: 25px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 15px; transition: background 0.3s; }
        .header-section h1 { margin: 0; font-size: 24px; font-weight: 800; }
        .header-subtitle { font-size: 14px; font-weight: 600; opacity: 0.9; margin-top: 5px; }
        
        .stats-counter { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; font-size: 15px; font-weight: 700; display: flex; gap: 15px; border: 1px solid rgba(255,255,255,0.4); flex-wrap: wrap; }
        .stats-counter span { display: flex; align-items: center; gap: 5px; color: white;}
        
        .date-picker-placeholder { font-size: 18px; font-weight: 700; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 8px; border: 1px solid white; color: white; text-align: center; }

        .card-panel { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 25px; transition: 0.3s; }
        
        .input-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .input-group input { flex: 1; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Cairo'; font-size: 16px; font-weight: 600; outline: none; background-color: var(--input-bg); color: var(--text-dark); transition: 0.3s; }
        .input-group input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(0,147,208,0.1); }
        
        .btn-add { background-color: var(--primary-blue); color: white; border: none; padding: 14px 25px; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; display: flex; align-items: center; gap: 8px; }
        .btn-add:hover { background-color: #007bb5; }

        .patient-item-admin { background: var(--card-bg); padding: 15px 20px; margin-bottom: 12px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); border-right: 4px solid var(--primary-green); transition: 0.2s; }
        .patient-item-admin:hover { border-right-color: var(--primary-blue); transform: translateX(-2px); }
        
        .patient-name-container { display: flex; align-items: center; gap: 10px; }
        .clickable-name { font-size: 18px; font-weight: 700; color: var(--text-dark); cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .clickable-name:hover { color: var(--primary-blue); text-decoration: underline; }
        .clickable-name i { font-size: 13px; opacity: 0.6; }
        
        .patient-name-container span.num-circle { background: var(--bg-color); color: var(--primary-blue); width: 30px; height: 30px; display: flex; justify(center); align-items: center; border-radius: 50%; font-size: 14px; transition: 0.3s; line-height: 0; padding-top: 2px; box-sizing: border-box; }
        .admin-num-fix { transform: translateY(-2px); display: inline-block; line-height: 1; }
        
        .patient-item-admin.entered { opacity: 0.5; background: var(--bg-color); border-right-color: #95a5a6; }
        .patient-item-admin.entered .clickable-name { text-decoration: line-through; color: #7f8c8d; }
        .patient-item-admin.entered .clickable-name:hover { color: var(--primary-blue); text-decoration: underline line-through; }
        .patient-item-admin.entered span.num-circle { background: var(--border); color: #7f8c8d; }

        .patient-item-admin.current-inside { border-right-color: var(--primary-blue); background: linear-gradient(to left, var(--card-bg), rgba(0, 147, 208, 0.08)); opacity: 1; }
        .patient-item-admin.current-inside .clickable-name { color: var(--primary-blue); }
        .patient-item-admin.current-inside span.num-circle { background: var(--primary-blue); color: white; }

        .action-btns { display: flex; gap: 6px; align-items: center; }
        .action-btns button { background: var(--input-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text-dark); transition: 0.2s; font-size: 14px; font-family: 'Cairo'; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .action-btns button:hover { background: var(--bg-color); border-color: #ccc; }
        .btn-delete { color: var(--danger) !important; }
        .btn-delete:hover { background: rgba(231, 76, 60, 0.1) !important; border-color: var(--danger) !important; }
        .btn-enter { color: var(--primary-blue) !important; }
        .btn-enter:hover { background: rgba(0, 147, 208, 0.1) !important; border-color: var(--primary-blue) !important; }
        .btn-undo { color: #f39c12 !important; }
        .btn-undo:hover { background: rgba(243, 156, 18, 0.1) !important; border-color: #f39c12 !important; }
        
        .buttons-grid { display: flex; gap: 15px; margin-top: 20px; }
        .btn-open-display { background-color: var(--primary-green); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; font-family: 'Cairo'; flex: 1; display: flex; justify(center); align-items: center; gap: 10px; }
        .btn-open-display:hover { background-color: #7ab033; }
        .btn-open-doctor { background-color: var(--primary-blue); }
        .btn-open-doctor:hover { background-color: #007bb5; }

        .zoom-controls { display: flex; justify(center); align-items: center; gap: 15px; margin-top: 15px; padding: 15px; background: var(--card-bg); border-radius: 8px; box-shadow: var(--card-shadow); border: 1px solid var(--border); transition: 0.3s; }
        .zoom-controls span { font-weight: 700; font-size: 16px; color: var(--text-dark); }
        .zoom-btn { background: var(--input-bg); border: 2px solid var(--primary-blue); color: var(--primary-blue); border-radius: 5px; cursor: pointer; padding: 5px 12px; font-size: 16px; transition: 0.2s; font-weight: bold;}
        .zoom-btn:hover { background: var(--primary-blue); color: white; }

        /* ------------------ شاشة العرض (المرضى) ------------------ */
        #display-view { display: none; height: 100vh; width: 100vw; background-color: var(--bg-color); box-sizing: border-box; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #zoom-wrapper { transform-origin: top center; transition: transform 0.3s ease; width: 100%; height: 100%; padding: 40px; box-sizing: border-box; }
        .display-header { text-align: center; margin-bottom: 40px; padding-bottom: 30px; position: relative;}
        .display-header::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 4px; background: linear-gradient(to left, var(--primary-green), var(--primary-blue)); border-radius: 10px; }
        
        .display-logo { height: 110px; width: auto; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05)); transition: 0.3s;}
        
        .patient-list-display { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; position: relative;}
        .patient-card { background: var(--card-bg); padding: 20px 30px; font-size: 34px; font-weight: 800; border-radius: 12px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 30px; border-right: 12px solid var(--primary-green); color: var(--text-dark); position: relative; overflow: hidden; transition: all 0.5s ease-in-out, background-color 0.3s, color 0.3s; opacity: 1; transform: translateY(0); }
        .patient-card.entering { animation: slideIn 0.5s ease-out; }
        .patient-card.exiting { opacity: 0; transform: translateX(-50px) scale(0.9); }
        .patient-card.active-patient { border-right-color: var(--primary-blue); transform: scale(1.02); box-shadow: 0 15px 35px rgba(0, 147, 208, 0.2); background: linear-gradient(to left, var(--card-bg), rgba(0, 147, 208, 0.05)); padding: 25px 30px; }
        :root[data-theme="light"] .patient-card.active-patient { background: linear-gradient(to left, #ffffff, #f4faff); }
        .patient-card.active-patient.exiting { transform: scale(0.9) translateX(-50px); }
        .patient-card.active-patient .patient-number { background: var(--primary-blue); transform: scale(1.1); box-shadow: 0 4px 15px rgba(0, 147, 208, 0.3); }
        .patient-card.active-patient::after { content: "القادم"; position: absolute; left: 35px; font-size: 20px; background: var(--primary-blue); color: white; padding: 6px 18px; border-radius: 30px; font-weight: 700; animation: pulse 2s infinite; }
        
        .patient-number { background: var(--primary-green); color: white; min-width: 65px; height: 65px; display: flex; justify(center); align-items: center; border-radius: 50%; font-size: 32px; font-weight: 800; transition: 0.3s; line-height: 0; padding-top: 4px; box-sizing: border-box; }
        .display-num-fix { display: block; transform: translateY(-4px); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(0, 147, 208, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(0, 147, 208, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 147, 208, 0); } }

        /* ------------------ شاشة الطبيب الخاصة ------------------ */
        #doctor-view { display: none; }
        .doc-status-indicator { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.4); }

        /* Custom Modals */
        .custom-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--modal-overlay); z-index: 9999; justify(center); align-items: center; backdrop-filter: blur(3px); }
        .custom-modal-box { background: var(--card-bg); padding: 30px; border-radius: 15px; box-shadow: var(--card-shadow); width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border); transition: 0.3s; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .custom-modal-icon { font-size: 40px; margin-bottom: 15px; color: var(--primary-blue); }
        .custom-modal-title { margin: 0 0 10px 0; font-size: 22px; font-weight: 800; color: var(--text-dark); }
        .custom-modal-message { font-size: 16px; margin-bottom: 20px; color: var(--text-dark); opacity: 0.8;}
        .custom-modal-input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 20px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Cairo'; font-size: 16px; background: var(--input-bg); color: var(--text-dark); outline: none; transition: 0.3s; }
        .custom-modal-input:focus { border-color: var(--primary-blue); }
        .custom-modal-actions { display: flex; gap: 10px; justify(center); }
        .btn-modal-cancel { background: var(--border); color: var(--text-dark); border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size:16px; transition: 0.2s; flex: 1; }
        .btn-modal-cancel:hover { background: #ccc; color: black; }
        .btn-modal-confirm { background: var(--primary-blue); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size:16px; transition: 0.2s; flex: 1; }
        .btn-modal-confirm:hover { filter: brightness(1.1); }
        .danger-modal .custom-modal-icon { color: var(--danger); }
        .danger-modal .btn-modal-confirm { background: var(--danger); }
    </style>
</head>
<body>

    <!-- التنبيهات المخصصة -->
    <div id="custom-modal-overlay" class="custom-modal-overlay">
        <div id="custom-modal-box" class="custom-modal-box">
            <div id="custom-modal-icon" class="custom-modal-icon"><i class="fa-solid fa-circle-question"></i></div>
            <h3 id="custom-modal-title" class="custom-modal-title">تنبيه</h3>
            <p id="custom-modal-message" class="custom-modal-message"></p>
            <input type="text" id="custom-modal-input" class="custom-modal-input" style="display: none;" />
            <div class="custom-modal-actions">
                <button id="custom-modal-cancel" class="btn-modal-cancel">إلغاء</button>
                <button id="custom-modal-confirm" class="btn-modal-confirm">تأكيد</button>
            </div>
        </div>
    </div>

    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"><i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i></div>
        </label>
    </div>

    <!-- شاشة السكرتارية (الإدارة) -->
    <div id="admin-view" class="container">
        <div class="header-section">
            <div>
                <h1>إدارة العيادة اليومية</h1>
                <div class="header-subtitle">تنظيم الحجوزات، السكرتارية</div>
            </div>
            <div class="stats-counter">
                <span title="إجمالي الحجوزات الكلية">العدد الكلي: <span id="statKashf">0</span></span>
            </div>
            <div class="date-picker-placeholder" id="todayDate">2026-09-30</div>
        </div>
        
        <div class="card-panel">
            <div class="input-group">
                <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا..." onkeypress="handleEnter(event)">
                <button class="btn-add" onclick="addPatient()"><i class="fa-solid fa-plus"></i> إضافة للجدول</button>
            </div>
            <div id="admin-patient-list"></div>
        </div>

        <div class="buttons-grid">
            <button class="btn-open-display" onclick="openDisplayWindow()">
                <i class="fa-solid fa-desktop"></i> فتح شاشة المرضى
            </button>
            <button class="btn-open-display btn-open-doctor" onclick="openDoctorWindow()">
                <i class="fa-solid fa-user-doctor"></i> فتح شاشة الطبيب
            </button>
        </div>

        <div class="zoom-controls">
            <span>حجم عرض الشاشة للمرضى:</span>
            <button class="zoom-btn" onclick="changeZoom(0.1)" title="تكبير العرض"><i class="fa-solid fa-plus"></i></button>
            <span class="zoom-level-text" id="zoomLevelText">100%</span>
            <button class="zoom-btn" onclick="changeZoom(-0.1)" title="تصغير العرض"><i class="fa-solid fa-minus"></i></button>
        </div>
    </div>

    <!-- شاشة العرض للمرضى -->
    <div id="display-view">
        <div id="zoom-wrapper">
            <div class="display-header">
                <img id="displayModeLogo" src="Logo-Dr-Aya.webp" alt="لوجو د. آية خطاب" class="display-logo" onerror="this.style.display='none'">
            </div>
            <div class="patient-list-display" id="display-patient-list"></div>
        </div>
    </div>

    <!-- شاشة الطبيب (لحظية) -->
    <div id="doctor-view" class="container">
        <div class="header-section">
            <div>
                <h1><i class="fa-solid fa-user-doctor"></i> شاشة الطبيب</h1>
                <div class="header-subtitle">متابعة حية لقائمة الانتظار بالخارج (سرعة لحظية)</div>
            </div>
            <div class="doc-status-indicator" id="docSyncIndicator">
                <i class="fa-solid fa-bolt" style="color:#ffeb3b;"></i> متصل لحظياً
            </div>
        </div>
        <div class="card-panel">
            <h3 style="margin-top:0; border-bottom: 2px solid var(--border); padding-bottom:10px; color: var(--primary-blue);">قائمة مرضى اليوم:</h3>
            <div id="doctor-patient-list">
                <div style="text-align:center; padding: 20px; opacity:0.5;"><i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال بالسيرفر اللحظي...</div>
            </div>
        </div>
    </div>

    <script>
        // --- 🚨 التحديثات الجوهرية هنا (🚨) ---
        // ١. استبدل هذا بالـ Web App URL الجديد من جوجل سكريبت فوق
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbx7wFzVCsy1BhCxlRRt3AifLj9KExvHqf8rSoU5V9HwVH0BdhiTNvP5kZdjNttWy82U/exec"; 
        
        // مسار Firebase
        const FIREBASE_DB_URL = "https://clinic-dr-aya-khattab-default-rtdb.firebaseio.com/"; 

        let firebaseDB = null;
        if (FIREBASE_DB_URL) {
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
            firebaseDB = firebase.database();
        }

        // دالة موحدة لتوليد تاريخ اليوم بتنسيق 'YYYY-MM-DD'
        // (الدالة دي بنناديها "كل مرة" بنضيف أو بنعمل sync عشان لو الوقت عدى ١٢، الموقع يقلب أووتو)
        function getTodayKey() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        // --- المودال المخصص ---
        let modalResolve = null;
        function showCustomModal({ type, title, message, defaultValue = '', isDanger = false, icon = 'fa-circle-question' }) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('custom-modal-overlay');
                const box = document.getElementById('custom-modal-box');
                const titleEl = document.getElementById('custom-modal-title');
                const msgEl = document.getElementById('custom-modal-message');
                const inputEl = document.getElementById('custom-modal-input');
                const iconEl = document.getElementById('custom-modal-icon');

                titleEl.innerText = title;
                msgEl.innerText = message;
                iconEl.innerHTML = `<i class="fa-solid ${icon}"></i>`;

                if(isDanger) box.classList.add('danger-modal');
                else box.classList.remove('danger-modal');

                if(type === 'prompt') {
                    inputEl.style.display = 'block';
                    inputEl.value = defaultValue;
                    setTimeout(() => inputEl.focus(), 100);
                } else {
                    inputEl.style.display = 'none';
                    inputEl.value = '';
                }

                overlay.style.display = 'flex';
                modalResolve = resolve;
            });
        }

        function closeModal(value) {
            document.getElementById('custom-modal-overlay').style.display = 'none';
            if (modalResolve) { modalResolve(value); modalResolve = null; }
        }

        document.getElementById('custom-modal-cancel').onclick = () => closeModal(null);
        document.getElementById('custom-modal-confirm').onclick = () => {
            const input = document.getElementById('custom-modal-input');
            if (input.style.display !== 'none') closeModal(input.value);
            else closeModal(true); 
        };
        document.getElementById('custom-modal-input').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') closeModal(this.value);
        });

        // --- التوجيه لصفحة الكروت ---
        function openPatientCardSearch(patientName) {
            localStorage.setItem('clinic_auto_search_name', patientName);
            window.open('cards.html', '_blank'); 
        }

        // --- الثيم واللوجو ---
        function applyThemeToLogo(theme) {
            const logo = document.getElementById('displayModeLogo');
            if(logo) logo.src = theme === 'dark' ? 'Logo-Dr-Aya-W.webp' : 'Logo-Dr-Aya.webp';
        }
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        const currentSavedTheme = localStorage.getItem('clinic_queue_theme') || 'light';
        if (currentSavedTheme === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); if(toggleSwitch) toggleSwitch.checked = true; }
        if(toggleSwitch) {
            toggleSwitch.addEventListener('change', (e) => { 
                const newTheme = e.target.checked ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme); 
                localStorage.setItem('clinic_queue_theme', newTheme); 
                applyThemeToLogo(newTheme);
            });
        }

        // --- البيانات والوظائف ---
        let currentZoom = parseFloat(localStorage.getItem('clinic_zoom')) || 1.0;
        let currentlyDisplayedPatients = [];

        function changeZoom(amount) { currentZoom += amount; if(currentZoom < 0.5) currentZoom = 0.5; if(currentZoom > 1.5) currentZoom = 1.5; localStorage.setItem('clinic_zoom', currentZoom); updateZoomUI(); }
        function updateZoomUI() { const zText = document.getElementById('zoomLevelText'); if(zText) zText.innerText = Math.round(currentZoom * 100) + '%'; const zoomWrapper = document.getElementById('zoom-wrapper'); if(zoomWrapper) zoomWrapper.style.transform = `scale(${currentZoom})`; }
        function updateCurrentDate() { const dateEl = document.getElementById('todayDate'); if(dateEl) dateEl.innerText = getTodayKey(); }
        
        // --- (🚨) تعديل جوهري في فكر Reset:
        // مش بيمسح خلاص، بس "بينظف" الـ Local View لو التاريخ النهاردة اختلف عن اللي متخزن.
        function checkAndResetDaily() { 
            const today = getTodayKey(); 
            // هنخزن الداتا كلها كأوبجكت شامل التاريخ
            // { date: 'YYYY-MM-DD', patients: [...] }
            let allQueuesData = JSON.parse(localStorage.getItem('clinic_all_daily_data')) || {};
            let todayQueueData = allQueuesData[today] || [];
            
            // بنحفظ تاريخ النهاردة في الـ local عشان الـ init
            localStorage.setItem('clinic_today_local_check', today); 

            // بنرجع القائمة بتاعة النهاردة وبس
            return todayQueueData;
        }

        // --- (🚨) تعديل في الـ Get
        function getTodayPatients() { 
            const today = getTodayKey();
            const allDailyData = JSON.parse(localStorage.getItem('clinic_all_daily_data')) || {};
            // لو التاريخ النهاردة لسه ملوش حاجة، ارجع قائمة فاضية
            return allDailyData[today] || [];
        }

        function updateStats() { const stat = document.getElementById('statKashf'); if(stat) stat.innerText = getTodayPatients().length; }

        // --- (🚨) تعديل في التزامن (الأرشفة)
        function syncToCloud(todayKey, patients) {
            if (firebaseDB) {
                // (🚨) التخزين تحت مسار يومي في الفايربيز
                // وبكدة الفايربيز هيفتح فاضي اوتو بعد الساعة ١٢ عند الدكتور
                firebaseDB.ref(`daily_queues/${todayKey}`).set(patients);
            }
            if (GOOGLE_APP_URL) {
                // بنبعت الداتا دفعة واحدة مع التاريخ عشان الأرشفة
                fetch(GOOGLE_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify({ date: todayKey, patients: patients.map(p => ({name: p.name, entered: p.entered})) }) 
                }).catch(e => console.log(e));
            }
        }

        // --- (🚨) تعديل في الـ Save (بيخزن اليوم بيومه كأرشيف)
        function saveTodayPatients(patients) { 
            const today = getTodayKey();
            
            // ١. تحديث المتصفح المحلي (أرشفة كل يوم بيومه)
            let allDailyData = JSON.parse(localStorage.getItem('clinic_all_daily_data')) || {};
            allDailyData[today] = patients;
            localStorage.setItem('clinic_all_daily_data', JSON.stringify(allDailyData)); 

            // ٢. تحديث الـ View (Admin)
            renderAdminView(); 
            updateStats(); 
            updateCurrentDate(); // في حاله تعديل بعد ١٢
            
            // ٣. التزامن (الفايربيز والارشيف السنوي)
            syncToCloud(today, patients); 
        }
        
        function addPatient() { 
            const input = document.getElementById('patientName'); 
            const name = input.value.trim(); 
            if (name) { 
                const patients = getTodayPatients(); // بجيب قائمة "النهاردة"
                patients.push({ id: Date.now(), name: name, entered: false }); 
                saveTodayPatients(patients); // بحفظها وببعت للتزامن
                input.value = ''; 
            } 
        }
        function handleEnter(e) { if (e.key === 'Enter') addPatient(); }

        async function deletePatient(index) {
            const isConfirmed = await showCustomModal({ type: 'confirm', title: 'تأكيد الحذف', message: 'هل أنت متأكد من حذف هذا الاسم من القائمة؟', isDanger: true, icon: 'fa-trash-can' });
            if(isConfirmed === true) { const patients = getTodayPatients(); patients.splice(index, 1); saveTodayPatients(patients); }
        }

        async function editPatient(index) {
            const patients = getTodayPatients();
            const newName = await showCustomModal({ type: 'prompt', title: 'تعديل الاسم', message: 'قم بتعديل اسم المريض أدناه:', defaultValue: patients[index].name, icon: 'fa-pen-to-square' });
            if (newName !== null && newName.trim() !== "") { patients[index].name = newName.trim(); saveTodayPatients(patients); }
        }

        function movePatient(index, direction) { const patients = getTodayPatients(); if (direction === 'up' && index > 0) { [patients[index], patients[index - 1]] = [patients[index - 1], patients[index]]; } else if (direction === 'down' && index < patients.length - 1) { [patients[index], patients[index + 1]] = [patients[index + 1], patients[index]]; } saveTodayPatients(patients); }
        function togglePatientEntered(index) { const patients = getTodayPatients(); patients[index].entered = !patients[index].entered; saveTodayPatients(patients); }
        function openDisplayWindow() { window.open(window.location.pathname + '?view=display', '_blank'); }
        function openDoctorWindow() { window.open(window.location.pathname + '?view=doctor', '_blank'); }

        function renderAdminView() {
            const listContainer = document.getElementById('admin-patient-list');
            if(!listContainer) return;
            const patients = getTodayPatients();
            listContainer.innerHTML = '';
            let displayIndex = 1;

            patients.forEach((p, index) => {
                const isEntered = p.entered;
                const rowClass = isEntered ? 'patient-item-admin entered' : 'patient-item-admin';
                const actionBtn = isEntered ? 
                    `<button class="btn-undo" onclick="togglePatientEntered(${index})" title="تراجع"><i class="fa-solid fa-rotate-left"></i> تراجع</button>` :
                    `<button class="btn-enter" onclick="togglePatientEntered(${index})" title="تم الدخول"><i class="fa-solid fa-check-circle"></i> دخل</button>`;

                listContainer.innerHTML += `
                    <div class="${rowClass}">
                        <div class="patient-name-container">
                            <span class="num-circle"><span class="admin-num-fix">${displayIndex}</span></span> 
                            <span class="clickable-name" onclick="openPatientCardSearch('${p.name}')" title="ابحث عن ملف هذا المريض">${p.name} <i class="fa-solid fa-magnifying-glass"></i></span>
                        </div>
                        <div class="action-btns">
                            ${actionBtn}
                            <button onclick="movePatient(${index}, 'up')" title="لأعلى" ${isEntered ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-up"></i></button>
                            <button onclick="movePatient(${index}, 'down')" title="لأسفل" ${isEntered ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}><i class="fa-solid fa-arrow-down"></i></button>
                            <button onclick="editPatient(${index})"><i class="fa-solid fa-pen"></i> تعديل</button>
                            <button class="btn-delete" onclick="deletePatient(${index})"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
                displayIndex++;
            });
        }

        function renderDisplayView() {
            const listContainer = document.getElementById('display-patient-list');
            if(!listContainer) return;
            const allPatients = getTodayPatients();
            const waitingPatients = allPatients.filter(p => !p.entered);
            const patientsToShow = waitingPatients.slice(0, 10);
            
            const disappearedPatients = currentlyDisplayedPatients.filter(oldP => !patientsToShow.find(newP => newP.id === oldP.id));
            disappearedPatients.forEach(dp => { const el = document.getElementById(`patient-${dp.id}`); if (el) { el.classList.add('exiting'); setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 500); } });

            setTimeout(() => {
                listContainer.innerHTML = '';
                patientsToShow.forEach((p, index) => {
                    const isNew = !currentlyDisplayedPatients.find(cp => cp.id === p.id);
                    const activeClass = index === 0 ? 'active-patient' : '';
                    const enteringClass = isNew ? 'entering' : '';
                    listContainer.innerHTML += `
                        <div class="patient-card ${activeClass} ${enteringClass}" id="patient-${p.id}">
                            <div class="patient-number"><span class="display-num-fix">${index + 1}</span></div>
                            <div>${p.name}</div>
                        </div>
                    `;
                });
                currentlyDisplayedPatients = patientsToShow.map(p => ({id: p.id}));
            }, disappearedPatients.length > 0 ? 300 : 0);
        }

        function listenToDoctorView() {
            const listContainer = document.getElementById('doctor-patient-list');
            const indicator = document.getElementById('docSyncIndicator');
            const todayKey = getTodayKey(); // عشان الدكتور يبص علي مسار النهاردة بس

            if (!firebaseDB) { listContainer.innerHTML = '<div style="text-align:center; padding: 30px; font-weight:bold; color: var(--danger);">فشل الاتصال بـ Firebase</div>'; indicator.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> غير متصل'; return; }

            // (🚨) بنسمع للمسار اليومي و بس
            firebaseDB.ref(`daily_queues/${todayKey}`).on('value', (snapshot) => {
                const patients = snapshot.val() || [];
                listContainer.innerHTML = '';
                
                if(patients.length === 0) { listContainer.innerHTML = '<div style="text-align:center; padding: 30px; font-weight:bold; opacity:0.5;">لا يوجد مرضى في القائمة لليوم: ' + todayKey + '</div>'; return; }

                let lastEnteredIndex = -1;
                patients.forEach((p, i) => { if(p.entered) lastEnteredIndex = i; });
                let displayIndex = 1;

                patients.forEach((p, i) => {
                    const isEntered = p.entered;
                    let rowClass = 'patient-item-admin';
                    let iconHTML = '';

                    if (isEntered) {
                        if (i === lastEnteredIndex) { rowClass += ' current-inside'; iconHTML = `<span style="color:var(--primary-blue); font-weight:bold;"><i class="fa-solid fa-user-doctor"></i> بالداخل الآن</span>`; } 
                        else { rowClass += ' entered'; iconHTML = `<span style="color:var(--primary-green); font-weight:bold; opacity:0.8;"><i class="fa-solid fa-check-double"></i> انتهى</span>`; }
                    } else {
                        iconHTML = `<span style="color:var(--text-dark); opacity:0.8;"><i class="fa-regular fa-clock"></i> في الانتظار</span>`;
                    }

                    listContainer.innerHTML += `
                        <div class="${rowClass}" style="padding: 20px;">
                            <div class="patient-name-container">
                                <span class="num-circle"><span class="admin-num-fix">${displayIndex}</span></span> 
                                <span class="clickable-name" onclick="openPatientCardSearch('${p.name}')" title="ابحث عن ملف هذا المريض">${p.name} <i class="fa-solid fa-magnifying-glass"></i></span>
                            </div>
                            <div>${iconHTML}</div>
                        </div>
                    `;
                    displayIndex++;
                });
                indicator.innerHTML = '<i class="fa-solid fa-circle-check" style="color:#ffffff;"></i> متصل لحظياً';
            });
        }

        // --- (🚨) تعديل في سماع الـ storage لتوافق الأرشفة
        window.addEventListener('storage', (e) => {
            // لو التغيير في داتا اليوم بيومه
            if (e.key === 'clinic_all_daily_data') {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('view') === 'display') renderDisplayView();
                else if (!urlParams.get('view')) { renderAdminView(); updateStats(); }
            }
            if (e.key === 'clinic_zoom') { currentZoom = parseFloat(e.newValue) || 1.0; updateZoomUI(); }
            if (e.key === 'clinic_queue_theme') {
                const newTheme = e.newValue; document.documentElement.setAttribute('data-theme', newTheme);
                if (toggleSwitch) toggleSwitch.checked = newTheme === 'dark'; applyThemeToLogo(newTheme);
            }
        });

        function init() {
            applyThemeToLogo(currentSavedTheme); updateCurrentDate();
            
            // (🚨) التنظيف المحلي لو التاريخ اختلف عند الريسبشن
            const lastCheckDate = localStorage.getItem('clinic_today_local_check');
            if(lastCheckDate && lastCheckDate !== getTodayKey()) {
                 // كإجراء احتياطي عشان شاشة الريسبشن تفتح فاضية لو كانت مفتوحة من إمبارح
                 location.reload(); 
            }
            
            const view = new URLSearchParams(window.location.search).get('view');
            
            if (view === 'display') {
                document.getElementById('admin-view').style.display = 'none'; document.getElementById('doctor-view').style.display = 'none'; document.getElementById('display-view').style.display = 'block'; document.body.classList.add('is-display-view');
                // بجيب قائمة النهاردة فقط للفيو
                currentlyDisplayedPatients = getTodayPatients().filter(p => !p.entered).slice(0, 10).map(p => ({id: p.id}));
                renderDisplayView(); updateZoomUI(); 
            } 
            else if (view === 'doctor') {
                document.getElementById('admin-view').style.display = 'none'; document.getElementById('display-view').style.display = 'none'; document.getElementById('doctor-view').style.display = 'block';
                // الدكتور بيسمع فايربيز اوتو، مش بيحتاجlocalStorage
                listenToDoctorView();
            }
            else {
                document.getElementById('display-view').style.display = 'none'; document.getElementById('doctor-view').style.display = 'none'; document.getElementById('admin-view').style.display = 'block';
                // (🚨) مهم جداً: أول ما يفتح الريسبشن (النهاردة)، يبعت القائمة الحالية (بتاعة النهاردة) للفايربيز
                // عشان يضمن إن المسار اليومي سليم في الفايربيز (لو الريسبشن هو اول واحد يفتح)
                const patients = getTodayPatients();
                const today = getTodayKey();
                if(firebaseDB && patients.length > 0) firebaseDB.ref(`daily_queues/${today}`).set(patients);
                
                renderAdminView(); updateStats(); updateZoomUI(); 
            }
        }
        init();
    </script>
</body>
</html>
