<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادة</title>
    <style>
        :root {
            --primary-color: #0d47a1; /* أزرق طبي داكن */
            --secondary-color: #1976d2; /* أزرق فاتح */
            --bg-color: #f0f4f8; /* لون خلفية مريح للعين */
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        /* تنسيقات عامة */
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 30px; }
        
        /* أزرار وحقول الإدخال */
        input[type="text"] {
            width: 70%; padding: 15px; font-size: 18px;
            border: 2px solid #ccc; border-radius: 8px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--secondary-color); }
        
        button {
            padding: 15px 20px; font-size: 18px; cursor: pointer;
            border: none; border-radius: 8px; background-color: var(--secondary-color);
            color: var(--white); transition: 0.3s;
        }
        button:hover { background-color: var(--primary-color); }
        .btn-open-display { background-color: #2e7d32; width: 100%; margin-top: 20px; font-weight: bold; }
        
        /* تنسيق قائمة السكرتارية */
        .admin-controls { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
        .patient-item-admin {
            background: var(--white); padding: 15px; margin-bottom: 10px;
            border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        .action-btns button { padding: 8px 12px; font-size: 14px; margin-right: 5px; border-radius: 5px;}
        .btn-edit { background-color: #f57c00; }
        .btn-delete { background-color: #d32f2f; }
        .btn-move { background-color: #607d8b; }

        /* تنسيقات شاشة العرض للمرضى */
        #display-view { display: none; height: 100vh; background-color: var(--bg-color); padding: 50px; box-sizing: border-box; }
        .display-title { font-size: 40px; text-align: center; color: var(--primary-color); margin-bottom: 50px; border-bottom: 4px solid var(--secondary-color); padding-bottom: 20px;}
        .patient-list-display { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
        .patient-card {
            background: var(--white); padding: 30px; font-size: 35px; font-weight: bold;
            border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            display: flex; align-items: center; gap: 20px;
            border-right: 10px solid var(--secondary-color);
            animation: slideIn 0.5s ease-out;
        }
        .patient-number { 
            background: var(--primary-color); color: var(--white); 
            min-width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; 
            border-radius: 50%; font-size: 30px; 
        }

        /* أنيميشن الدخول */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- شاشة السكرتارية (الإدارة) -->
    <div id="admin-view" class="container">
        <h1>🏥 لوحة تحكم العيادة</h1>
        
        <div class="admin-controls">
            <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا..." onkeypress="handleEnter(event)">
            <button onclick="addPatient()">إضافة مريض</button>
        </div>

        <div id="admin-patient-list"></div>

        <button class="btn-open-display" onclick="openDisplayWindow()">🖥️ فتح شاشة عرض المرضى</button>
    </div>

    <!-- شاشة العرض للمرضى (التي ستظهر في التاب الأخرى) -->
    <div id="display-view">
        <div class="display-title">👨‍⚕️ ترتيب الدخول للعيادة</div>
        <div class="patient-list-display" id="display-patient-list"></div>
    </div>

    <script>
        // رابط جوجل شيت الخاص بك
        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxH_Iif36kyvEJQ7g0f9xtflwvzfLddE0V2oFNYhu7kQIFFWeCEw1ezW62uQy7MuA/exec";

        function checkAndResetDaily() {
            const today = new Date().toLocaleDateString('ar-EG');
            const savedDate = localStorage.getItem('clinic_date');
            
            if (savedDate !== today) {
                localStorage.setItem('clinic_patients', JSON.stringify([]));
                localStorage.setItem('clinic_date', today);
            }
        }

        function getPatients() {
            const data = localStorage.getItem('clinic_patients');
            return data ? JSON.parse(data) : [];
        }

        // إرسال البيانات لجوجل شيت في الخلفية
        function syncToGoogleSheet(patients) {
            if (!GOOGLE_APP_URL) return;
            
            const today = new Date().toLocaleDateString('ar-EG').replace(/\//g, '-');
            const namesOnly = patients.map(p => p.name);
            
            fetch(GOOGLE_APP_URL, {
                method: 'POST',
                // وضع no-cors لتجنب أي أخطاء متعلقة بصلاحيات المتصفح مع جوجل
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ date: today, patients: namesOnly })
            }).catch(err => console.log("خطأ في المزامنة: ", err));
        }

        function savePatients(patients) {
            localStorage.setItem('clinic_patients', JSON.stringify(patients));
            renderAdminView();
            // مزامنة فورية مع جوجل شيت عند كل تعديل
            syncToGoogleSheet(patients);
        }

        function addPatient() {
            const input = document.getElementById('patientName');
            const name = input.value.trim();
            if (name) {
                const patients = getPatients();
                patients.push({ id: Date.now(), name: name });
                savePatients(patients);
                input.value = '';
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') addPatient();
        }

        function deletePatient(index) {
            if(confirm("هل أنت متأكد من حذف هذا الاسم؟")) {
                const patients = getPatients();
                patients.splice(index, 1);
                savePatients(patients);
            }
        }

        function editPatient(index) {
            const patients = getPatients();
            const newName = prompt("تعديل اسم المريض:", patients[index].name);
            if (newName && newName.trim() !== "") {
                patients[index].name = newName.trim();
                savePatients(patients);
            }
        }

        function movePatient(index, direction) {
            const patients = getPatients();
            if (direction === 'up' && index > 0) {
                [patients[index], patients[index - 1]] = [patients[index - 1], patients[index]];
            } else if (direction === 'down' && index < patients.length - 1) {
                [patients[index], patients[index + 1]] = [patients[index + 1], patients[index]];
            }
            savePatients(patients);
        }

        function openDisplayWindow() {
            window.open(window.location.pathname + '?view=display', '_blank');
        }

        function renderAdminView() {
            const listContainer = document.getElementById('admin-patient-list');
            const patients = getPatients();
            listContainer.innerHTML = '';

            patients.forEach((p, index) => {
                listContainer.innerHTML += `
                    <div class="patient-item-admin">
                        <span style="font-size: 20px; font-weight: bold;">${index + 1}. ${p.name}</span>
                        <div class="action-btns">
                            <button class="btn-move" onclick="movePatient(${index}, 'up')">⬆️</button>
                            <button class="btn-move" onclick="movePatient(${index}, 'down')">⬇️</button>
                            <button class="btn-edit" onclick="editPatient(${index})">✏️ تعديل</button>
                            <button class="btn-delete" onclick="deletePatient(${index})">🗑️ حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderDisplayView() {
            const listContainer = document.getElementById('display-patient-list');
            const patients = getPatients();
            listContainer.innerHTML = '';

            patients.forEach((p, index) => {
                // يعرض أول 6 مرضى فقط في شاشة الانتظار
                if(index < 6) {
                    listContainer.innerHTML += `
                        <div class="patient-card" id="patient-${p.id}">
                            <div class="patient-number">${index + 1}</div>
                            <div>${p.name}</div>
                        </div>
                    `;
                }
            });
        }

        // مراقبة التغييرات بين الشاشات بشكل لحظي
        window.addEventListener('storage', (e) => {
            if (e.key === 'clinic_patients') {
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('view') === 'display') {
                    renderDisplayView();
                } else {
                    renderAdminView();
                }
            }
        });

        // تهيئة النظام عند فتح الصفحة
        function init() {
            checkAndResetDaily();
            const urlParams = new URLSearchParams(window.location.search);
            
            // تحديد الشاشة المعروضة بناءً على الرابط
            if (urlParams.get('view') === 'display') {
                document.getElementById('admin-view').style.display = 'none';
                document.getElementById('display-view').style.display = 'block';
                renderDisplayView();
            } else {
                renderAdminView();
            }
        }

        init();
    </script>
</body>
</html>
