<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة انتظار العيادة - د. آية خطاب</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root { --primary-blue: #0093D0; --primary-green: #8CC63F; --bg-color: #f4f7f6; --card-bg: #ffffff; --text-dark: #2c3e50; --danger: #e74c3c; --border: #e1e8ed; --input-bg: #ffffff; --card-shadow: 0 8px 20px rgba(0,0,0,0.04); --header-gradient: linear-gradient(135deg, var(--primary-blue), var(--primary-green)); --modal-overlay: rgba(0,0,0,0.5); }
        :root[data-theme="dark"] { --bg-color: #121212; --card-bg: #1e1e1e; --text-dark: #e0e0e0; --border: #333333; --input-bg: #2c2c2c; --primary-blue: #0082b8; --primary-green: #7bb530; --card-shadow: 0 8px 20px rgba(0,0,0,0.4); --header-gradient: linear-gradient(135deg, #005a80, #5c8526); --modal-overlay: rgba(0,0,0,0.8); }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-dark); margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        .theme-switch-wrapper { position: fixed; bottom: 20px; right: 20px; z-index: 1000; background: var(--card-bg); padding: 8px 12px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid var(--border); display: flex; align-items: center; }
        body.is-display-view .theme-switch-wrapper { display: none !important; }
        .theme-switch { display: inline-block; position: relative; width: 60px; height: 32px; }
        .theme-switch input { display: none; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; z-index: 2; }
        input:checked + .slider { background-color: #34495e; }
        input:checked + .slider:before { transform: translateX(28px); }

        .container { max-width: 900px; margin: 30px auto; padding: 20px; }
        .header-section { background: var(--header-gradient); color: white; padding: 25px 30px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-panel { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: var(--card-shadow); margin-bottom: 25px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 30px; }
        .input-group input, .input-group select { padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-family: 'Cairo'; font-size: 15px; font-weight: 700; outline: none; background-color: var(--input-bg); color: var(--text-dark); }
        .input-group input { flex: 2; }
        .input-group select { flex: 1; }
        .btn-add { background-color: var(--primary-blue); color: white; border: none; padding: 14px 25px; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Cairo'; }
        
        .patient-item-admin { background: var(--card-bg); padding: 15px 20px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); border-right: 4px solid var(--primary-green); }
        .patient-name-container { display: flex; align-items: center; gap: 10px; }
        .clickable-name { font-size: 18px; font-weight: 700; color: var(--text-dark); cursor: pointer; }
        .num-circle { background: var(--bg-color); color: var(--primary-blue); width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-weight: 800; }
        
        .badge-tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
        .badge-nutrition { background: rgba(140, 198, 63, 0.15); color: #5a8522; }
        .badge-physio { background: rgba(230, 126, 34, 0.15); color: #d35400; }
        .badge-kashf { background: rgba(0, 147, 208, 0.15); color: var(--primary-blue); }
        .badge-motabaa { background: rgba(155, 89, 182, 0.15); color: #8e44ad; }

        .action-btns { display: flex; gap: 6px; }
        .action-btns button { background: var(--input-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; color: var(--text-dark); font-family: 'Cairo'; font-weight: 600; }
        .buttons-grid { display: flex; gap: 15px; margin-top: 20px; }
        .btn-open-display { background-color: var(--primary-green); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: 700; cursor: pointer; flex: 1; font-family: 'Cairo'; }
        .btn-open-doctor { background-color: var(--primary-blue); }

        #display-view { display: none; height: 100vh; width: 100vw; background-color: var(--bg-color); box-sizing: border-box; overflow: hidden; }
        #zoom-wrapper { transform-origin: top center; width: 100%; height: 100%; padding: 40px; box-sizing: border-box; }
        .patient-list-display { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; }
        .patient-card { background: var(--card-bg); padding: 20px 30px; font-size: 34px; font-weight: 800; border-radius: 12px; display: flex; align-items: center; gap: 30px; border-right: 12px solid var(--primary-green); color: var(--text-dark); }
        .patient-card.active-patient { border-right-color: var(--primary-blue); background: linear-gradient(to left, var(--card-bg), rgba(0, 147, 208, 0.05)); }
        .patient-number { background: var(--primary-green); color: white; min-width: 65px; height: 65px; display: flex; justify-content: center; align-items: center; border-radius: 50%; font-size: 32px; font-weight: 800; }
        #doctor-view { display: none; }
    </style>
</head>
<body>

    <div class="theme-switch-wrapper">
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider round"></div>
        </label>
    </div>

    <div id="admin-view" class="container">
        <div class="header-section">
            <div>
                <h1>إدارة العيادة اليومية</h1>
                <div style="font-size: 14px; opacity: 0.9;">تنظيم الحجوزات، السكرتارية</div>
            </div>
            <div class="date-picker-placeholder" id="todayDate"></div>
        </div>
        
        <div class="card-panel">
            <div class="input-group">
                <input type="text" id="patientName" placeholder="أدخل اسم المريض هنا..." onkeypress="handleEnter(event)">
                <select id="patientCategory">
                    <option value="تغذية علاجية" selected>تغذية علاجية</option>
                    <option value="علاج طبيعي">علاج طبيعي</option>
                </select>
                <select id="patientVisitType">
                    <option value="كشف" selected>كشف</option>
                    <option value="متابعة">متابعة</option>
                </select>
                <button class="btn-add" onclick="addPatient()"><i class="fa-solid fa-plus"></i> إضافة للجدول</button>
            </div>
            <div id="admin-patient-list">
                <div style="text-align:center; padding: 20px; opacity:0.5;"><i class="fa-solid fa-spinner fa-spin"></i> جاري الاتصال...</div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="btn-open-display" onclick="openDisplayWindow()"><i class="fa-solid fa-desktop"></i> شاشة المرضى</button>
            <button class="btn-open-display btn-open-doctor" onclick="openDoctorWindow()"><i class="fa-solid fa-user-doctor"></i> شاشة الطبيب</button>
        </div>
    </div>

    <div id="display-view">
        <div id="zoom-wrapper">
            <div class="patient-list-display" id="display-patient-list"></div>
        </div>
    </div>

    <div id="doctor-view" class="container">
        <div class="header-section">
            <h1><i class="fa-solid fa-user-doctor"></i> شاشة الطبيب</h1>
        </div>
        <div class="card-panel">
            <div id="doctor-patient-list"></div>
        </div>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://clinic-dr-aya-khattab-default-rtdb.firebaseio.com/";
        let firebaseDB = null;
        if (FIREBASE_DB_URL) {
            firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
            firebaseDB = firebase.database();
        }

        let globalPatientsList = [];

        function getTodayKey() {
            const today = new Date();
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }

        function getPatientBadgesHTML(p) {
            const category = p.category || 'تغذية علاجية';
            if (category === 'تغذية علاجية') {
                const vType = p.visitType || 'كشف';
                return `<span class="badge-tag badge-nutrition">تغذية علاجية</span><span class="badge-tag ${vType === 'متابعة' ? 'badge-motabaa' : 'badge-kashf'}">${vType}</span>`;
            }
            return `<span class="badge-tag badge-physio">علاج طبيعي</span>`;
        }

        function syncChanges(newPatientsList) {
            const today = getTodayKey();
            if (firebaseDB) firebaseDB.ref(`daily_queues/${today}`).set(newPatientsList);
        }

        function addPatient() {
            const input = document.getElementById('patientName');
            const category = document.getElementById('patientCategory').value;
            const visitType = (category === 'تغذية علاجية') ? document.getElementById('patientVisitType').value : '-';
            const name = input.value.trim();
            if (name) {
                globalPatientsList.push({ id: Date.now().toString(), name, category, visitType, entered: false });
                syncChanges(globalPatientsList);
                input.value = '';
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') addPatient(); }
        function togglePatientEntered(index) { globalPatientsList[index].entered = !globalPatientsList[index].entered; syncChanges(globalPatientsList); }
        function deletePatient(index) { globalPatientsList.splice(index, 1); syncChanges(globalPatientsList); }

        function renderAdminView(patients) {
            const listContainer = document.getElementById('admin-patient-list');
            if (patients.length === 0) { listContainer.innerHTML = '<div style="text-align:center; padding: 20px; opacity:0.5;">لا يوجد مرضى حالياً.</div>'; return; }
            let html = '';
            patients.forEach((p, index) => {
                html += `<div class="patient-item-admin ${p.entered ? 'entered' : ''}">
                    <div class="patient-name-container">
                        <span class="num-circle">${index + 1}</span>
                        <span class="clickable-name">${p.name}</span>
                        ${getPatientBadgesHTML(p)}
                    </div>
                    <div class="action-btns">
                        <button onclick="togglePatientEntered(${index})">${p.entered ? 'تراجع' : 'دخل'}</button>
                        <button onclick="deletePatient(${index})" style="color:var(--danger)">حذف</button>
                    </div>
                </div>`;
            });
            listContainer.innerHTML = html;
        }

        function renderDoctorView(patients) {
            const listContainer = document.getElementById('doctor-patient-list');
            listContainer.innerHTML = patients.map((p, index) => `
                <div class="patient-item-admin">
                    <div class="patient-name-container"><span class="num-circle">${index + 1}</span> <strong>${p.name}</strong> ${getPatientBadgesHTML(p)}</div>
                    <div>${p.entered ? 'منتهي' : 'انتظار'}</div>
                </div>`).join('');
        }

        function renderDisplayView(patients) {
            const listContainer = document.getElementById('display-patient-list');
            const waiting = patients.filter(p => !p.entered).slice(0, 5);
            listContainer.innerHTML = waiting.map((p, index) => `
                <div class="patient-card ${index === 0 ? 'active-patient' : ''}">
                    <div class="patient-number">${index + 1}</div>
                    <div>${p.name}</div>
                </div>`).join('');
        }

        function openDisplayWindow() { window.open(window.location.pathname + '?view=display', '_blank'); }
        function openDoctorWindow() { window.open(window.location.pathname + '?view=doctor', '_blank'); }

        function init() {
            const today = getTodayKey();
            document.getElementById('todayDate').innerText = today;
            const view = new URLSearchParams(window.location.search).get('view');
            if (view === 'display') { document.getElementById('admin-view').style.display = 'none'; document.getElementById('doctor-view').style.display = 'none'; document.getElementById('display-view').style.display = 'block'; }
            else if (view === 'doctor') { document.getElementById('admin-view').style.display = 'none'; document.getElementById('display-view').style.display = 'none'; document.getElementById('doctor-view').style.display = 'block'; }

            if (firebaseDB) {
                firebaseDB.ref(`daily_queues/${today}`).on('value', (snapshot) => {
                    const rawVal = snapshot.val();
                    globalPatientsList = rawVal ? (Array.isArray(rawVal) ? rawVal : Object.values(rawVal)) : [];
                    if (view === 'display') renderDisplayView(globalPatientsList);
                    else if (view === 'doctor') renderDoctorView(globalPatientsList);
                    else renderAdminView(globalPatientsList);
                });
            }
        }
        init();
    </script>
</body>
</html>
