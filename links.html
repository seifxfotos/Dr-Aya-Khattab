<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Aya Khattab - Links</title>
    
    <!-- Google Fonts: Cairo (Arabic) & Poppins (English) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-blue: #0096cd;
            --primary-teal: #77b500;
            --text-dark: #1e293b;
            --text-gray: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* إخفاء شريط السكرول تماماً مع السماح به كأمان إضافي للشاشات الصغيرة جداً */
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f1f5f9;
            color: var(--text-dark);
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto; /* أمان إضافي مخفي */
            overflow-x: hidden;
            scrollbar-width: none; /* Firefox */
            padding: 1rem;
        }

        /* Animated Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            animation: floatOrb 10s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(0, 150, 205, 0.35);
            top: 5%;
            left: 10%;
        }

        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(119, 181, 0, 0.25);
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.08); }
        }

        /* Main Container */
        .bio-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 36px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px; 
            height: 95dvh; 
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 1.2rem; 
            animation: containerPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes containerPop {
            to { opacity: 1; transform: scale(1); }
        }

        header {
            text-align: center;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-link {
            display: inline-block;
            margin-bottom: 0px; 
            transition: transform 0.4s ease;
        }

        .logo-link:hover {
            transform: scale(1.05);
        }

        .profile-img {
            width: 160px; 
            height: auto;
            object-fit: contain;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .bio-text {
            font-size: 1rem; 
            line-height: 1.5;
            color: var(--text-dark);
            font-weight: 700; 
            padding: 0 5px;
            margin-bottom: 1rem; 
        }

        /* Contact Badges */
        .contact-actions {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .btn-action {
            text-decoration: none;
            padding: 9px 23px; 
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem; 
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); 
        }

        .btn-email {
            background-color: #f0f7ff;
            color: var(--primary-blue);
            border: 1.5px solid #bae6fd; 
        }

        .btn-call {
            background-color: #f0fdf4;
            color: var(--primary-teal);
            border: 1.5px solid #bbf7d0; 
        }

        .btn-action:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        /* Links Grid */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px; 
            width: 100%;
        }

        .link-card {
            background: #ffffff; 
            border-radius: 20px;
            padding: 16px 6px; 
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            border: 1px solid #e2e8f0; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: bouncySlideIn 0.6s forwards;
            text-align: center;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.7s ease;
        }

        .link-card:hover::before {
            left: 200%;
        }

        .link-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 150, 205, 0.12);
            border-color: rgba(0, 150, 205, 0.3);
            background: #ffffff;
        }

        .icon-box {
            width: 50px; 
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.35rem; 
            margin-bottom: 8px;
            color: white;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .link-card:hover .icon-box {
            transform: rotate(360deg);
        }

        .bg-web { background: linear-gradient(135deg, #0096cd, #005b82); }
        .bg-map { background: linear-gradient(135deg, #ea4335, #b31404); }
        .bg-facebook { background: linear-gradient(135deg, #1877F2, #0b50a8); }
        .bg-instagram { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .bg-tiktok { background: linear-gradient(135deg, #000000, #333333); }

        .link-title {
            display: block;
            font-weight: 800;
            font-size: 1rem; 
            font-family: 'Poppins', 'Cairo', sans-serif;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }
        .link-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes bouncySlideIn {
            0% { opacity: 0; transform: translateY(20px); }
            70% { transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Responsive Smart Scaling (Mobile) */
        @media (max-width: 500px) {
            body {
                padding: 0.5rem;
            }
            .bio-container { 
                /* استخدام vh ليتقلص الحجم أوتوماتيكياً مع الشاشات القصيرة */
                padding: 2.5vh 1rem; 
                border-radius: 26px;
                height: 97dvh;
                gap: 1.5vh; 
            }
            .profile-img { 
                /* مرونة في حجم اللوجو */
                width: clamp(100px, 18vh, 145px); 
            } 
            .bio-text { 
                /* الخط يصغر سيكا في الشاشات اللي طولها مقصوص */
                font-size: clamp(0.75rem, 1.8vh, 0.88rem); 
                line-height: 1.4;
                margin-bottom: 0.5vh;
            }
            .contact-actions {
                gap: 2vw;
            }
            .btn-action {
                padding: 1.2vh 4vw; 
                font-size: clamp(0.8rem, 1.8vh, 0.92rem);
            }
            .links-grid {
                gap: 1.5vh; 
            }
            .link-card {
                padding: 1.5vh 4px; 
            }
            .icon-box {
                /* الأيقونات تصغر لو الشاشة قصيرة عشان الباقي يكفي */
                width: clamp(38px, 6.5vh, 48px); 
                height: clamp(38px, 6.5vh, 48px);
                font-size: clamp(1.1rem, 2.5vh, 1.25rem);
                margin-bottom: 1vh;
            }
            .link-title {
                font-size: clamp(0.8rem, 1.8vh, 0.95rem); 
            }
        }
    </style>
</head>
<body>

    <!-- Animated Background Elements -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <div class="bio-container">
        <!-- Header Section -->
        <header>

        <main class="links-grid">

                <div class="icon-box bg-map"><i class="fas fa-map-pin"></i></div>

                    <span class="link-title">عيادة الإسماعيلية</span>

            <!-- 6. عنوان عيادة القاهرة -->
            <a href="https://maps.app.goo.gl/ZJYWAz9ocaPVqzWr8" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="icon-box bg-map"><i class="fas fa-map-pin"></i></div>
                <div class="link-content">
                    <span class="link-title">عيادة القاهرة</span>
                </div>
            </a>

        </main>
    </div>

</body>
</html>
